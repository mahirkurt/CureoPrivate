name: filo kapıları

# NEDEN VAR: bu depo GitHub üzerinden bir Claude Code marketplace'i olarak
# hizmet veriyor — `/plugin marketplace add mahirkurt/CureoPrivate`. Yani main'e
# giren her commit, hiçbir ara aşama olmadan doğrudan kullanıcıların kurduğu
# artefakttır. İki deterministik kapı zaten yazılıydı ama hiçbir şey onları
# otomatik koşturmuyordu; bu iş akışı o boşluğu kapatır.
#
# Her iki kapı da OFFLINE ve ağ erişimsizdir — CI'da secret gerektirmez.
# Canlı MCP sağlığı (tools/fleetkit/audit_plugins.py) BİLİNÇLİ OLARAK dışarıda:
# gerçek uçlara Bearer anahtarıyla vurur, dolayısıyla hem secret ister hem de
# upstream bir arıza yüzünden PR'ları bloke ederdi. O elle koşulur.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kapilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyYAML kur
        run: python -m pip install --quiet pyyaml

      # [1] Türetilmişlik: fleet.yaml → .mcp.json/lock, sürüm zinciri,
      #     vendor'lı fleet_probe bayt-özdeşliği, düzyazı sayıları ve
      #     ([6], 2026-08-07) filoda olmayan sunucu kimliğine atıf.
      - name: sürüklenme kapısı (check_drift)
        run: python3 tools/fleetkit/check_drift.py --all

      # [2] Marketplace sözleşmesi: katalog ↔ disk, skill/agent/komut
      #     frontmatter'ı, hook olay+betik+timeout sözleşmesi, betik sözdizimi.
      #     Bu katmanların hiçbiri türetilmez → [1] onları göremez.
      - name: marketplace sözleşme kapısı (check_marketplace)
        run: python3 tools/fleetkit/check_marketplace.py

      # [3] Davranış süiti şartnameleri (plugin-yerel koşucular). Model
      #     davranışını ÇALIŞTIRMAZ — şartnamenin kendisini denetler: şema,
      #     id benzersizliği, var olmayan sunucu/mod/kapı/dosyaya atıf,
      #     fixture'ların şemadan geçmesi (negatif vakalarda GEÇMEMESİ).
      - name: davranış şartnamesi kapısı (plugin test koşucuları)
        run: |
          set -e
          python -m pip install --quiet jsonschema
          found=0
          for r in plugins/*/tests/run_suites.py; do
            [ -e "$r" ] || continue
            found=1
            echo "── $r"
            ( cd "$(dirname "$(dirname "$r")")" && python3 tests/run_suites.py )
          done
          [ "$found" = 1 ] || echo "koşucu bulunamadı — atlandı"

      # Kapıların kendileri de regresyona uğrayabilir. Bu adım kasıtlı bir
      # kusur enjekte edip kapının onu YAKALADIĞINI doğrular, sonra geri alır —
      # yani "yeşil CI" ile "gerçekten denetleyen CI"yı ayırır.
      - name: kapılar dekoratif değil (mutasyon testi)
        run: |
          set -e
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          def gate(script):
              return subprocess.run([sys.executable, f'tools/fleetkit/{script}', '--quiet'],
                                    capture_output=True).returncode

          checks = [
            ('check_marketplace.py', 'plugins/edupedia/skills/start/SKILL.md',
             lambda s: s.replace('name: start', 'name: bozuk', 1), 'skill adı ≠ dizin'),
            ('check_drift.py', 'plugins/cureolex/skills/cureolex/source_registry.yaml',
             lambda s: s + '\n_mut:\n  - access: { mcp_server: olmayan_sunucu }\n', 'ölü sunucu kimliği'),
            # 2026-08-07 K-4 sınıfı: tırnaksız düz skalar içinde ": " → YAML
            # frontmatter'ın TAMAMI düşer, komut keşfedilemez hâle gelir.
            # Regex tabanlı eski ayrıştırıcı bunu kaçırıyordu.
            ('check_marketplace.py', 'plugins/cureolex/commands/lex-draft.md',
             lambda s: s.replace('description: ', 'description: Mod X: bozuk ', 1),
             'geçersiz YAML frontmatter'),
            # 2026-09-05: kök README katalog tablosundaki sürüm hücresi, kullanıcının
            # plugin listesinde GÖRDÜĞÜ tek sürümdür ama sürüm zincirinde yoktu →
            # `vekayinuvis` 3.4.12→3.4.13 bumpı burada İKİ KEZ bayat kaldı. Artık
            # check_drift [2] bu hücreyi de zincire katıyor; mutasyon onu doğrular.
            # Mutasyon SÜRÜMDEN BAĞIMSIZ: sabit bir sürüm dizgisi yazılsaydı bir
            # sonraki bump'ta sessizce no-op olur, kapı "YAKALADI" sanılırdı.
            ('check_drift.py', 'README.md',
             lambda s: re.sub(r'(\*\* \(Vekayinüvis\) \| )\d+\.\d+\.\d+',
                              r'\g<1>0.0.1', s, count=1),
             'katalog README sürüm hücresi bayat'),
          ]
          fail = False
          for script, path, mutate, label in checks:
              p = pathlib.Path(path); orig = p.read_text(encoding='utf-8')
              mutated = mutate(orig)
              # Mutasyonun KENDİSİ bayatlayabilir: hedef metin değişince
              # `replace`/`sub` sessizce no-op olur, kapı temiz döner ve bu
              # "YAKALADI" sanılırdı — yani mutasyon testi de dekoratifleşirdi.
              # Değişmemiş dosya başarısızlıktır.
              noop = mutated == orig
              p.write_text(mutated, encoding='utf-8')
              args = ['--all'] if script == 'check_drift.py' else []
              rc = subprocess.run([sys.executable, f'tools/fleetkit/{script}', *args, '--quiet'],
                                  capture_output=True).returncode
              p.write_text(orig, encoding='utf-8')
              ok = rc == 1 and not noop
              print(f"  {'YAKALADI' if ok else 'KAÇIRDI '}  {label}  ({script})"
                    + ('  ⚠ MUTASYON NO-OP — hedef metin değişmiş' if noop else ''))
              fail |= not ok
          sys.exit(1 if fail else 0)
          PY

      # [4] Kaynak ucu sözleşmesi (programmatic_source_healthcheck.yaml).
      #     AĞ ister ama SECRET istemez → CI'da koşabilir. BLOKE ETMEZ:
      #     sözleşmenin kendi `on_failure: degrade_and_label` kuralı bir ucun
      #     düşmesinin çıktıyı durdurmamasını emreder; bunu PR bloklayıcısına
      #     çevirmek sözleşmeyi ihlal ederdi. Log'da görünür, kapıyı kapatmaz.
      #     (Araç-düzeyi canlı kapı `check_tools.py` Bearer ister → audit_plugins
      #     ile aynı gerekçeyle CI dışında, elle koşulur.)
      - name: kaynak ucu sağlığı (check_sources — bilgilendirici)
        continue-on-error: true
        run: python3 tools/fleetkit/check_sources.py

      - name: özet
        if: success()
        run: echo "Bloklayan üç kapı temiz ve mutasyon-doğrulandı."
