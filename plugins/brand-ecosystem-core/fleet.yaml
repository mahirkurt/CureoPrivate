# brand-ecosystem-core MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json · .codex-plugin/plugin.json (mcpServers+version) · fleet.lock.json
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all` (ağ gerektirmez)
# Canlı sağlık:     `python3 tools/fleetkit/audit_plugins.py`

version: 2
plugin: brand-ecosystem-core
plugin_version: "1.1.0"

servers:
  - name: brand-verify
    url: https://brand-verify-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: BRAND_VERIFY_MCP_API_KEY
    role: >-
      Canlı marka doğrulama: domain_multi (RDAP+WHOIS iki-kaynak; tek sinyalle 'müsait'
      yok), trademark_multi (EUIPO TMview canlı + WIPO/USPTO/TÜRKPATENT manual deep-link),
      inn_usan_check (INN stem + ilaç-marka çakışması — Claranta yakalar), social_handles,
      llm_namespace, brand_verify_info. brand-maker Adım 3.4/3.5 doğrulamayı buna devreder;
      provenance damgalı, no-fabrication.

  - name: color-a11y
    url: https://color-a11y-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: COLOR_A11Y_MCP_API_KEY
    role: >-
      Deterministik renk erişilebilirliği (brand-visual/figma-forge): contrast_check (WCAG
      2.x + APCA), cvd_simulate (renk körlüğü), generate_scale (Radix 12-adım
      WCAG-zorlamalı), convert_color (OKLCH/CMYK/nearest-Pantone), palette_audit,
      color_info. Her algoritma otoriter spesifikasyona + test vektörüne sabitli; canlı-veri
      değil saf hesap.

  - name: type-foundry
    url: https://type-foundry-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: TYPE_FOUNDRY_MCP_API_KEY
    role: >-
      Font lisans + variable-font metadata (brand-visual/figma-forge): font_search,
      font_lookup (Fontsource + Google Fonts metadata — lisans + tasarımcılar), font_license
      (OFL/Apache/UFL hakları; bilinmeyen→manual EULA), font_variable_axes, fstype_decode,
      type_info. Açık korpus dışı fontlar dürüstçe not-found.

  - name: brand-asset-registry
    url: https://brand-asset-registry-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: BRAND_ASSET_REGISTRY_MCP_API_KEY
    role: >-
      Kalıcı marka-varlık hafızası (D1, append-only versiyonlu):
      registry_put/get/list/history/delete/info. YAZMA yapan tek server. İsim-kararı
      provenance'ı + W3C DTCG design token'ları + logo-lockup ref'leri + notları
      oturumlar-arası saklar → figma-forge/brand-touchpoint sonraki oturumda okur.
      brand-verify doğrulama snapshot'larını kalıcılaştırır.

  - name: culture-linguistics
    url: https://culture-linguistics-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: CULTURE_LINGUISTICS_MCP_API_KEY
    role: >-
      Çok-dilli kültürel/dilbilimsel marka taraması (brand-maker naive-parse +
      disaster-check'in çok-pazar genişlemesi): meaning_check (Wiktionary + Wikidata canlı),
      taboo_check (LDNOOBW 11 dil baked), naive_read_multi (FrequencyWords 8 dil baked —
      Veridya→'ver' pt/es/tr), pronunciation_hint (IPA), culture_screen (tek-atış),
      culture_info. Ana-dil doğrulaması yine şart.

  - name: regulated-claims
    url: https://regulated-claims-mcp.cureonics.workers.dev/mcp
    tier: core
    auth_env: REGULATED_CLAIMS_MCP_API_KEY
    role: >-
      EU düzenlenen-sektör reklam-iddia taraması (brand-maker/brand-story tagline/iddia):
      screen_claim (cosmetic Reg 1223/2009+655/2013 · medical-device MDR Art 7 · supplement
      Reg 1924/2006 · pharma Dir 2001/83/EC Art 87-90) → forbidden + restricted bulgular +
      atıf. mcp_verified:false — rehber taraması, hukuki belirlenim değil;
      regulatory-affairs incelemesi şart. İlaç isim stem'i → brand-verify inn_usan_check.

  - name: socius-vigil
    url: https://socius-vigil-mcp.cureonics.workers.dev/mcp
    tier: support
    auth_env: SOCIUS_VIGIL_MCP_API_KEY
    role: >-
      Sosyal dinleme / OSINT — brand-market-signal skill'inin veri katmanı: gerçek ses-payı
      / sentiment / positioning beyaz-alan (SearXNG→Brave→DDG + Perplexity/Exa enrich +
      sv_sentiment). market-signal ayrı MCP DEĞİL; bu mevcut connector üzerinden bir
      metodoloji skill'i.
