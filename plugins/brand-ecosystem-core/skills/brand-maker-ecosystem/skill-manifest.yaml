manifest_version: '1.0'
skill:
  name: brand-maker-ecosystem
  version: 1.1.0
  title: Ecosystem-Aware Naming Companion for brand-maker
  description: 'Ecosystem-aware reference layer for brand-maker: SB7 brief layer, extended
    personality frameworks (Jung + Aaker 5-D + voice traits) as naming bias, 9-sector global
    naming taxonomy and luxury naming constraints. Activates alongside brand-maker.'
  entry_point: ./SKILL.md
  author: Brand Ecosystem Studio v1.0
  license: Internal skill asset
domains:
- marketing-design
- brand-strategy
classification:
  primary_category: brand-strategy
  secondary_categories:
  - naming-companion
  tags:
  - naming
  - archetype
  - sector taxonomy
  - luxury naming
  - verbal identity
inputs:
- id: naming_brief
  required: true
  description: Brief about naming context (passed through from brand-maker)
  mime_types:
  - text/plain
- id: brand_platform_handoff
  required: false
  description: Optional brand-platform handoff
  mime_types:
  - application/yaml
- id: brand_story_handoff
  required: false
  description: Optional brand-story handoff
  mime_types:
  - application/yaml
outputs:
- id: naming_context_enrichment
  description: Structured enrichment for brand-maker consumption
  mime_type: application/yaml
composition:
  pipe_from:
  - skill: brand-platform
    version_constraint: '>=1.1.0'
    rationale: Platform personality biases naming.
    intermediate_format: application/yaml
  - skill: brand-story
    version_constraint: '>=1.1.0'
    rationale: Narrative biases naming.
    intermediate_format: application/yaml
  - skill: brand-maker
    version_constraint: '>=2.0.0'
    rationale: Companion/peer of brand-maker.
    intermediate_format: application/yaml
  pipe_to:
  - brand-maker
  - brand-visual
  - brand-visual-ecosystem
  - brand-touchpoint
  - brand-launch

verification:
  trigger_test_prompts:
  - Name with strategic context from brand platform
  - Marka ismi ekosistem entegrasyonu
  - Archetype-driven naming for our brand
  - Luxury naming aligned with our positioning
  - Sector-aware naming for fintech
  expected_activation_rate: 0.88
