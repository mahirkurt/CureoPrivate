# --- Input Contract ----------------------------------------------------------
# brand-visual çıplak bir brief'i veya brand-maker verbal identity çıktısını
# alır. Her iki formatla da composable.
inputs:
  - id: brand_brief
    required: true
    description: >
      Marka brief'i: isim + sektör + ya brand-maker'dan gelen tam verbal
      identity raporu ya da kısa brief (marka adı + vizyon cümlesi).
    mime_types:
      - "text/plain"
      - "text/markdown"
    language_hints:
      - tr
      - en
    semantic_requirements:
      - "Marka adı belirtilmiş olmalı (brand-maker final name veya kullanıcının adlandırdığı marka)"
      - "Sektör/kategori belirtilmiş veya brief'ten çıkarılabilir olmalı"
      - "Brief brand-maker çıktısıysa, verbal identity rationale bölümü korunmalı"

  - id: brand_maker_report
    required: false
    description: >
      Opsiyonel: brand-maker'ın Global Sözel Kimlik Raporu output'u.
      Varsa Adım 2 sokratik sorularından önemli bölümü atlanır; arketip,
      pazar, ton çıkarsanır.
    mime_types:
      - "text/markdown"
    schema:
      final_name: "string (1 finalist)"
      strategic_anchor: "string (single word/emotion sahiplenilen kavram)"
      archetype: "enum [12 Jung archetypes] (varsa)"
      target_market: "string (pazar coğrafyası)"
      category: "string (sektör/kategori)"
      taboo_list: "string[] (kullanıcının istemediği görsel motifler)"

  - id: user_preferences_signal
    required: false
    description: >
      Kullanıcının tonalite ve route tercihleri (opsiyonel).
      Brief yeterince zenginse interaktif soruların kısaltılmasına yardım.
    mime_types:
      - "text/plain"
    schema:
      preferred_route: "enum [typographic, geometric, disruptor, adaptive, hybrid]"
      tonality: "string[] (cesur/sakin/premium/erişilebilir/minimal vb.)"
      primary_stage: "enum [mobile-app, web, packaging, b2b-dashboard, signage]"

# --- Output Contract ---------------------------------------------------------
outputs:
  - id: brand_identity_report
    description: >
      Tam Visual Identity System raporu: Executive summary, strategy anchor,
      logomark spec + AI-generated reference, Radix 12-step color system
      (light+dark), typography system (variable fonts), design tokens
      (CSS/Tailwind/JSON), favicon tests, application mockup briefs,
      forbidden variations, bibliography, implementation checklist.
    mime_type: "text/markdown"
    features:
      - "2500-4000 kelimelik agency-grade report"
      - "CSS custom properties (light + dark mode)"
      - "Tailwind config snippet"
      - "W3C Design Tokens JSON export"
      - "WCAG AA + APCA compliance verified"
      - "16px favicon scalability tested"
      - "Bibliography with 13+ canonical sources cited"

  - id: ai_prompt_bundle
    description: >
      UNIFIED MULTI-MODEL PROMPT (UMMP) v1.3: Tek prompt Nano Banana 2
      (Gemini 3.1 Flash Image) + Grok Imagine Aurora-2 için paralel
      çalışacak şekilde 7-element grammar'da üretilir (subject framing /
      form construction / style anchor / technical spec / composition /
      semantic positive-constraint color / 2026 trend anchor). Parameter
      flag yok; narrative paragraph olarak kullanıcıya teslim edilir.
      Model-specific execution notes Nano Banana 2 (Gemini app/AI Studio/
      Vertex, Thinking mode, $0.067/2K), Grok Imagine (grok.com/imagine,
      Quality mode, X Premium+ $16/ay veya SuperGrok), Nano Banana Pro
      (premium hero asset $0.134/2K), Midjourney V7/V8 (legacy fallback,
      parametre addenda ile), Niji 7 (mascot only). Paralel dual-model
      execution matrisi route-based.
    mime_type: "text/plain"
    optional: true

  - id: adaptive_identity_spec
    description: >
      v1.3 Route 4 ÇIKTI: Adaptive/Living Identity system specification.
      Core spine (immutable DNA) + Variable shell (context-responsive)
      architecture. 2-4 variable parameter, 5-12 variant library,
      transition rules (instant/animated/morph/generative/stateful),
      constraint system (%60 minimum visual consistency), design tokens
      (W3C DTCG), implementation brief (CSS+SVG / Figma Variants / 
      Programmatic), governance workflow.
    mime_type: "text/markdown"
    optional: true

  - id: ai_discoverability_spec
    description: >
      v1.3 Adım 5.10 ÇIKTI: Agent-era branding layer. 20-word canonical
      brand description prompt, Schema.org Organization JSON-LD entity
      knowledge card, logo alt text + voice description + pronunciation
      (IPA/ARPABET), agent-era brand manifesto (/brand/manifesto.md),
      5-test AI-SEO audit protocol (Direct Recognition / Contextual
      Recommendation / Comparative Accuracy / Visual Description / 
      Voice UI Readability).
    mime_type: "text/markdown"
    optional: true

  - id: c2pa_provenance_spec
    description: >
      v1.3 Adım 5.11 ÇIKTI: C2PA Content Credentials & AI Provenance
      chain. Generation / Transformation / Publication katmanları, 
      C2PA manifest JSON, vector conversion metadata preservation
      workflow (--preserve-c2pa flag), EU AI Act disclosure templates
      (Tier 1/2/3), trademark application package (USPTO 2025 human
      authorship record, EUIPO, TÜRKPATENT SMK 6769), metadata stripping
      warnings for social platforms.
    mime_type: "text/markdown"
    optional: true

  - id: sonic_identity_brief
    description: >
      v1.3 Adım 5.9 ÇIKTI: Voice-first era sonic identity brief.
      Archetype-driven sonic personality mapping, core motif design
      (length, notes, contour, intervals, rhythm, key/mode, tempo,
      envelope), sonic anchor references, timbre/instrumentation brief,
      use case variations, earcon library spec (7 standard earcons),
      voice persona parameters (pitch/tempo/warmth/formality/accent),
      AI voice model parameters (ElevenLabs/OpenAI TTS/Play.ht),
      production handoff package, licensing framework.
    mime_type: "text/markdown"
    optional: true

  - id: design_tokens_json
    description: >
      W3C Design Tokens Format Module spec'ine uyumlu JSON export,
      Style Dictionary / Figma Variables / Tailwind sync için kullanılır.
    mime_type: "application/json"
    optional: true

  - id: favicon_test_bundle
    description: >
      Logo rendering 16/32/64/192/512 + monochrome variants +
      scalability checklist (mental simulation).
    mime_type: "application/octet-stream"
    optional: true

  - id: production_vector_svg
    description: >
      AI-generated raster (PNG) → production-grade SVG conversion via vtracer
      backend (or Inkscape/Potrace fallback). Includes diagnostic report
      (path count, file size, complexity heuristic) and post-processing
      recommendations for designer manual cleanup.
    mime_type: "image/svg+xml"
    optional: true

  - id: pantone_matching_report
    description: >
      Per brand color: nearest Pantone PMS Coated/Uncoated match via ΔE
      CIEDE2000 algorithm + CMYK approximation (GRACoL profile) + tolerance
      classification (within Pantone resmi ≤2.0 ΔE00 hedefi or fail).
    mime_type: "text/markdown"
    optional: true

  - id: print_production_spec
    description: >
      Comprehensive print production specification: Pantone PMS callouts,
      CMYK conversion, recommended paper stocks (GSM + coated/uncoated),
      print methods (offset/digital/letterpress), finishing options
      (foil/emboss/spot UV), proofing protocol.
    mime_type: "text/markdown"
    optional: true

  - id: motion_language_spec
    description: >
      Brand motion personality spec derived from archetype + tonality:
      duration ladder (4-tier), easing palette (cubic-bezier curves),
      animation primitives (allowed vocabulary + no-go zones), Lottie
      JSON skeleton stub for After Effects designer hand-off.
    mime_type: "text/markdown"
    optional: true

  - id: lottie_skeleton
    description: >
      Lottie Specification v1.0 compliant JSON skeleton for logo entry
      animation. Designer fills shape data in After Effects, exports via
      Bodymovin/LottieFiles plugin to maintain Lottie compatibility.
    mime_type: "application/json"
    optional: true

# --- Composition — Upstream Compatibility ------------------------------------
# brand-maker'dan gelen verbal identity rapor'unu doğrudan kabul eder.
# Bu composition, kullanıcının brand naming → brand visual flow'unu
# otomatik orchestrate etmesini sağlar.
composition:
  pipe_from:
    - skill: brand-maker
      version_constraint: ">=1.0"
      rationale: >
        brand-maker, final marka adı + arketip + stratejik çıpa + hedef pazar
        içeren Global Sözel Kimlik Raporu üretir. brand-visual bu raporu
        girdi olarak alır, sokratik sorulardan interview kısmını atlar ve
        doğrudan Adım 3'te 3 stratejik route üretmeye başlar. Composability
        bu skill ekosisteminin "naming → identity" canonical pipeline'ıdır.
      intermediate_format: "text/markdown"

  # brand-visual outputs flow into downstream skills (medmarketing for
  # healthcare campaigns, alegria-prompt-engine for illustration prompts,
  # carbon-pptx for brand guidelines presentations)
  pipe_to:
    - skill: carbon-pptx
      version_constraint: ">=1.0"
      rationale: >
        brand-visual'ın brand_identity_report output'u, carbon-pptx ile
        brand guidelines sunumuna dönüştürülebilir. Color tokens ve
        typography spec'leri direkt slide'lara aktarılır.
      intermediate_format: "text/markdown"

    - skill: carbon-html-report
      version_constraint: ">=1.0"
      rationale: >
        brand-visual raporu, carbon-html-report ile Paged.js A4 print-ready
        brand book'a dönüştürülebilir (paper brand guidelines document).
      intermediate_format: "text/markdown"

    - skill: medmarketing
      version_constraint: ">=1.0"
      rationale: >
        brand-visual'dan color system + typography + logo brief, medmarketing
        skill'ine healthcare practice identity setup için aktarılır
        (GBP banner design, ad creative templating).
      intermediate_format: "application/json"

    - skill: alegria-prompt-engine
      version_constraint: ">=1.0"
      rationale: >
        brand-visual'ın brand palette ve archetype bilgisi alegria-prompt-engine'e
        illustration prompt generation için aktarılır (pediatric clinic
        ozlemmurzoglu.com tarzı Corporate Memphis asset üretimi).
      intermediate_format: "application/json"

# --- Runtime Requirements ----------------------------------------------------
runtime:
  python:
    version: ">=3.8"
    packages: []  # Standard library only for core scripts
    optional_packages:
      - name: "Pillow"
        purpose: "favicon_simulator.py raster resampling + monochrome conversion"
        install: "pip install Pillow"
      - name: "cairosvg"
        purpose: "favicon_simulator.py SVG → PNG rasterization"
        install: "pip install cairosvg"
        alternatives:
          - "apt install librsvg2-bin  # rsvg-convert system binary"
          - "apt install imagemagick    # magick system binary"
      - name: "vtracer"
        purpose: "vector_trace.py raster→SVG conversion (recommended backend)"
        install: "pip install vtracer"
        alternatives:
          - "cargo install vtracer  # Rust CLI binary"
          - "apt install inkscape   # Inkscape Trace Bitmap fallback"
          - "apt install potrace    # Potrace B/W-only fallback"

  external_tools:
    - name: "Nano Banana 2 (Gemini 3.1 Flash Image)"
      required_for: "v1.3 PRIMARY 2026 — UMMP target model #1. Wordmark + monogram + mockup + Route 4 adaptive variants. 14 reference image, 5 character consistency, 131K context, native C2PA + SynthID, konuşmasal iterasyon."
      version: "gemini-3.1-flash-image-preview (26 Şubat 2026)"
      access: "Gemini app 'Create images' (free tier with watermark) / Google AI Studio (API key) / Vertex AI enterprise / API model ID: gemini-3.1-flash-image-preview, $0.067/2K img (Pro'nun %50'si), $0.12/4K"
    - name: "Grok Imagine Aurora-2"
      required_for: "v1.3 PRIMARY 2026 — UMMP target model #2. Route 3 Disruptor + Route 4 adaptive motion + rapid iteration + image-to-video logo stinger chain. Best-in-class instruction following, contextual material rendering."
      version: "Aurora-2 engine (3 Nisan 2026 update — Speed/Quality/Pro modes)"
      access: "grok.com/imagine (X Premium+ $16/ay) / SuperGrok $30/ay (Pro mode, 1080p) / xAI API (model: grok-imagine-image, endpoint: api.x.ai/v1/images/generations) / GenAIntel partner platform"
    - name: "Nano Banana Pro (Gemini 3 Pro Image)"
      required_for: "v1.3 PREMIUM FALLBACK — Hero asset max fidelity, advanced Thinking mode reasoning, studio-quality text rendering"
      version: "gemini-3-pro-image-preview (2026)"
      access: "Gemini app Pro tier (free tier limited) / AI Studio / Vertex AI / API $0.134/2K img (NB2'nin 2 katı), $0.24/4K"
    - name: "Midjourney V7 / V8 Alpha"
      required_for: "v1.3 LEGACY FALLBACK — Route 2 geometric refinement, --sref consistency. Parametre flag workflow (--ar --s --v --style raw --no)."
      version: ">=7.0 (V8.1 stable Mayıs 2026 bekleniyor)"
