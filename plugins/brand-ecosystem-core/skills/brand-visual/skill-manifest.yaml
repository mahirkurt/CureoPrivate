    v1_3_0_release_notes: >
      Genesis sürümü 2026 "Adaptive Era" paradigma değişimine yanıt verir.
      Markalar artık tek statik logo + görsel sistem değil, AI agent'larla
      konuşan + adaptif contextlere evrilen + voice-first UI'larda duyulan +
      regulatuar provenance içeren **çok katmanlı kimlik sistemleri**.
      v1.3 bu dört katmanı (adaptive, discoverability, provenance, sonic)
      skill protokolüne entegre eder. Geriye dönük uyum tam (v1.0/1.1/1.2
      çıktıları hâlâ produce edilebilir — skill yeni adımları opsiyonel
      bırakabilir). UMMP arşitektüral değişiklik: eski 5-variant output
      deprecated (Nano Banana 2 + Grok Aurora-2 paralel aynı prompt'u kabul
      ediyor; model-spesifik execution notes ile teslim edilir).
