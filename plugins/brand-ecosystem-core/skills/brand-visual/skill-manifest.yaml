# --- Verification Contract ---------------------------------------------------
verification:
  runner: null  # Skill has no automated verify.py (subjective creative output)
  quality_gates:
    - id: G1
      name: "3-Test Doktrini (Chermayeff & Geismar & Haviv)"
      checks:
        - "Appropriateness: Marka arketipi ile uyum var mı?"
        - "Distinctiveness: Sektördeki top 5 rakibe göre belirgin mi?"
        - "Memorability: 5-saniye test + 1-dakika hafıza test geçilir mi?"
      mandatory: true
    - id: G2
      name: "Timelessness (Sagi Haviv extension)"
      checks:
        - "Trend-bağımlı element yok"
        - "50 yıl sonra aynı güçte durabilir"
      mandatory: true
    - id: G3
      name: "Favicon-grade scalability"
      checks:
        - "16px'te silhouette tanınır"
        - "Monokrom varyant çalışır"
        - "Phone-call test geçer"
      mandatory: true
    - id: G4
      name: "Red Lines compliance (sektör klişe reddi)"
      checks:
        - "Literal design klişeleri yok (çatı/stetoskop/çark/diş/kalp vb.)"
        - "AI prompt'larda spesifik marka referansı yok (trademark safety)"
      mandatory: true
    - id: G5
      name: "Color system WCAG + APCA compliance"
      checks:
        - "Step 11 text vs Step 1 bg: APCA Lc ≥ 60"
        - "Step 12 text vs Step 1 bg: APCA Lc ≥ 90"
        - "WCAG AA normal text ratio ≥ 4.5"
      mandatory: true
    - id: G6
      name: "Typography system modernity"
      checks:
        - "Variable font kullanılıyor (veya variable-supporting pair)"
        - "Google Fonts / SIL OFL / commercial license netleştirilmiş"
        - "Logotype lock-up specification (kerning pairs, tracking) verilmiş"
      mandatory: true
    - id: G7
      name: "Design tokens (W3C spec compliance)"
      checks:
        - "CSS custom properties light + dark mode ile export"
        - "JSON W3C Design Tokens Format Module uyumlu"
        - "Tailwind config snippet hazır"
      mandatory: false
    - id: G8
      name: "Vector conversion production-readiness"
      checks:
        - "AI raster output → SVG via vtracer (or fallback) tracked"
        - "Path count + node count + file size diagnostic provided"
        - "Designer manual cleanup recommendation explicit (telif + production-grade için)"
      mandatory: true
    - id: G9
      name: "Pantone PMS matching coverage"
      checks:
        - "Her brand color için en yakın PMS Coated + Uncoated match listed"
        - "ΔE CIEDE2000 < 2.0 ise 'within Pantone tolerance' işareti"
        - "ΔE > 5.0 ise 'no good PMS match — consider custom spot ink' uyarısı"
        - "CMYK approximation (GRACoL) sağlanmış"
      mandatory: true
    - id: G10
      name: "Motion language specification"
      checks:
        - "Archetype-derived motion personality statement (1 paragraf)"
        - "4-tier duration ladder (micro / ui / transition / logo-stinger)"
        - "Primary + secondary easing curves (cubic-bezier values)"
        - "Logo-stinger ≤ 2.5s (All In Motion 2026 enterprise ceiling)"
        - "Light + dark mode variants belirtilmiş"
      mandatory: false
    - id: G11
      name: "v1.3 Adaptive Identity compliance (Route 4 seçildiyse)"
      checks:
        - "Core spine immutable DNA tanımlanmış (1-3 primitive form)"
        - "Variable shell parameters 2-4 arası (time/geo/persona/content/ar/state/interaction)"
        - "Transition rules specified (instant/animated/morph/generative/stateful)"
        - "Minimum 3, optimum 5-12 varyant dokümante"
        - "Favicon 16px core spine-only test geçer"
        - "Core visual consistency ≥60% across all variants"
        - "Primary brand color mandatory in all variants"
      mandatory: false
    - id: G12
      name: "v1.3 UMMP (Unified Multi-Model Prompt) compliance"
      checks:
        - "Prompt narrative paragraph (keyword listesi değil)"
        - "'A professional studio composition of...' ile başlıyor"
        - "7 element tümü var (subject/form/style anchor/tech/composition/color/trend anchor)"
        - "Semantic positive-constraint color direction ('absolutely flat single-tone fill... no color transitions, no luminous gradients...')"
        - "Aspect ratio cümle içinde ('within a square 1:1 frame')"
        - "Favicon scalability ifadesi ('designed for favicon scalability at 16 pixels')"
        - "Style anchor cümle içinde ('rendered in the tradition of X')"
        - "2026 trend anchor sonda ('The visual sensibility is...')"
        - "Parameter flag YOK (NB2 + Grok için)"
        - "Marka adı YOK (Route 1 Kinetic Wordmark hariç)"
        - "Sektör-spesifik negative semantic bank uygulanmış"
      mandatory: true
    - id: G13
      name: "v1.3 AI Discoverability layer (Adım 5.10)"
      checks:
        - "20-word canonical brand description prompt üretildi (10-20 kelime)"
        - "Schema.org Organization JSON-LD entity knowledge card"
        - "Logo alt text (≤125 char) + voice description (1-2 sentence)"
        - "Pronunciation guide (IPA + plain + voice alias)"
        - "Agent-era brand manifesto template (30-line public markdown)"
        - "5-test AI-SEO audit protocol baseline"
      mandatory: true
    - id: G14
      name: "v1.3 C2PA Content Credentials & AI Provenance (Adım 5.11)"
      checks:
        - "Generation layer dokümante (model, date, UMMP prompt, iterations, SynthID ✓, C2PA manifest ✓)"
        - "Transformation layer dokümante (vector conversion, manual cleanup, metadata preservation)"
        - "Publication layer dokümante (primary asset + secondary assets, viewer URL)"
        - "EU AI Act disclosure statement (Tier 1/2/3 appropriate)"
        - "Trademark strategy package (jurisdiction, Nice class, human authorship record)"
        - "AI disclosure in brand book (website footer + press boilerplate)"
      mandatory: true
    - id: G15
      name: "v1.3 Neuro-Inclusive Design audit"
      checks:
        - "CVD (Protanopia/Deuteranopia/Tritanopia) simulation pass"
        - "APCA Lc ≥ 75 primary action"
        - "Minimum complexity — favicon-grade simplification"
        - "Predictable motion patterns (reduced-motion preference honored)"
        - "Alt text spec ready"
      mandatory: false
    - id: G16
      name: "v1.3 Sonic Identity Brief (Adım 5.9, opsiyonel)"
      checks:
        - "Brand archetype → sonic personality mapping"
        - "Core motif spec (length, notes, contour, intervals, key/mode, tempo, envelope)"
        - "2-3 sonic anchor references"
        - "Timbre/instrumentation brief"
        - "Use case variations (full/chime/micro)"
        - "Earcon library (minimum 7 earcons)"
        - "Voice persona parameters (pitch/tempo/warmth/formality/accent/register)"
        - "AI voice model parameters (ElevenLabs/OpenAI TTS/Play.ht)"
        - "Licensing framework"
      mandatory: false

