# --- Protocol Metadata -------------------------------------------------------
manifest_version: "1.0"
protocol_reference: "../smp-orchestrator/examples/SKILL_MANIFEST_PROTOCOL.md"

# --- Skill Identity ----------------------------------------------------------
skill:
  name: brand-visual
  version: "1.3.0"
  title: "Visionary Brand Identity System Protocol — Genesis (2026 Adaptive Era)"
  description: >
    Pentagram / Koto / Wolff Olins seviyesinde vizyoner bir Marka Stratejisti +
    Sanat Yönetmeni + Tasarım Sistemleri Mimarı protokolü. Marka adından veya
    brand-maker verbal identity çıktısından başlayarak, interaktif 4-adım
    akışla stratejik ve zamansız bir Visual Identity System üretir.
    v1.3 Genesis (2026 Adaptive Era) önemli yenilikler:
    (1) 4 stratejik route — Tipografik / Geometrik Gestalt / Radikal
    Farklılaşma + YENİ Route 4 Adaptive/Living Identity (spine + variable shell
    sistemi; Nike/Adobe/Coca-Cola doktrini);
    (2) UNIFIED MULTI-MODEL PROMPT (UMMP) — tek prompt Nano Banana 2 (Gemini
    3.1 Flash Image, 26 Şubat 2026, $0.067/2K) + Grok Imagine Aurora-2 (Ocak
    2026) için paralel çalışır; 7-element grammar (subject framing / form
    construction / style anchor / technical spec / composition / semantic
    positive-constraint color / 2026 trend anchor);
    (3) 2026 TREND LIBRARY — 14 curated trend (warm neo-minimalism,
    hyperfunctional editorial overlay, earthmark organic, kinetic typography,
    tactile dimensional refinement, Pantone Cloud Dancer 2026 COY, generative
    morphing, coauthored open canvas, AI discoverability, v.b.);
    (4) AI DISCOVERABILITY LAYER — agent-era branding (ChatGPT/Claude/Gemini/
    Grok brand recognition), 20-word brand description prompt, Schema.org
    entity knowledge card, logo alt text + pronunciation guide, brand
    manifesto template;
    (5) C2PA CONTENT CREDENTIALS — EU AI Act uyumu, provenance chain
    dokümantasyonu, USPTO 2025 + SMK 6769 trademark strategy;
    (6) SONIC IDENTITY BRIEF — voice-first UI çağı için sonic logo brief,
    earcon library spec, voice persona parameters;
    (7) NEURO-INCLUSIVE DESIGN — CVD simulation, APCA Lc ≥75 enforcement,
    2026 accessibility ekstansiyonu.
    Radix 12-step matematiksel renk sistemi (light/dark, WCAG + APCA,
    Cloud Dancer neutral alternatif), Variable Font tipografi, W3C Design
    Tokens, favicon-grade 16px ölçeklenebilirlik korunur.
  author: "Mahir (internal skill)"
  license: "Internal skill asset, not for external redistribution"
  entry_point: "./SKILL.md"
  homepage: null

