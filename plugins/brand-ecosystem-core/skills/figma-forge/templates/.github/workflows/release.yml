# figma-forge release workflow — template
#
# Drop this into `.github/workflows/release.yml` in your design-system
# repository. Tagging a release (e.g. `git tag v0.1.0 && git push --tags`)
# triggers the workflow, which:
#
#   1. Runs the figma-forge static audit (no Figma PAT required)
#   2. Builds the SHA-256 bundle manifest
#   3. Generates the SLSA v1.0 provenance attestation
#   4. Signs the bundle with Sigstore keyless flow (OIDC identity)
#   5. Uploads manifest + provenance + signature as release artifacts
#
# The workflow requires `id-token: write` permission for the OIDC
# token used by Sigstore keyless signing. No long-lived secrets.
#
# Verifying consumers can then run:
#   python3 scripts/verify.py \
#     --manifest manifest.json --provenance provenance.json \
#     --signature signature.sigstore --library-dir . \
#     --expected-identity 'https://github.com/<org>/<repo>/.github/workflows/release.yml@refs/tags/<tag>'

name: figma-forge release (signed)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: read
  id-token: write   # MANDATORY for Sigstore keyless flow
  packages: write
  attestations: write

jobs:
  audit-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install figma-forge dependencies
        run: |
          pip install sigstore

      - name: Run static audit (CI quality gate)
        run: |
          python3 scripts/publish_audit.py \
            --library-registry library-registry.json \
            --static-only \
            --output-format json \
            --output audit.json

          # Refuse to ship if score < 8.0 (STRONG band threshold)
          python3 -c "
          import json, sys
          d = json.load(open('audit.json'))
          print(f'Score: {d[\"score\"]} ({d[\"band\"]})')
          if d['score'] < 8.0:
              print('::error::Score below 8.0 STRONG threshold; refusing to ship')
              sys.exit(1)
          "

      - name: Build & sign bundle (Sigstore keyless)
        env:
          PYTHON_VERSION: '3.12'
        run: |
          python3 scripts/sign.py \
            --library-dir . \
            --output-dir signed-release/ \
            --identity "${{ github.workflow_ref }}" \
            --source-repository "https://github.com/${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --builder-id "${{ github.workflow_ref }}" \
            --sign-mode sigstore-keyless \
            --verbose

      - name: Verify own signature (smoke test)
        run: |
          python3 scripts/verify.py \
            --manifest signed-release/manifest.json \
            --provenance signed-release/provenance.json \
            --signature signed-release/signature.sigstore \
            --library-dir . \
            --expected-identity "${{ github.workflow_ref }}" \
            --verbose

      - name: Upload signed-release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: signed-release/
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            signed-release/manifest.json
            signed-release/provenance.json
            signed-release/signature.sigstore
          body: |
            ## Signed Release

            This release is cryptographically signed via Sigstore keyless flow.

            **Verify the bundle**:
            ```bash
            python3 scripts/verify.py \
              --manifest manifest.json \
              --provenance provenance.json \
              --signature signature.sigstore \
              --library-dir . \
              --expected-identity "${{ github.workflow_ref }}"
            ```

            **SLSA Build Level**: 2 (provenance generated by trusted CI)
