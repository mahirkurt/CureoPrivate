                 govinfo_search, congress_search, federal_register_search,
                 ecfr_get, ecfr_versions, japan_elaws_search, japan_elaws_fetch,
                 australia_legislation_search, australia_legislation_fetch,
                 canada_justicelaws_fetch, spain_boe_fetch, mexico_dof_nota,
                 china_law_recent, china_law_detail, ireland_eisb_fetch]
    role: >-
      YABANCI ÜLKE sağlık mevzuatı resmî-metin portalları: US (eCFR T21/FedReg/
      GovInfo/Congress), CA JusticeLaws, JP e-LAWS, AU FRL, ES BOE, IE eISB,
      CN NPC, MX DOF. Semantik sıra: semantic_search (keşif) →
      govinfo/congress/federal_register/japan_elaws_search/australia_legislation_search/
      china_law_recent (ID keşfi) → ilgili *_fetch/ecfr_get/ecfr_versions (doğrulama)
      → legal_distill_start/result (çok-yargı sunucu-tarafı distil). ID-only
