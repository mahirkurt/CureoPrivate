      doldurma / "0001 gönderildi" iddiası yok (ops → pharmaintel).
    degrade: >-
      Erişilemezse ICH referansları 'manual_required' (ich.org deep-link);
      G6'nın harmonizasyon ayağı doğrulanamaz → CONDITIONAL.

  - name: intl-treaty
    url: https://intl-treaty-mcp.cureonics.workers.dev/mcp
    # 2026-08-07 oturumunda ÖLÇÜLEN claude.ai connector adı (tahmin değil).
    tool_prefixes:
      - mcp__intl-treaty__
      - mcp__claude_ai_International_Treaty__
    tier: comparative
    auth_env: INTL_TREATY_MCP_API_KEY
    # S1 = Anayasa Md.90/5 üst-norm (DRAFT/AMEND/COMPLY/TBMM gerekçe);
    # S2 = COMPARATIVE_LAW. Tek shard sessiz yetenek kaybıdır (FR-17 / FR-27).
    shard: [S1, S2]
    modes: [ALL]
    gate: G6
