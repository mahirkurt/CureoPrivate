    # Duman bu biçimi her koşumda doğrular. Kanun METNİ uydurma — yalnız
    # connector zarfındaki alanları (title/status/eli/url) aktar.
    smoke:
      tool: fedlex_get_law_by_sr
      args: { params: { sr_number: "812.21" } }
    role: >-
      İsviçre federal hukuku (Fedlex SPARQL) — `Fedlex Swiss` companion'ının
      WIRE'LI karşılığı (2026-08-08). HP self-host: upstream `fedlex-mcp`
      (MIT, PyPI, sürüm PİNLİ 2.0.1) 127.0.0.1:8321'de ANAHTARSIZ koşar,
      önünde tek-kiracılı OAuth 2.1 kapısı (:8317 → fedlex.cureonics.com).
      Upstream 12 araç; `tools_used` = 7 SR/birincil + 3 Vernehmlassung
      (danışma) — fantom beyan yok. `fedlex_get_recent_publications` +
      `termdat_get_concept` hâlâ conscious exclude.
      İSTEMCİ ÇAĞRI SÖZLEŞMESİ: her tools/call argümanı `params` sarmalayıcısında.
      SEMANTİK SIRA: (1) SEARCH BEFORE GET —
      `fedlex_search_laws({"params":{"keywords":"…"}})` (`query` YOK) →
      `fedlex_get_law_by_sr({"params":{"sr_number":"…"}})` (noktalı SR, örn.
      812.21) → history / upcoming / treaties / gazette / termdat_lookup_term;
      (2) **RIA (Mod 6) paydaş/alternatif bölümünde**, SR get'ten SONRA CH
      danışma manzarası:
      `fedlex_get_open_consultations` → `fedlex_search_consultations` →
      `fedlex_get_consultation({params:{event_id}})` (eventId açık listeden;
      uydurma yok). Vernehmlassung = İsviçre ön-parlamento usulü — TR
      yönetmelik DRAFT/5210 görüş sürecinin ikamesi DEĞİLDİR; mukayese/RIA
      benchmark olarak aktarılır. Identifier = SR; konsolide ELI `eli/cc/…`
      (eli/fga = BBl/taslak — birincil metin diye sunma). Kapı Authorization'ı
      upstream'e iletmez; upstream düşükse 502 + açık hata.
      DOĞRULAMA (2026-08-08; 2026-08-17 yeniden): SR 812.21 → HMG,
      `eli/cc/2001/422`, "✅ In Kraft", yürürlük 2002-01-01. Metin icat etme.
    degrade: >-
      Erişilemezse CH birincil metni programatik yedeğe düşer (ep.fedlex_sparql,
      references/15 §3b) — orada `a jolux:ConsolidationAbstract` filtresi ve
