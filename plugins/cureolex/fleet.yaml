# cureolex MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json
#   .codex-plugin/plugin.json  (mcpServers bloğu + version)
#   .cursor-plugin/plugin.json (version + mcpServers yolu, dosya varsa)
#   .cursor-plugin/mcp.json    (Cursor ${env:VAR} interpolasyonu)
#   fleet.lock.json            (hook'ların okuduğu stdlib-türev)
#   CONNECTORS.md              (⟨GEN⟩ connector roster)
#   commands/lex-connectors.md (⟨GEN⟩ anahtar tablosu)
#   agents/*.md                (⟨GEN⟩ tools: satırı)
#   skills/cureolex/references/00-mod-pipelines.md (⟨GEN⟩ mod×server matrisi)
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all`
# Canlı sağlık:     `python3 hooks/scripts/fleet_probe.py --fresh`
#
# NEDEN VAR: 2026-08-02'de TİTCK kapılandı (Worker cache emekli, önbellek sunucuya
# taşındı). cureolex onu "public" saymaya devam etti; katman her çağrıda 401
# aldı ve arıza DÖRT ayrı yerde birden saklandı (.mcp.json header'sız + _role
# "gate yok" + hook GATED sözlüğünde yok + /lex-connectors tablosu "public").
# Filo tek yerden türetilmedikçe bu sınıf arıza kaçınılmazdır.

version: 2
plugin: cureolex
plugin_version: "3.8.7"

# Düzyazıdaki "N MCP / N companion" iddialarını gerçek sayıyla karşılaştır.
# cureolex bu sayıları G0 kapı ölçütü olarak kullandığı için açık.
prose_count_check: true

# ─────────────────────────────────────────────────────────────────────────────
# WIRE EDİLEN SUNUCULAR (.mcp.json'a girer)
#
# tier   : primary | secondary | comparative | support | doctrine | fulltext | substrate
# shard  : S1 TR-çekirdek · S2 karşılaştırmalı · S3 doktrin · S4 tam-metin · ALL (her shard'a girer)
#          LİSTE de olabilir ([S1, S2]) — bir sunucu gerçekten iki shard'a aitse.
#          Ajan `tools:` KATI allowlist olduğu için yanlış shard = sessiz yetenek kaybı.
# smoke  : (ops.) {tool, args} — argümansız bilgi aracı olmayan sunucular için
#          check_tools --call'un çağıracağı KÜÇÜK salt-okunur sorgu.
# modes  : [ALL] veya modların alt kümesi
# gate   : bağlı olduğu kalite kapısı (G5/G6/G7) veya null
# ─────────────────────────────────────────────────────────────────────────────
servers:

  # ── S1 · TR çekirdek ───────────────────────────────────────────────────────
  - name: mevzuat
    url: https://mevzuat.cureonics.com/mcp
    tier: primary
    auth_env: MEVZUAT_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [search_mevzuat, search_kanun, list_mevzuat_types, list_mevzuat_by_type,
                 get_mevzuat_detail, get_mevzuat_madde_tree, get_mevzuat_madde_diff,
                 get_mevzuat_timeline, get_mevzuat_relations, get_mevzuat_gerekce,
                 get_anayasa, get_onceki_metinler, search_mulga_mevzuat,
                 search_mevzuat_fihristi, build_mevzuat_semantic_context,
                 resolve_resmi_gazete, get_mevzuat_text, download_mevzuat_document,
                 get_mevzuat_content, search_within_mevzuat, list_kurumlar]
    role: >-
      PRİMER TR mevzuat — in-house HP self-host (v0.15.1+; production cutover
      2026-08, mevzuat.cureonics.com). Semantik sıra (atlanamaz):
      list_mevzuat_types → list_mevzuat_by_type / search_mevzuat|search_kanun →
      get_mevzuat_detail → get_mevzuat_content|text → madde_tree/diff/timeline/
      relations → search_within_mevzuat → get_mevzuat_gerekce →
      resolve_resmi_gazete; RIA yurtiçi benchmark list_mevzuat_by_type; kurum
      adları list_kurumlar. Yapısal yasama-grafı + bedesten (NUMARA lookup,
      phrase, search_within, gerekçe tam metin). Tüm modların TR-mevzuat omurgası.
    degrade: >-
      Anahtar yoksa TR-mevzuat omurgası düşer; mevzuat-bilgisi ikincil korpusuna
      degrade + manifestoda 'skipped: anahtar yok'. Üst-norm zinciri kurulamazsa
      G2 CONDITIONAL.

  - name: mevzuat-bilgisi
    url: https://mevzuat.surucu.dev/mcp
    tier: secondary
    auth_env: null
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [search_kanun, search_mevzuat, get_mevzuat_content,
                 search_within_mevzuat, get_mevzuat_gerekce, get_mevzuat_madde_tree]
    role: >-
      İKİNCİL TR-mevzuat çapraz-kontrol aynası (surucu.dev topluluk) — her sorguda
      çalıştırılır. Primer v0.15.1+ (HP production) kanun/mevzuat NUMARASI lookup,
      search_within_mevzuat ve bedesten gerekçe tam metnini kendisi taşır; bu
      server bağımsız ikinci oy + Playwright-yüzey çaprazıdır. Çatışmada primer
      kazanır, sonuç manifestoya girer.
    degrade: >-
      Erişilemezse bağımsız ikinci oy ve Playwright-yüzey çapraz-kontrolü düşer;
      manifestoda 'degraded' — primer tek başına sentezi taşır (0.15.1+ production
      uçta numara/`phrase`/`search_within`/tam gerekçe primerde kalır),
      çapraz-doğrulama notu düşülür.

  - name: resmi-gazete
    url: https://resmi-gazete-mcp.cureonics.workers.dev/mcp
    # 2026-08-07 oturumunda ÖLÇÜLEN claude.ai connector adı (tahmin değil).
    tool_prefixes:
      - mcp__resmi-gazete__
      - mcp__claude_ai_Resmi_Gazete__
    tier: primary
    auth_env: RESMI_GAZETE_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [rg_search, rg_get_item, rg_resolve_date, rg_get_issue_toc,
                 rg_list_recent, rg_get_pdf, rg_info, rg_ocr_submit, rg_ocr_result]
    role: >-
      T.C. Resmî Gazete resmi yayın metni + tarih/sayı çözümleme.
      Semantik sıra: rg_info (bir kez) → rg_resolve_date|rg_list_recent →
      rg_search → rg_get_issue_toc → rg_get_item → rg_get_pdf (atıf nüshası) →
      büyük PDF'de rg_ocr_submit→rg_ocr_result. Yürürlük/RG sayı/mükerrer teyidi
      (Mevzuat resolve_resmi_gazete tamamlayıcısı). DRAFT/AMEND yürürlük +
      EX_POST kronoloji. ChatGPT search/fetch alias'ları tools_used dışı.
    degrade: >-
      Erişilemezse yürürlük tarihi/RG sayısı yalnız mevzuat resolve_resmi_gazete'ye
      dayanır; teyit edilemeyen RG referansı 'mcp_verified:false' etiketlenir,
      uydurulmaz.

  - name: titck
    url: https://titck.cureonics.com/mcp
    # 2026-08-07 oturumunda ÖLÇÜLEN claude.ai connector adı (tahmin değil).
    tool_prefixes:
      - mcp__titck__
      - mcp__claude_ai_T_TCK_Data__
    tier: primary
    auth_env: TITCK_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    # 2026-08-17: paket 67 araç (find_recalls_for_drug eklendi); hiçbiri cihaz
    # aracı değil. Eskiden burada duran `search_medical_devices` FANTOMDU.
    tools_used: [search_titck_guidelines, search_drugs, get_drug,
                 get_atc_hierarchy, search_reference_prices,
                 search_regulation_article23, search_off_label_uses,
                 search_scheduling_records, search_institutional_fees,
                 list_datasets, search_recalls, find_recalls_for_drug]
    role: >-
      TİTCK BEŞERİ TIBBİ ÜRÜN master index (barkod-primer + WHO-ATC + SNOMED) —
      ilaç indeksidir, tıbbi cihaz indeksi DEĞİLDİR (canlı araç yüzeyinde hiçbir
      cihaz aracı yoktur; TR cihaz kaydı ÜTS'dedir ve bu filoya wire EDİLMEMİŞTİR,
      AB cihaz benchmark'ı için eudamed kullanılır). Yönetmelik/SUT/ruhsat
      reformunda mevcut-durum + rehber envanteri: search_titck_guidelines +
      search_drugs + get_atc_hierarchy. Mevzuat-hükmü doğrudan karşılığı olan
      kayıtlar: search_reference_prices (fiyat kararı/SUT), search_regulation_article23
      (Ruhsatlandırma Yönetmeliği md.23 başvuru kaydı), search_off_label_uses
      (endikasyon dışı kılavuz), search_scheduling_records (kontrole tabi
      madde/reçete rejimi), search_institutional_fees (ücret tarifesi).
      TAZELİK ZORUNLULUĞU — bu araçların bir kısmı BAYAT veri setine dayanır ve
      "mevcut durum" kanıtı olarak sunulamaz. 2026-08-07 list_datasets ölçümü:
      reference_price_list 2026-02-18 (taze) · scheduling_list 2026-06-10 (taze) ·
      institutional_fees 2025-04-24 (BAYAT) · off_label_use 2023-03-17 (BAYAT) ·
      regulation_article23 2018-05-10 (BAYAT — sekiz yıllık). Bayat kayıt
      kullanıldığında çıktı `source_as_of` tarihini AÇIKÇA yazar ve iddiayı
      "o tarihteki durum" diye niteler. Bu tarihler DONDURULMUŞ DEĞİLDİR:
      canlı otorite `list_datasets`'in `source_as_of`/`is_stale` alanlarıdır —
      buradaki liste yalnız hangi araçların risk taşıdığını gösterir.
      2026-08-02'den beri KAPILI — Bearer zorunlu (eski açık Worker cache emekli
      edildi, önbellek sunucunun içine taşındı).
    degrade: >-
      Anahtar yoksa ilaç regülasyonu mevcut-durum katmanı tamamen düşer;
      manifestoda 'skipped: anahtar yok'. TR tıbbi CİHAZ katmanı zaten yoktur —
      cihaz sorusunda bu server 'skipped: kapsam dışı (ÜTS wire değil)' yazılır,
      AB karşılaştırması eudamed'e devredilir. 401 alınıyorsa bu DEGRADE DEĞİL
      yapılandırma arızasıdır — preflight ayrıca uyarır.

  - name: tbmm
    url: https://tbmm.cureonics.com/mcp
    # 2026-08-07 oturumunda ÖLÇÜLEN claude.ai connector adı (tahmin değil).
    tool_prefixes:
      - mcp__tbmm__
      - mcp__claude_ai_tbmm__
    tier: primary
    auth_env: TBMM_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [tbmm_search_kanun_teklifi, tbmm_get_kanun_teklifi,
                 tbmm_search_kanun, tbmm_search_komisyon_raporu,
                 tbmm_get_komisyon_raporu, tbmm_list_komisyon_havale,
                 tbmm_search_tutanak, tbmm_get_tutanak,
                 tbmm_search_acik_erisim, tbmm_get_acik_erisim_document,
                 tbmm_list_acik_erisim_collections, tbmm_get_milletvekili]
    role: >-
      TBMM yasama tarihçesi (0.2.1) — Mod 8 omurgası; diğer modlarda çapraz.
      Rota (SEARCH BEFORE GET, atlama yok): teklif → tbmm_search_kanun_teklifi
      sonra tbmm_get_kanun_teklifi(sira_no) özet+imza+komisyon aşaması
      (onerge_bilgileri); kanun_no yalnız kanunlar.durumu locator
      (rg_sayisi/donem pin). Gerekçe GÖVDESİ mevzuat get_mevzuat_gerekce;
      TBMM locator tbmm_search_kanun. Komisyon → search/get_komisyon_raporu;
      havale → tbmm_list_komisyon_havale (query'siz deep-link, ?komisyon= yok).
      Tutanak → search/get_tutanak (bilinen TutanakGoster id/PDF); SPA ise
      related_acik_erisim kütüphane zabıtıdır, canlı Genel Kurul DEĞİLDİR.
      Sponsor → tbmm_get_milletvekili (güncel dönem; donem_filter_ignored).
      Tarihsel OA → list_acik_erisim_collections sonra
      search_acik_erisim(page/year/collection) + get_acik_erisim_document.
      tasari_teklif_sd.onerge kullanılmaz (302→anasayfa). Tam kanun metni
      mevzuat-mcp.
    degrade: >-
      SPA Genel Kurul/komisyon, Havale PNG/WAF ve www5 302→anasayfa
      (homepage_redirect) → manual_required (portal deep-link + sorgu yankısı);
      DSpace related_acik_erisim canlı tutanak/teklif SAYILMAZ. Erişilemezse
      Mod 8 yasama-tarihçesi düşer, G8 en fazla CONDITIONAL. Gerekçe gövdesi
      mevzuat-mcp'de kalır — TBMM düşük diye kanun metni uydurulmaz.

  - name: saglikbakanligi
    url: https://saglik-mcp.cureonics.com/mcp
    tier: primary
    auth_env: SAGLIK_BAKANLIGI_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [sb_server_info, sb_list_birimler, sb_list_kategoriler,
                 sb_list_belgeler, sb_list_kilavuzlar, sb_list_kurul_kararlari,
                 sb_list_taslaklar, sb_search, sb_resolve_genelge, sb_get_document]
    role: >-
      T.C. Sağlık Bakanlığı ikincil mevzuat / soft-law (genelge·yönerge·rehber·
      kurul kararı·SKS) — Resmî Gazete/mevzuat.gov.tr'de OLMAYAN idari norm.
      Semantik sıra: sb_server_info → sb_list_birimler → sb_list_kategoriler →
      sb_list_belgeler|kilavuzlar|kurul_kararlari → sb_search/sb_resolve_genelge →
      sb_get_document; sb_list_taslaklar her zaman çağrılır ama sonuç
      manual_required (uydurma yok). ChatGPT search/fetch tools_used dışı.
    degrade: >-
      Erişilemezse idari norm katmanı (genelge/yönerge/rehber) görünmez olur;
      manifestoda 'skipped: anahtar yok'. Bu katmanın yokluğu ilgili normun
      YOKLUĞU anlamına GELMEZ — çıktıda kapsam boşluğu olarak beyan edilir.

  - name: detsis
    url: https://detsis.cureonics.com/mcp
    tier: support
    auth_env: DETSIS_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [detsis_server_info, detsis_resolve_birim, detsis_search_birim,
                 detsis_list_milestones, detsis_get_kunye,
                 detsis_list_alt_birimler, detsis_get_alt_birim_sayisi,
                 detsis_walk_alt_birimler, detsis_list_kategorik_birimler,
                 detsis_get_hizmetler, detsis_get_belgeler, detsis_get_mevzuatlar,
                 detsis_get_degisiklikler, detsis_get_degisiklik_kategorileri,
                 detsis_get_islem_kunye]
    role: >-
      DETSİS devlet-teşkilatı registry — kurumsal atıf doğruluğu.
      Semantik sıra: resolve/search → get_kunye → list_alt/get_alt_birim_sayisi
      → (gerekirse walk) → hizmetler/belgeler/mevzuatlar → degisiklikler;
      kapatılan birim → degisiklikler.birimTarihceId → get_islem_kunye (id
      uydurulmaz). milestones/kategorik/server_info kapsam beyanı. Yokluk kesin
      kanıt değil. detsis_get_gecmis_birim / list_iller_ilceler / list_taxonomies
      reform omurgasında N/A → conscious exclude (coverage'da gerekçeli skip).
    degrade: >-
      Erişilemezse kurum adları mevzuat metninden alınır ve 'mcp_verified:false'
      etiketlenir; resmî ad/DETSİS no teyidi yapılamaz.

