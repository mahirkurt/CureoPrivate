# Evrensel legistik rubrik — ülkeden BAĞIMSIZ aileler (planın 6. önerisi).
#
# Her aile, hangi hukuk düzeninde olursa olsun sorulması gereken bir soruyu tanımlar.
# ULUSAL AYRINTI (dayanak madde, kontrol listesi, risk ağırlığı) aile tanımında DEĞİL,
# her paketin `legistic_profile.families` alanında yaşar.
#
# Aile listesi planın dokuz ailesinden başlar; R6b'nin 21 kontrolünün TAMAMI eşlenebilsin
# diye üç aile eklendi (yapi_ve_kapsam · mevzuat_ekonomisi_ve_koordinasyon ·
# ulusustu_ve_karsilastirmali_uyum). Hiçbir R6b kontrolü eşlenmeden bırakılmadı —
# `tests/validate_packs.py` bunu denetler.

families:
  ust_norm:
    title: Üst norma uygunluk
    universal_question: >-
      Norm, hiyerarşide kendisinden üstte duran her normla (anayasa, kanun, ulusüstü hukuk)
      uyumlu mu ve yetki zinciri eksiksiz mi?
  yetki_ve_devredilmis_yasama:
    title: Yetki ve devredilmiş yasama
    universal_question: >-
      Normu çıkaran merci buna yetkili mi; alt düzenleyici işlem kanunun bıraktığı alanı
      aşıyor mu? (Common law: devredilmiş yasamanın parlamento denetim usulü.)
  mali_yukun_kanuniligi:
    title: Mali yükün kanuniliği
    universal_question: >-
      Vergi, harç, ücret veya başka bir mali yükümlülük, ancak kanunla öngörülebileceği
      bir alanda alt düzenleyici işlemle mi getiriliyor?
  gerekce:
    title: Gerekçe
    universal_question: >-
      Norm ve her hükmü, yasa koyucu iradesini ve seçilen çözümün nedenini açıklayan bir
      gerekçeyle birlikte mi sunuluyor? Gerekçe hüküm metninin tekrarı mı?
  etki_analizi:
    title: Etki analizi
    universal_question: >-
      Düzenleyici etki analizi ve bütçe etkisi değerlendirmesi yapıldı mı, alternatifler
      tartıldı mı?
  atif_teknigi:
    title: Atıf tekniği
    universal_question: >-
      Başka normlara yapılan atıflar tekil, doğru ve ulusal atıf biçimine uygun mu?
  gecis_hukumleri:
    title: Geçiş hükümleri
    universal_question: >-
      Eski rejimden yenisine geçiş, kazanılmış haklar ve devam eden işlemler için
      düzenlendi mi?
  yururluk_ve_ilga:
    title: Yürürlük, değişiklik ve ilga
    universal_question: >-
      Yürürlük tarihi, değiştirilen/kaldırılan hükümler ve değişiklik tekniği açık ve
      belirli mi?
  dil:
    title: Hukuk dili
    universal_question: >-
      Metin ulusal hukuk dili kurallarına uygun, açık ve belirli mi? Çok dilli yargılarda
      eşit derecede geçerli dil sürümleri eşdeğer mi?
  yapi_ve_kapsam:
    title: Yapı ve kapsam
    universal_question: >-
      Amaç, kapsam ve madde düzeni net mi; maddeler kısa ve tek konulu mu?
  mevzuat_ekonomisi_ve_koordinasyon:
    title: Mevzuat ekonomisi ve kurumlar arası koordinasyon
    universal_question: >-
      Aynı konu birden çok metinde dağınık mı düzenleniyor; ilgili kurumlarla mutabakat
      sağlandı mı?
  ulusustu_ve_karsilastirmali_uyum:
    title: Ulusüstü ve karşılaştırmalı uyum
    universal_question: >-
      Bağlayıcı ulusüstü hukuka (AB müktesebatı, onaylı antlaşmalar) ve insan hakları
      yükümlülüklerine uyum sağlandı mı? Aktarım gerektiren norm ile doğrudan uygulanan
      norm ayrımı korunuyor mu?

# Aileye özgü ek modüller — hukuk ailesine / yapıya göre (planın 6. önerisi).
# Bunlar ayrı AİLE değildir; ilgili paket `legal_family` / `federal` / çok dilli ise
# ilgili ailelere ek denetim adımı ekler.
add_on_modules:
  common_law:
    - { family: yapi_ve_kapsam, check: "Tanım maddeleri (interpretation/definitions section) tam ve tutarlı mı" }
    - { family: yetki_ve_devredilmis_yasama, check: "Devredilmiş yasamanın parlamento denetim usulü (affirmative/negative procedure) belirtilmiş mi" }
  federal:
    - { family: yetki_ve_devredilmis_yasama, check: "Federal ile eyalet/kanton yasama yetkisi paylaşımına uyuluyor mu" }
  multilingual:
    - { family: dil, check: "Eşit derecede geçerli dil sürümleri arasında hukuki eşdeğerlik — çeviri eşdeğerlik değildir" }

