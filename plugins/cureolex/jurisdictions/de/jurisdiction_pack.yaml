# Almanya (federal düzey) — Faz 1 TASLAK paket.
#
# `status: draft` — uzman paneli yok; CC-6 gereği çıktı en fazla LOW.
# Kapsam: FEDERAL hukuk (Bund). Eyalet (Land) hukuku ISO 3166-2 alt-paketleri gerektirir
# (DE-BY, DE-NW …) — bu sürümde yok.
#
# DİKKAT — ölçüm sınırı: gesetze-im-internet.de 2026-09-24'te bu makineden ERİŞİLEMEDİ
# (bağlantı zaman aşımı). Aşağıdaki bayraklar wire'lı german-law korpusunun fleet.yaml'daki
# ölçümlerine dayanır; kaynağın kendisine karşı bu oturumda yeniden ölçülmedi.

pack_version: "0.1.0"

jurisdiction:
  code: DE
  name: Almanya (Bundesrepublik Deutschland)
  kind: national

status: draft

legal_family:
  primary: civil_law
  federal: true
  notes: >-
    Federal devlet. GG Md.31: federal hukuk eyalet hukukunu bozar. Sağlıkta yetki
    paylaşımlıdır (GG Md.74/1 no.19, 19a — rekabet eden yasama). Kanun yapımında
    Bundesrat'ın onay/itiraz rolü norm türüne göre değişir.

languages:
  - { code: de, authentic: true }

norm_hierarchy:
  - { rank: 1, name: "Grundgesetz (GG)", instrument_types: [constitutional] }
  - { rank: 2, name: "Bundesgesetz", instrument_types: [statute] }
  - { rank: 3, name: "Rechtsverordnung", instrument_types: [regulation],
      note: "GG Md.80/1: yetki veren kanun içerik, amaç ve kapsamı belirlemelidir (belirlilik)." }
  - { rank: 4, name: "Satzung / Verwaltungsvorschrift", instrument_types: [regulation, guidance],
      note: "G-BA Richtlinien'in bağlayıcılığı özel bir kategoridir — doğrulanmadı." }

connectors:
  - role: primary_legislation
    server: german-law
    tier: A
    status: wired
    contract_capabilities: [search]
    note: "Ücretsiz korpus (6.870 kanun / 91.843 hüküm, data_age 2026-02-14). Çözücü tuzağı: get_provision yalnız {id:'amg_1976:21'} biçimiyle çalışır; {law,article} sessiz null döner."
  - role: case_law
    server: Open Law
    tier: A
    status: companion
    contract_capabilities: [case_law_search]
    note: "search_de_caselaw — companion; german-law search_case_law premium-kapalı."
  - role: treaty
    server: eurlex
    tier: A
    status: wired
    contract_capabilities: [search, repeal_relations]
    note: "DE AB üyesidir: AB tüzüğü doğrudan uygulanır, direktif ulusal uygulama ister (german-law get_german_implementations)."

capabilities:
  has_consolidated_text:
    value: true
    basis: "german-law get_provision — konsolide korpus anlık görüntüsü (data_age 2026-02-14; fleet.yaml 2026-08-08 ölçümü). Güncellik sınırı: korpus tarihinden sonraki değişiklik görünmez."
  has_point_in_time:
    value: false
    basis: "german-law get_provision_history + diff_provision premium-kapalı (premium:false, ölçüldü 2026-08-08). Filoda başka tarihsel sürüm yolu yok. G10 en fazla CONDITIONAL."
  has_explanatory_memoranda:
    value: false
    basis: "Begründung Bundestag Drucksache'de yayımlanır ama filoda getirim yolu yok: german-law get_preparatory_works upgradeRequired (ölçüldü 2026-08-08); DIP bağlayıcısı wire'lı değil."
  has_case_law_api:
    value: true
    basis: "Open Law companion search_de_caselaw — wire'lı DEĞİL; companion bağlı değilse G5 CONDITIONAL. Bu oturumda ölçülmedi."
  has_authentic_translation:
    value: false
    basis: "Almanca tek geçerli dil; BMJ'nin İngilizce çevirileri resmî olmayan çevirilerdir."

