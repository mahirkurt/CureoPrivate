# 7. MCP sunucuları (operasyonel omurga)
# --------------------------------------------------------------------------
mcp_server:
  - id: mcp.mevzuat
    name: "Mevzuat MCP"
    role: >-
      Türk mevzuat metni doğrulama (DRAFT/ANALYZE). HP production 0.15.1+
      (mevzuat.cureonics.com): bedesten NUMARA/`phrase`/`search_within`/tam gerekçe.
      Semantik sıra: list_mevzuat_types → list_mevzuat_by_type/search →
      get_mevzuat_detail → yapısal graf → search_within → content →
      get_mevzuat_gerekce → resolve_resmi_gazete → list_kurumlar.
    verification: mevzuat_mcp
    note: "Conscious excludes / tam tools_used: fleet.yaml + coverage-manifest.md."
  - id: mcp.yargi
    name: "Hukuki Veritabanları / Yargı MCP"
    role: "AYM/Danıştay/Yargıtay içtihat doğrulama (G5)"
    verification: yargi_mcp
  - id: mcp.yoktez
    name: "YokTez MCP"
    role: "Akademik tez/doktrin taraması (G5)"
    verification: yoktez_mcp
  - id: mcp.titck
    name: "TİTCK MCP"
    role: "Beşeri tıbbi ürün master index (barkod/ATC/SNOMED); cihaz/ÜTS değil. Snapshot tazeliği list_datasets.is_stale."
    verification: titck_mcp
  - id: mcp.tbmm
    name: "TBMM MCP"
    role: >
      Yasama tarihçesi (tbmm-mcp 0.2.1) — Mod 8 omurgası; diğer modlarda çapraz.
      Rota: tbmm_search_kanun_teklifi → tbmm_get_kanun_teklifi(sira_no) özet+imza+
      komisyon aşaması (onerge); kanun_no → kanunlar.durumu locator (gerekçe
      GÖVDESİ mevzuat get_mevzuat_gerekce). Komisyon search/get +
      tbmm_list_komisyon_havale (query'siz deep-link). Tutanak search/get;
      SPA related_acik_erisim kütüphane zabıtıdır, canlı Genel Kurul değildir.
      Sponsor tbmm_get_milletvekili (güncel dönem). OA:
      list_acik_erisim_collections → search_acik_erisim(page/year/collection)
      → get_acik_erisim_document. tasari_teklif_sd.onerge kullanılmaz
      (302→anasayfa). Tam kanun metni mevzuat-mcp; Resmî Gazete bu sunucunun
      işi değildir.
    access: { url: "https://tbmm.cureonics.com/mcp", mcp_server: tbmm }
    verification: open_primary_source
  - id: mcp.detsis
    name: "DETSİS MCP"
    role: >
      Devlet Teşkilatı Merkezi Kayıt Sistemi — kurumsal prosopografi (genelgeyi
      çıkaran birimin resmî adı, DETSİS no, hiyerarşi, hizmet/belge/mevzuat
      sekmeleri, kapatılan birim için birimTarihceId → islem_kunye). Yokluk
      kesin kanıt değil (caveat). faaliyetDurumuId etiketlenmez.
    access: { url: "https://detsis.cureonics.com/mcp", mcp_server: detsis }
    verification: open_primary_source
  - id: mcp.health_policy
    name: "Health Policy MCP (Cloudflare Worker connector)"
    role: >
      Programatik Katman-2 sarmalayıcı — Türkiye-DIŞI ve Ansvar-KAPSAMADIĞI
      sağlık mevzuatı metni: ABD (eCFR / Federal Register / GovInfo / Congress),
      Kanada Justice Laws, Japonya e-LAWS, Avustralya FRL, İspanya BOE,
      İrlanda eISB, Çin NPC, Meksika DOF (CN/MX best-effort) + `semantic_search`
      (çok-dilli) + `legal_distill_start`/`_result` (sunucu-tarafı distilasyon).
    access: { url: "https://health-policy-mcp.cureonics.workers.dev/mcp", mcp_server: health-policy }
    verification: health_policy_mcp
    note: >
      v1.1 (2026-08-07) — BU KAYIT `mcp.lex_sanitas` KAYDININ YERİNİ ALIR.
      Sarmalayıcı 2026-06-29'da `lex-sanitas-mcp` → `health-policy-mcp` olarak
      yeniden adlandırıldı VE kapsamı daraltıldı. Eski uç
      (lex-sanitas-mcp.cureonics.workers.dev) 2026-08-07 probe'unda **HTTP 404**
      döndü — ÖLÜ; yeni uç aynı probe'da 401 (auth kapısı, canlı) döndü.
      SINIRLAR (rescope'ta bu araçlar KALDIRILDI, artık burada aranmaz):
      AB CELLAR/EUR-Lex → wire'lı `eurlex` (G6); UK statute TEXT → wire'lı
      `uk-legal` `legislation_*` (loopback httpx fix 2026-08-18) + Open Law
