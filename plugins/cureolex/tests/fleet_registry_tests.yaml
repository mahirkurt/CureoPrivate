suite: fleet_registry
version: "3.5.0"
description: >-
  Filo kayıt defterinin (fleet.yaml → türev artefaktlar) davranışsal invaryantları.
  Bu vakalar AĞ ERİŞİMİ gerektirir (canlı prob + Doppler secret listesi). Ağsız,
  deterministik CI kapısı için `tools/fleetkit/check_drift.py` kullanın — o yapılandırma
  bütünlüğünü kanıtlar, bu dosya CANLI gerçekliği kanıtlar.

  Koşum yardımcıları:
    doppler run -p cureohub -c dev_personal -- python3 hooks/scripts/fleet_probe.py --fresh
    python3 tools/fleetkit/check_drift.py

cases:
  - id: FR-01-titck-gated
    given: >-
      titck.cureonics.com'a ANAHTARSIZ bir MCP `initialize` isteği atılır, sonra
      aynı istek TITCK_MCP_API_KEY ile tekrarlanır.
    expect:
      - "Anahtarsız istek HTTP 401 dönmeli — TİTCK 2026-08-02'de kapılandı (açık Worker cache emekli, önbellek sunucuya taşındı)."
      - "Anahtarlı istek HTTP 200 dönmeli."
      - "fleet.yaml'de titck.auth_env == TITCK_MCP_API_KEY olmalı; .mcp.json'da Authorization header'ı bulunmalı."
    rationale: >-
      Bu, v3.5.0'ı tetikleyen asıl arızadır. Plugin titck'i 'public' sayıyordu;
      ilaç/cihaz regülasyon katmanı her çağrıda 401 alıyor ve bu bir wiring hatası
      olduğu hiçbir yerden anlaşılmıyordu.

  - id: FR-02-public-server-anahtarsiz-200
    given: "fleet.yaml'de auth_env: null işaretli her server anahtarsız prob edilir."
    expect:
      - "mevzuat-bilgisi, yoktez, literatur anahtarsız HTTP 200 dönmeli."
      - "Herhangi biri 401/403 dönerse upstream KAPILANMIŞ demektir → fleet.yaml'e auth_env eklenmeli, sonra `python3 tools/fleetkit/gen_fleet.py`."
      - "Bu, titck dersinin genellemesidir: 'public' bir varsayım değil, ölçülen bir olgudur."

  - id: FR-03-env-adlari-doppler-da-var
    given: >-
      fleet.yaml'deki her auth_env adı Doppler cureohub/dev_personal secret
      listesinde aranır.
    expect:
      - "16 gated server'ın env adının TAMAMI Doppler'da bulunmalı."
      - "Bulunmayan ad = yanlış yazım veya emekli secret → o katman sessizce auth_missing'e düşer."
      - "health-policy için kanonik ad HEALTH_POLICY_MCP_API_KEY'dir (eski LEX_SANITAS_MCP_API_KEY rename artığıdır; ikisi de canlıda kabul edilse bile kanonik olan yazılır)."

  - id: FR-04-companion-wire-kesisimi-bos
    given: "fleet.yaml servers[] ve companions[] adları karşılaştırılır."
    expect:
      - "Kesişim BOŞ olmalı — bir ad hem wire'lı hem companion olamaz (validate_fleet bunu ValueError ile reddeder)."
      - "yoktez YALNIZ servers[] içinde olmalı (v3.5.0 terfisi); companions[] 3 üye taşımalı (Yargı · Open Law · Ansvar)."
      - "Stop hook'un zorunlu manifesto satırı sayısı 5 olmalı (3 companion + 2 delegasyon)."

  - id: FR-05-preflight-401-i-ariza-olarak-bildirir
    given: >-
      Bir gated server'ın anahtarı bilinçli olarak bozulur (geçersiz değer) ve
      SessionStart preflight taze cache ile koşulur.
    expect:
      - "additionalContext 'YAPILANDIRMA ARIZASI' ifadesi taşımalı."
      - "'graceful degrade' olarak SUNULMAMALI — bu düzeltilebilir bir wiring hatasıdır."
      - "Çözüm yolu gösterilmeli: fleet.yaml düzelt → python3 tools/fleetkit/gen_fleet.py."
      - "Anahtarın tamamen YOK olduğu hâl bundan AYRI raporlanmalı (auth_missing → doppler run önerisi)."

  - id: FR-06-prob-saglikli-filoda-sessiz
    given: "Tüm filo erişilebilirken SessionStart preflight koşulur."
    expect:
      - "additionalContext '[preflight]' bölümü İÇERMEMELİ — gürültü yok."
      - "Konvansiyonlar (TAM-FİLO, NO-FABRICATION, ŞELALE, SCOPE GUARD) yine enjekte edilmeli."
      - "Prob 24 saat cache'lenmeli; ikinci oturum ağa çıkmamalı."

  - id: FR-07-prob-kendi-arizasini-uretmemeli
    given: >-
      Prob istemcisinin HTTP davranışı denetlenir (User-Agent, gövde okuma sınırı,
      zaman aşımı eşiği).
    expect:
      - "Açık User-Agent gönderilmeli — urllib varsayılanı ('Python-urllib/x.y') Cloudflare bot kuralına takılır ve TÜM cureonics uçları 403/1010 döner, yani filo sahte 'unauthorized' görünür."
      - "Okuma sınırı en büyük gerçek initialize gövdesinin (oecd ~32 KB) üstünde olmalı; kesik JSON sahte 'error' üretir."
      - "Zaman aşımı en yavaş server'ın (anamnesis ~11 sn) üstünde olmalı; aksi hâlde sağlıklı server 'unreachable' görünür."
      - "Üçü de 'teşhis aracının teşhis ettiği hatayı kendisinin üretmesi' sınıfıdır — hepsi hooks/test_hooks.py'de regresyon korumalıdır."

  - id: FR-08-turetilmis-dosya-elle-duzenlenmemeli
    given: ".mcp.json veya fleet.lock.json elle düzenlenir ve check_drift koşulur."
    expect:
      - "check_drift exit 1 dönmeli ve değişen dosyayı '[1/3] TÜRETİLMİŞ DOSYA SÜRÜKLENMESİ' altında listelemeli."
      - "Çözüm olarak `python3 tools/fleetkit/gen_fleet.py` göstermeli."
      - "Bu kapı, filonun tekrar sekiz yerde elle tutulmaya kaymasını engeller."

  - id: FR-09-selale-sirasi-otomatik-atlanmaz
    given: >-
      Mod 7 karşılaştırmalı analizde yabancı doktrin tam metni gerekiyor ve
      openathens oturumu düşük/erişilemez.
    expect:
      - "annas-reader OTOMATİK açılmamalı — şelale sırası (Tier 3 → Tier 4) korunur."
      - "openathens satırı 'degraded: lisanslı band kapalı' olarak manifestoda görünmeli."
      - "annas-reader kullanılacaksa açık gerekçe + 'yalnız analiz' notu taşımalı; getirilen tam metin çıktıya gövde olarak KOPYALANMAMALI."

  - id: FR-10-yoktez-wire-g7-hard-pass
    given: "Bir DRAFT/ANALYZE çıktısı YÖK-Tez atfı içeriyor."
    expect:
      - "Atıf mcp__yoktez__get_yok_tez_thesis_details ile doğrulanmalı (tez no/başlık/yazar)."
      - "G7 CONDITIONAL'a düşmemeli — yoktez wire'lı ve authless olduğu için doğrulama kullanıcı aksiyonuna bağlı değil (hard PASS)."
      - "Manifestoda 'yoktez → hit N' satırı bulunmalı; companion satırı olarak YAZILMAMALI."
      - "Doğrulanamayan tez atfı 'illustrative_placeholder_not_verified' etiketlenmeli ve KULLANILMAMALI."

  - id: FR-11-doktrin-tam-metin-katmani
    given: "Bir reform gerekçesi Türk doktrinine dayandırılıyor."
    expect:
      - "yok-akademik YALNIZ künye/metadata sağlar — gerekçede alıntılanabilir metin ondan gelmez."
      - "literatur (DergiPark) search_articles → pdf_to_html ile tam metin getirmeli."
      - "literatur erişilemezse doktrin katmanı metadata-only'ye düşer ve manifestoda 'degraded: tam metin yok' yazılmalı — içerik uydurulmamalı."

  - id: FR-12-mevzuat-birincil-dusukse-yedek-devralir
    given: >-
      Bir DRAFT/ANALYZE koşumunda `mcp__mevzuat__*` düşük: search_mevzuat origin
      timeout (CF 524) veriyor, resolve_resmi_gazete boş `items` + dolu
      `diagnostics` (ör. SSL CERTIFICATE_VERIFY_FAILED) döndürüyor.
    expect:
      - "Çıktı DURMAZ: Türk mevzuatı yükünü `mcp__mevzuat-bilgisi__*` devralır (SKILL.md §3 DEVRALMA KURALI)."
      - "Manifestoda İKİ satır zorunlu: 'mevzuat → degraded: <teşhis>' VE 'mevzuat-bilgisi → hit N (fallback devraldı)'. Tek satır yazmak G0 FAIL."
      - "Yedekten gelen her atıf `source: mevzuat_bilgisi_mcp (fallback)` + birincil-doğrulama açığı notu taşımalı; birincil ayağa kalkınca çapraz-doğrulanmalı."
      - "Yedek EŞDEĞER SAYILMAMALI: yapısal graf ve resolve_resmi_gazete yalnız primerdedir; ikincil search_mevzuat AND/OR/NOT desteklemez (`+terim1 +terim2`). Primer 0.15.1+ (HP production) numara lookup / phrase / search_within / tam gerekçe taşır."
      - "`resolve_resmi_gazete` KARŞILIĞI YEDEKTE YOKTUR — RG çapa çözümlemesi gerekiyorsa `manual_required`; yedekle kapatıldığı İMA EDİLMEMELİ."
      - "İkisi de düşükse Türk mevzuatı iddiası ÜRETİLMEMELİ (no-fabrication)."
    rationale: >-
      2026-08-06 denetimi birincil düşükken yedeğin aynı sorguyu (5210 sayılı
      Yönetmelik) doğru yanıtladığını ölçtü, ama protokolde devralma kuralı
      YAZILI DEĞİLDİ. Kök neden 2026-08-07'de onarıldı (TR-gov hostları eksik
      TLS ara sertifikası gönderiyordu); kural, arıza tekrarlarsa diye kalır.

  - id: FR-13-emekli-sunucu-kimligine-atif-yapilamaz
    given: >-
      Bir referans/registry/test dosyası, fleet.yaml'de BULUNMAYAN bir sunucu
      kimliğine atıf yapıyor (ör. yeniden adlandırılmış `lex-sanitas-mcp`).
    expect:
      - "check_drift exit 1 dönmeli, bulguyu '[6] filoda OLMAYAN sunucu kimliğine atıf' altında dosya:satır ile listelemeli."
      - "Sayı denetimi [5] bunu YAKALAYAMAZ — server sayısı değişmediği için; [6] ad/uç sürüklenmesi içindir."
      - "Kaldırılmış bir aracın çağrılabilir gibi gösterilmesi G7 FAIL (olmayan yetenek beyanı = fabrikasyon)."
    rationale: >-
      2026-06-29'da `lex-sanitas-mcp` → `health-policy-mcp` yeniden adlandırıldı
      ve kapsamı daraltıldı; source_registry sekiz satırda ölü adı taşımaya devam
      etti ve ölü uç 2026-08-07 probe'unda HTTP 404 verdi. Sayı hep 19 kaldığı
      için kapı temiz raporluyordu. [6] tam bu sınıf içindir (mutasyon-doğrulandı).

  - id: FR-14-beyan-edilen-arac-canli-yuzeyde-var-olmali
    given: >-
      fleet.yaml `tools_used` bir aracı beyan ediyor ama sunucunun canlı
      `tools/list` yüzeyinde o ad YOK (fantom araç).
    expect:
      - "check_tools.py exit 1 dönmeli ve 'BEYAN EDİLDİ AMA YOK' satırıyla sunucu+araç adını vermeli; yakın eşleşme varsa canlı karşılığını önermeli."
      - "audit_plugins.py bunu YAKALAYAMAZ — yalnız `initialize` gönderir; fantom araç taşıyan sunucu 200/ok raporlanır. Sağlık ≠ işlevsellik."
      - "check_drift [6] de yakalayamaz — sunucu KİMLİĞİ geçerlidir, sürüklenen ARAÇ adıdır."
      - "Olmayan bir aracın çağrılabilir gibi beyan edilmesi G7 FAIL: olmayan yetenek beyanı fabrikasyondur."
    rationale: >-
      2026-08-07 araç-düzeyi ölçümünde cureolex üç fantom taşıyordu:
      `titck.search_medical_devices` (TİTCK'in 66 aracının hiçbiri cihaz aracı
      değil — kategori hatası; `_role` da "ilaç/tıbbi cihaz master index" diyerek
      olmayan bir TR cihaz katmanı vaat ediyordu), `eudamed_search_actors` ve
      `eudamed_probe`. Beyan `.mcp.json`'daki `_role` alanına aktığı için arıza
      modelin gördüğü CANLI wiring'de duruyordu. Dokuz plugin'in tamamı aynı anda
      `initialize` düzeyinde temizdi.

  - id: FR-15-arac-varligi-tazelik-kanitlamaz
    given: >-
      Beyan edilen araç canlıda var ve çağrı 200 dönüyor, ancak arkasındaki veri
      seti yıllarca güncellenmemiş (`is_stale: true`).
    expect:
      - "Araç kullanılabilir sayılır ama çıktı `source_as_of` tarihini AÇIKÇA yazmalı ve iddiayı 'o tarihteki durum' diye nitelemeli."
      - "Bayat kayıt niteliksiz 'mevcut durum' kanıtı olarak sunulursa G7 FAIL."
      - "Tazelik otoritesi CANLI `list_datasets` çıktısıdır (`source_as_of`/`is_stale`); fleet.yaml'deki liste yalnız hangi araçların risk taşıdığını gösterir, dondurulmuş gerçek değildir."
    rationale: >-
      2026-08-07 list_datasets ölçümü: TİTCK'in 21 veri setinden birkaçı bayat —
      regulation_article23 2018-05-10 (sekiz yıllık), off_label_use 2023-03-17,
      institutional_fees 2025-04-24. Bu araçlar 200 döner ve gerçek kayıt verir;
      arıza erişimde değil, tarihin beyan EDİLMEMESİNDEDİR. Araç envanteri
      denetimi (FR-14) bu sınıfı göremez.

  - id: FR-16-govde-hatasi-bos-sonuc-degildir
    given: >-
      Bir sunucu HTTP 200 + JSON-RPC `result` + `isError:false` döndürüyor, ama
      gövdedeki JSON bir `error` alanı taşıyor ve arama araçlarında bunun yanında
      `total:0, items:[]` da var.
    expect:
      - "Sonuç ASLA `empty` sayılmaz — `degraded` sayılır ve manifestoya gerekçesiyle yazılır."
      - "IP/hukuk bağlamında 'Türkiye'de tescil/patent yok' SONUCUNA VARILAMAZ; ilgili satır 'manual_required' (portal deep-link + sorgu yankısı) üretir."
      - "check_tools.py --call bunu üçüncü arıza katmanı olarak yakalar; yalnız `isError`e bakan denetim kaçırır."
    rationale: >-
      2026-08-08'de emekli bir sınai-mülkiyet connector ucunda 5/5 araçta
      iki ayrı koşumda ölçüldü: upstream CAPTCHA korumalı ve sunucunun
      çözücü bakiyesi tükenmiş → her araç gövde-`error` + `total:0` + boş `items`
      döndürüyordu. Envanter denetimi o ucu TEMİZ raporlardı (araçlar mevcut);
      yalnız işlevsel çağrı yakalar. Sessiz yanlış-negatif, no-fabrication
      invaryantının doğrudan ihlalidir. Connector 2026-08-17'de filodan çıktı;
      invaryant (gövde-hatası ≠ empty) durur.

  - id: FR-17-sunucu-iki-sharda-ait-olabilir
    given: >-
      Bir sunucu hem TR-çekirdek hem karşılaştırmalı bağlamda gerekli
      (`shard: [S1, S2]`).
    expect:
      - "Her iki shard'ın distiller ajanı da o sunucunun araç öneklerini `tools:` allowlist'inde taşımalı."
      - "Tek shard'a zorlanırsa diğer ajan onu ÇAĞIRAMAZ — ajan `tools:` KATI allowlist'tir, model önek uyuşmazlığını yorumla köprüleyemez → yetenek SESSİZCE düşer."
      - "`ALL` ile çözmek yanlıştır: `ALL` substrat anlamı taşır (anamnesis) ve sunucuyu ilgisiz shard'lara da sokar."
    rationale: >-
      `eurlex` hem TR-çekirdek G6 CELEX taşıyıcısıdır (S1) hem karşılaştırmalı
      AB katmanıdır (S2) — `shard: [S1, S2]`. Tek shard'a zorlanırsa diğer ajan
      onu ÇAĞIRAMAZ. gen_fleet `shard` için liste desteği aldı; her iki distiller
      da önekleri `tools:` allowlist'inde taşır.

  - id: FR-18-companion-yoklugunda-programatik-yedek-zorunlu
    given: >-
      `Open Law` companion'ı bağlı değil ve çıktı UK birincil metni gerektiriyor;
      ya da wire'lı `eurlex`/`fedlex` erişilemiyor.
    expect:
      - "G6 CELEX doğrulaması Open Law skip'inde DÜŞMEZ — wire'lı eurlex_lookup_celex hard PASS. eurlex de erişilemezse ep.eurlex_sparql + G6 CONDITIONAL."
      - "UK birincil metni tercihen uk-legal legislation_* (CLML); yedek ep.legislation_uk `/data.akn` (Akoma Ntoso — `/data.xml` CLML'dir, AKN değildir)."
      - "CH birincil metni wire'lı mcp__fedlex__*'tedir; o da düşerse ep.fedlex_sparql. Ansvar ÇERÇEVE taraması ikame SAYILMAZ (kategori hatası)."
      - "german-law get_eu_basis CELEX doğrulamasının ikamesi DEĞİLDİR — Almanya-çapalıdır, CELEX kimliği üretmez."
      - "Hiçbiri erişilemezse ilgili satır 'manual_required' (portal deep-link) — uydurma CELEX/SR ASLA."
    rationale: >-
      2026-08-08 ölçümü: (a) CELLAR SPARQL canlı ve CELEX 32001L0083'ü
      cellar URI + 2001-11-06 + tür DIR olarak çözdü — yedek VARDI ama companion
      degrade metninde yazılı değildi, "WebFetch'e degrade" diyordu; (b) healthcheck'te
      UK ucu HİÇ YOKTU (AU/NZ vardı) — Open Law'a devredildiği için; (c) CH degrade'i
      birincil metni Ansvar çerçeve taramasına devrediyordu, bu kategori hatasıdır.
      Üç uç da anahtarsız ve canlı ölçüldü; healthcheck 15 → 17 uca çıktı.

  - id: FR-19-fedlex-konsolide-metin-taslak-degildir
    given: >-
      Fedlex SPARQL'de bir SR numarası yalnız `classifiedByTaxonomyEntry/skos:notation`
      ile sorgulanıyor.
    expect:
      - "`a jolux:ConsolidationAbstract` (veya URI'de `eli/cc/`) filtresi OLMADAN dönen sonuç 'yürürlükteki birincil metin' olarak SUNULAMAZ."
      - "`DISTINCT` olmadan sonuç sayısı ifade (expression) çoğaltmasıdır — kayıt sayısı olarak raporlanamaz."
      - "`eli/fga/` bir Bundesblatt/taslak kimliğidir; `eli/cc/` konsolide derlemedir."
    rationale: >-
      SR 812.21 sorgusunun filtresiz İLK sonucu `eli/fga/2025/3018` idi ve başlığı
      '… (Entwurf)' taşıyordu; filtreli sorgu doğru kaydı verdi:
      `eli/cc/2001/422` — "Bundesgesetz vom 15. Dezember 2000 über Arzneimittel und
      Medizinprodukte (HMG)". Filtresiz sorgu ayrıca 5 ÖZDEŞ satır döndürdü.
      Taslağı yürürlükteki metin diye sunmak no-fabrication ihlalidir.

  - id: FR-20-companion-anahtarsiz-ucu-varsa-wire-edilir
    given: >-
      Bir companion'ın taşıdığı yetenek, anahtarsız erişilebilir bir upstream'e
      dayanıyor ve o upstream için açık kaynak (izin verici lisanslı) bir MCP
      sunucusu mevcut.
    expect:
      - "Yetenek claude.ai OAuth companion'ında BIRAKILMAZ — self-host edilip wire'lanır; bağlı kapı (varsa) companion'dan wire'lı sunucuya taşınır ve hard PASS olur."
      - "Upstream FORK EDİLMEZ: sürüm PİNLİ olarak çalıştırılır ve önüne OAuth kapısı konur. Fork yalnız upstream'in kendi HTTP katmanına müdahale şartsa yapılır."
      - "Upstream 127.0.0.1'e bağlanır; kapıyı atlatan doğrudan erişim mümkün OLMAMALIDIR."
      - "Kapıya giden Authorization YUKARI AKIŞA GEÇİRİLMEZ (en az yetki) — upstream authless çalışır."
      - "Upstream düşükse kapı 502 + açık hata döner; 200 + boş sonuç ASLA (FR-16 ile aynı gerekçe)."
    rationale: >-
      2026-08-08: `Open Law`ın AB yarısı (eurlex) ve `Fedlex Swiss` bu yolla
      companion'dan wire'a taşındı. (Aynı gün bir sınai-mülkiyet ucu da taşındı;
      o uç 2026-08-17'de ölü Capsolver upstream yüzünden emekli edildi.) eurlex
      için upstream `@cyanheads/eur-lex-mcp-server` (Apache-2.0) 0.9.8'e pinlenip
      HP'de 127.0.0.1:8316'da authless koşuyor, önünde tek-kiracılı OAuth 2.1
      kapısı (:8315 → eurlex.cureonics.com). Fork YOK. Kalan companion'lar
      (Yargı / Open Law UK / Ansvar) claude.ai OAuth yüzeyidir — kararlı
      self-host URL yok, wire edilemez.

  - id: FR-21-g6-artik-companion-a-bagli-degil
    given: >-
      G6 (CELEX konsolide doğrulaması) kapısı denetleniyor ve `Open Law`
      companion'ı bağlı değil.
    expect:
      - "G6 CONDITIONAL'a DÜŞMEZ — wire'lı `eurlex` sunucusu (eurlex_lookup_celex) kapıyı taşır: hard PASS."
      - "eurlex de erişilemezse G6 programatik yedeğe (ep.eurlex_sparql) düşer ve CONDITIONAL işaretlenir."
      - "german-law get_eu_basis G6 ikamesi DEĞİLDİR — Almanya-çapalıdır, CELEX üretmez."
    rationale: >-
      yoktez ve eurlex geçişleriyle aynı mantık: bir kapı, yetkilendirme
      bekleyen bir dış connector'a bağlı kaldığı sürece kırılgandır. Doğrulama
      iki BAĞIMSIZ yolla yapıldı — ham CELLAR SPARQL ve eurlex_lookup_celex,
      CELEX 32001L0083 için aynı cellar URI'sini, aynı türü (DIR) ve aynı tarihi
      (2001-11-06) verdi.

  - id: FR-22-upstream-arac-argumani-sarmalayabilir
    given: >-
      Wire'lı bir sunucu araç argümanlarını `{"params": {...}}` gibi bir
      sarmalayıcı içinde bekliyor (FastMCP/pydantic deseni).
    expect:
      - "Düz argüman gönderen çağrı `Field required` doğrulama hatası alır; bu bir VERİ YOKLUĞU değil ÇAĞRI HATASIDIR ve öyle raporlanmalıdır."
