suite:
  id: mod9_medical_research
  title: "Mod 9 (EX_POST_EVALUATION) × medical-research Entegrasyon ve Şema Testleri"
  version: "1.0"
  target_skill: cureolex
  target_version: ">= 2.6.0"
  evaluator: [manual, smp-orchestrator, json_schema]
  description: >
    EX_POST_EVALUATION modunun (Mod 9) dokuz karar/tetikleme noktasında tutarlı
    davrandığını doğrular: otomatik medical-research çağrısı (R14 §1.2/§1.3/§6.1/§9),
    §5+§14.f+§19 zorunlu bölümler, ex_post_metrics zorunluluğu (G9), ve sidecar
    şemasının en az 2.3.1 olması zorunluluğu (R14b pseudocode 11. adım). sidecar_fixture
    blokları schemas/medical_sidecar.schema.json'a karşı doğrulanabilir; expect.schema_valid
    beklenen sonucu verir.

cases:
  - id: MOD9-001
    title: "Mod 9 otomatik tetikleme — dokuz nokta tutarlılığı"
    given: "İlaç geri ödeme politikasının 28 aylık uygulama sonrası ex post değerlendirmesini yap."
    expect:
      mode: EX_POST_EVALUATION
      medical_research: mandatory
      required_sections: ["§5", "§14.f", "§19"]
      trigger_points_consistent:
        - "SKILL.md §0 standalone parantezi (EX_POST_EVALUATION listede)"
        - "SKILL.md R14-paren"
        - "R14 §1.2 tetikleme tablosu"
        - "R14 §1.3 pseudocode auto-call set"
        - "R14 §4.9 Mod 9 handoff"
        - "R14 §6.1 karar ağacı zorunlu çağrı seti"
        - "R14 §6.3 consumption tablosu"
        - "R14 §9 composes_with.auto_trigger_modes"
        - "R14 §15 G9 + manifest mandatory_in_modes"
    assertions:
      - "EX_POST_EVALUATION dokuz noktanın tamamında medical-research'ü zorunlu kılmalı."
      - "v2.5.7 sonrası §6.1 ve §9 da Mod 9'u içermeli (eski 6-mod set OLMAMALI)."
    rationale: "v2.5.7 P1-1/P1-2 — §6.1 + §9 hizalandı; tam PASS."

  - id: MOD9-002
    title: "Geçerli Mod 9 sidecar — G9 PASS"
    given: "sidecar_fixture (klinik/HTA ex post, schema 2.3.1, ex_post_metrics dolu)"
    sidecar_fixture:
      schema_version: "2.3.1"
      medical_research_version: "7.1"
      cureolex_version: "2.6.0"
      generated_at: "2026-06-06T10:00:00Z"
      query_metadata:
        original_query: "Klinik araştırmalar yönetmeliği 28 aylık ex post"
        connectors_used: ["pubmed", "openfda", "titck", "regulatory_api"]
      ex_post_metrics:
        applicable_for_ex_post_evaluation: true
        elapsed_months_since_implementation: 28
        market_data:
          midas_data_available: true
          pre_implementation_market_size_try: 1200000000
          post_implementation_market_size_try: 1450000000
          growth_rate: 0.21
        reimbursement_data:
          rejection_rate: { pre: 0.18, post: 0.12 }
          average_processing_days: { pre: 21, post: 14 }
        judicial_review_outcomes:
          aym_iptal_count: 0
          danistay_iptal_count: 1
          aihm_violations: 0
      epistemic_honesty:
        combined_confidence: "HIGH"
        cureolex_self_disclosure:
          version: "2.6.0"
          sidecar_schema_origin: "2.3.1"
          mcp_unavailability_during_query: []
          uncertain_interpretations: []
    expect:
      schema_valid: true
      gates: { G9: PASS }
    assertions:
      - "schema_version 2.3.1 + ex_post_metrics dolu → şema geçerli."
      - "OECD beş kriteri + K-1/K-2/K-3 kararı + 'teknik öneri, siyasi karar yetkili kurumda' notu üretilmeli (G9)."
    rationale: "R14 §14.6 + G9 tanımı + medical_sidecar.schema allOf (applicable=true → schema 2.3.1 + elapsed + veri bloğu)."

  - id: MOD9-003
    title: "Mod 9 ama eski şema (2.3) — SchemaIncompatibilityError"
    given: "sidecar_fixture (ex_post applicable=true ama schema_version 2.3)"
    sidecar_fixture:
      schema_version: "2.3"
      medical_research_version: "7.1"
      cureolex_version: "2.6.0"
      generated_at: "2026-06-06T10:00:00Z"
      query_metadata:
        original_query: "ex post"
        connectors_used: ["pubmed"]
      ex_post_metrics:
        applicable_for_ex_post_evaluation: true
        elapsed_months_since_implementation: 24
        market_data: { midas_data_available: false }
      epistemic_honesty:
        combined_confidence: "MODERATE"
    expect:
      schema_valid: false
      schema_error: "SchemaIncompatibilityError"
      gates: { G9: FAIL }
    assertions:
      - "applicable_for_ex_post_evaluation=true iken schema_version 2.3.1 OLMALI; 2.3 reddedilmeli."
      - "R14b pseudocode 11. adım: EX_POST_EVALUATION + schema!=2.3.1 → SchemaIncompatibilityError (v2.5.7 P2-1)."
    rationale: "medical_sidecar.schema allOf if(applicable=true) then(schema const 2.3.1) → ihlal."

  - id: MOD9-004
    title: "Mod 9 ama ex_post_metrics eksik/yetersiz — G9 CONDITIONAL/FAIL"
    given: "sidecar_fixture (applicable=true ama elapsed_months ve veri bloğu yok)"
    sidecar_fixture:
      schema_version: "2.3.1"
      medical_research_version: "7.1"
      cureolex_version: "2.6.0"
      generated_at: "2026-06-06T10:00:00Z"
      query_metadata:
        original_query: "ex post"
        connectors_used: ["pubmed"]
      ex_post_metrics:
        applicable_for_ex_post_evaluation: true
      epistemic_honesty:
        combined_confidence: "LOW"
    expect:
      schema_valid: false
      gates: { G9: CONDITIONAL }
    assertions:
      - "applicable=true iken elapsed_months_since_implementation + en az bir veri bloğu (market/reimbursement/clinical) ZORUNLU."
      - "Eksikse G9 CONDITIONAL/FAIL döner (R14 §15.1 G9 satırı + §6.3 Mod 9 notu)."
    rationale: "exPostMetrics $def if-then: applicable=true → required elapsed + anyOf veri bloğu."

  - id: MOD9-005
    title: "Mod 9 DEĞİL — ex_post_metrics yokluğu sorun değil"
    given: "sidecar_fixture (DRAFT için, ex_post_metrics yok, schema 2.3.1)"
    sidecar_fixture:
      schema_version: "2.3.1"
      medical_research_version: "7.1"
      cureolex_version: "2.6.0"
      generated_at: "2026-06-06T10:00:00Z"
      query_metadata:
        original_query: "ATMP yönetmelik taslağı"
        connectors_used: ["pubmed", "ema", "clinical_trials"]
      evidence_grading:
        primary_endpoint_evidence:
          grade: "HIGH"
          study_count: 2
          design: "Phase III RCT"
      epistemic_honesty:
        combined_confidence: "HIGH"
    expect:
      schema_valid: true
      gates: { G9: not_applicable }
    assertions:
      - "Mod 9 etkin değilken ex_post_metrics yokluğu şema ihlali DEĞİL (allOf if tetiklenmez)."
      - "G9 sadece Mod 9 etkinse uygulanır (conditional)."
    rationale: "medical_sidecar.schema allOf yalnızca ex_post_metrics.applicable=true iken tetiklenir."

  - id: MOD9-006
    title: "Mod 9 zorunlu bölüm eksikliği — §19 pipeline yokluğu"
    given: "Mod 9 çıktısı §5 ve §14.f içeriyor ama §19 (DrugIntelligence/pipeline) eksik."
    expect:
      mode: EX_POST_EVALUATION
      gates: { G9: CONDITIONAL }
      required_sections: ["§5", "§14.f", "§19"]
    assertions:
      - "§5 + §14.f + §19 üçü de zorunlu; biri eksikse G9 tam PASS olmamalı."
    rationale: "R14 §1.2/§6.1 EX_POST satırı — §5 + §14.f + §19 zorunlu."
