# =============================================================================
# Skill Manifest Protocol (SMP) v1.0  ·  carbon-edupedia
# Makine-okunur composability sözleşmesi. İnsan kılavuzu: SKILL.md
# =============================================================================
manifest_version: '1.0'
protocol_reference: 'https://github.com/anthropics/skill-manifest-protocol/blob/main/SKILL_MANIFEST_PROTOCOL.md'

skill:
  name: carbon-edupedia
  version: 3.0.0
  title: Carbon Edupedia — DEHB-Odaklı Etkileşimli Öğrenim Modülü Üreticisi (IBM Carbon v11, WCAG 2.1 AA, Müfredat MCP)
  description: >-
    Kaynak metinden VEYA MEB Müfredat MCP'sinden (Türkiye Yüzyılı Maarif Modeli
    kazanımları), DEHB/ADHD-odaklı, IBM Carbon Design System v11 ile biçimlendirilmiş,
    emojisiz ama ikon/piktogram/SVG zengini, tek-dosya ETKİLEŞİMLİ öğrenim modülleri
    (oyun/quiz/yarışma/flashcard + kaynağa sadık, kapsamlı öğretim katmanı) üretir.
    Müfredat MCP entegrasyonu: kazanım kodundan/ders+sınıftan modül üretir, resmî
    beceriyi (Kavramsal Beceriler KB2.x) etkileşim desenine haritalar, kazanım-izlenebilir
    provenans damgalar (G-CURRICULUM). Ders-bağımsız (fen, matematik, sosyal
    bilgiler, Türkçe, tarih, fizik, kimya, biyoloji); ortaokul/ilkokul/lise.
    8 mod, 13 kalite kapısı (v3.0.0 — G-FLOW + G-CARBON-GRID eklendi), 5 ek
    segment tipi (hook, worked, selfExplain, sim, conceptMap); token katmanı
    @carbon/* npm otoritesiyle doğrulanır (G-TOKEN + sync aracı), Figma Carbon
    v11 kütüphaneleri opsiyonel görsel QA. Disambiguation: francais-coach → Fransızca React;
    carbon-html-report → statik baskı HTML; carbon-pptx → slayt;
    frontend-design → genel React UI; Müfredat MCP yalnız Türkiye MEB.
  entry_point: ./SKILL.md
  license: MIT
  authors:
    - Mahir Bey
  changelog: ./docs/CHANGELOG.md

