  - name: who-gho
    url: https://who-gho-mcp.cureonics.workers.dev/mcp
    tier: K-epi
    auth_env: null
    role: >-
      Küresel/ülke epidemiyoloji + hastalık yükü (eksen 0.5.K → §1.3/§2 'Epidemiyoloji/yük'
      GLOBAL basamağı) — PopHIVE'ın ABD-only boşluğunu native kapatır (kanser yükü için
      who-gho'yu globocan tamamlar; IHME hâlâ boşluk). Araçlar: who_gho_search_indicators
