  - name: openathens
    url: https://openathens.cureonics.com/mcp
    tier: O
    auth_env: OPENATHENS_MCP_API_KEY
    role: >-
      Tam-metin cascade Tier 3 — LİSANSLI kurumsal (legal-öncelikli, annas Tier 5'in
      ÖNÜNDE). 10 araç (ölçüm 2026-08-07): oa_resolve · oa_fetch_fulltext(ingest) ·
      oa_verify_access (DOI erişilebilir mi — getirmeden ÖNCE sor, boşa Tier-3 çağrısı
      harcama) · oa_session_status · oa_list_databases · oa_server_info ·
      oa_batch_submit/oa_batch_result · search/fetch (deep-research sözleşmesi). Millet
      Kütüphanesi/OpenAthens SAML →
      ProQuest/EBSCO/ScienceDirect/Wiley/Nature/JSTOR/Cochrane. ANTI-BOT v2: getirme Xvfb
      altında headed kalıcı-profilli Chromium ile sürer (gerçek parmak-izi + cf_clearance) →
      anti-bot'lu yayıncılarda (Wiley/Elsevier/OUP/Sage/T&F) non-interactive Cloudflare
      challenge kendiliğinden temizlenir ve TAM METİN gelir; yalnız interactive
      reCAPTCHA/Turnstile çözülemezse `challenge_required` zarfı döner (host + operatör
      noVNC ipucu; manual_required'dan AYRI, gövdesiz — uydurma yok) → kullanıcıya 'operatör
      noVNC gerekiyor' bildir + Tier 4/5'e degrade et (sessiz atlama YOK). Oturum
      sıcaklığı/bekleyen challenge: oa_session_status
      (validated/session_age_s/pending_challenge). Bağlı değilse cascade Tier 4/5'e düşer.
      Key ${OPENATHENS_MCP_API_KEY} Doppler'da → ek credential yok
    extra:
      _trust: >-
        operator self-host (HP systemd — hardened OAuth 2.1 + Bearer; yok-akademik/annas ile
        aynı desen)
      _probe: >-
        2026-07-14 CANLI + claude.ai-optimize: OAuth 2.1 tam dans doğrulandı
        (DCR→authorize→S256 PKCE→token), CORS preflight 204 + WWW-Authenticate expose
        (browser bootstrap), 401 mutlak resource_metadata (RFC 9728). Anti-bot v2
        canlı (Xvfb headed profil; gerçek PDF tam-metin teyitli). 2026-08-07 yeniden ölçüm:
        v3.4.2 · 10 araç (kayıt 7 diyordu — oa_verify_access/search/fetch belgelenmemişti);
        oa_list_databases canlıda `manual_required: databases_unreachable` döndürüyor
        (dürüst degrade — lisanslı DB listesi upstream'den okunamıyor, cascade etkilenmez).

  - name: annas-reader
    url: https://annas.cureonics.com/mcp
    tier: O
