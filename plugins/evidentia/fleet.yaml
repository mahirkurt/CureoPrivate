      ayrıştırma → her sorgu için vektör (bge-m3) ∥ BM25 (FTS5) → RRF füzyon (tüm sorgu×arm)
      → cross-encoder rerank (bge-reranker) → top-k; her aşama graceful-degrade.** Karmaşık
      çok-yönlü soruda recall-maks (detay atlamama): soruyu alt-yönlere/eşanlamlılara
      böl→`queries[]` ile geç; kavramsal+tam-terminoloji (ilaç/gen/kod). §8 retrieval
      telemetri CF-log'da. Bağlam-penceresi koruması (evidence_index). Vectorize 1024-d
      cosine + D1 graph + FTS5; Worker ver 984a9b59
    extra:
      _trust: >-
        operator self-host (Cloudflare Worker — hardened OAuth 2.1 S256 + Bearer;
