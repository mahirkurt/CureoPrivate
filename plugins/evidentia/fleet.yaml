# evidentia MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json · .codex-plugin/plugin.json (mcpServers+version) · fleet.lock.json
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all` (ağ gerektirmez)
# Canlı sağlık:     `python3 tools/fleetkit/audit_plugins.py`

version: 2
plugin: evidentia
plugin_version: "2.5.0"

# ─────────────────────────────────────────────────────────────────────────────
# COMPANION'LAR — operatör çalışma alanına bağlı, .mcp.json'a GİRMEYEN connector'lar.
# Kayıtta (§2.3/§2.5 + CONNECTORS.md) atıf yapılan opsiyonel bibliyografik katman.
# Buradan `agents/evidence-synthesizer.md` içindeki GEN:agent-tools bloğu türetilir —
# 2026-08-07'ye kadar o ajanın izin listesi ELLE yazılmıştı ve içinde HİÇ MCP aracı yoktu.
# ─────────────────────────────────────────────────────────────────────────────
companions:
  - name: PubMed
    tool_prefixes: ["mcp__claude_ai_PubMed__", "mcp__pubmed-epmc__"]
    manifest_row: "PubMed (companion — bibliyografik çekirdek, hesap düzeyi)"
    degrade: "pubmed-epmc (wire'lı) PubMed/EPMC/Unpaywall yüzeyini zaten taşır."

  - name: Paper Search
    tool_prefixes: ["mcp__claude_ai_Paper_Search__", "mcp__paper-search__"]
    manifest_row: "Paper Search (companion — preprint tam-metin read_*_paper)"
    degrade: "Preprint tam-metni pubmed-epmc/EuropePMC OA yoluna degrade eder."

  - name: Clinical Trials
    tool_prefixes: ["mcp__claude_ai_Clinical_Trials__"]
    manifest_row: "Clinical Trials (companion — ClinicalTrials.gov kayıt katmanı)"
    degrade: "Kayıt-temelli çalışma tespiti yapılamaz; PRISMA akışında boşluk beyan edilir."

  - name: AdisInsight
    tool_prefixes: ["mcp__claude_ai_AdisInsight__"]
    manifest_row: "AdisInsight (companion — ilaç/çalışma istihbaratı)"
    degrade: "Boru-hattı/geliştirme-fazı zenginleştirmesi düşer; çekirdek etkilenmez."

  - name: Elicit
    tool_prefixes: ["mcp__claude_ai_Elicit__"]
    manifest_row: "Elicit (companion — SR tarama yardımcısı)"
    degrade: "P3 tarama tamamen native connector'larla yürür."

  - name: Consensus
    tool_prefixes: ["mcp__consensus__", "mcp__claude_ai_Consensus__"]
    manifest_row: "Consensus (companion — atıf-temelli uzlaşı taraması)"
    degrade: "Uzlaşı sinyali OpenAlex/S2 atıf ağına degrade eder."

  - name: YÖK Tez
    tool_prefixes: ["mcp__yoktez__", "mcp__claude_ai_Yoktez__"]
    manifest_row: "YÖK Tez (companion — Türkiye tez katmanı, Türkiye Dörtlüsü)"
    degrade: "Türkiye Dörtlüsü'nün tez ayağı düşer → 'Türkiye Veri Boşluğu' beyan edilir."

  - name: Literatür
    tool_prefixes: ["mcp__literatur__", "mcp__claude_ai_Literatur__"]
    manifest_row: "Literatür/DergiPark (companion — TR tam-metin)"
    degrade: "TR tam-metin openathens/annas şelalesine degrade eder."

