      · who_gho_dimensions (COUNTRY/SEX/AGEGROUP/REGION çözümü)
    extra:
      _scope: >-
        global
      _trust: >-
        operator self-host (Cloudflare Worker) — AÇIK/keyless (MCP_ALLOW_NO_AUTH=1):
        upstream WHO GHO OData (ghoapi.azureedge.net) authless, server-side sır YOK →
        confused-deputy yok; salt-okunur. Değer OTORİTER (WHO GHO) ama
        modellenmiş+raporlanan karışımı → her satır caveat taşır, ülke/yıl yoksa boşluk
        (uydurma yok)
      _probe: >-
        2026-07-05 CANLI (Version 30df2ff2) — keyless initialize 200 · tools/list 3 araç ·
        who_gho_query(WHOSIS_000001,TUR,2019) E2E → 77.6/75.1/80.1 (BTSX/MLE/FMLE) + caveat;
        upstream /Indicator, /DIMENSION/COUNTRY/DimensionValues doğrulandı

  - name: globocan
    url: https://globocan-mcp.cureonics.workers.dev/mcp
    tier: K-epi
    auth_env: null
    role: >-
      Küresel/ülke KANSER yükü (eksen 0.5.K, Onko ekseni § — who-gho'nun genel GHO'sunu
      kanser-özelinde tamamlar; PopHIVE ABD-only'yi global insidans/mortalite ile aşar;
      IHME/GBD hâlâ boşluk). Araçlar: gco_list_cancers (36 site + ICD) ·
      gco_resolve_population (ISO3/ad→GLOBOCAN kodu; TUR=792) · gco_query (population +
      cancer + sex + incidence/mortality → total/ASR/crude/cum_risk/rank/UI)
    extra:
      _scope: >-
        global
      _trust: >-
        operator self-host (Cloudflare Worker) — AÇIK/keyless (MCP_ALLOW_NO_AUTH=1):
        upstream IARC GLOBOCAN 2022 API (gco-api.iarc.fr) authless+headerless, server-side
        sır YOK → confused-deputy yok; salt-okunur. Değer IARC-otoriter ama MODELLENMİŞ
        TAHMİN (referans yıl 2022, ülke veri-yoğunluğuna göre metodoloji değişir) → her
        satır ui belirsizlik aralığı + caveat; kombinasyon yoksa boşluk (uydurma yok)
      _probe: >-
        2026-07-05 CANLI (Version 8825e031) — endpoint Playwright ile Cancer Today XHR'inden
        yakalandı; path {type}/{sex} (sex/type sırası bilinen-değerle DOĞRULANDI, ilk
        sürümdeki swap düzeltildi). E2E: Türkiye(792) female breast(20) mortalite
        7360/insidans 25249 (yayınlanan değerlerle birebir), male lung(15) insidans
        33039/mortalite 32119; all-cancers female 34 satır (Meme rank 1, 25249),
        sessiz-kesme yok; prevalence prev_time 1/3/5; 41 kanser sitesi ICD'li

  - name: ema
    url: https://ema-mcp.cureonics.workers.dev/mcp
    tier: O
    auth_env: null
    role: >-
      AB merkezi ruhsat + CHMP/EPAR (Regülatuar 0.5.C — RegulatoryMCP kaldırıldığında kalan
      EMA boşluğunu kapatır; openFDA'nın AB muadili). Her AB ilacı: ruhsat durumu · CHMP
      opinion/decision tarihi ·
      orphan/conditional/accelerated/PRIME/advanced-therapy/biosimilar bayrakları · ATC ·
      INN · MAH · endikasyon · EPAR URL. Araçlar: ema_search_medicines · ema_get_medicine ·
      ema_filter (ATC prefix+status+bayraklar) · ema_stats. Tam metin EPAR url'inde (talep
      üzerine anamnesis'e ingest)
    extra:
      _scope: >-
        eu-regulatory
      _trust: >-
        operator self-host (Cloudflare Worker) — AÇIK/keyless (MCP_ALLOW_NO_AUTH=1): BAKED
        public dataset (EMA Medicines/EPAR XLSX, build_corpus.mjs), runtime upstream çağrısı
        YOK, server-side sır YOK → confused-deputy yok. Değer EMA-otoriter; nokta-zaman
        snapshot → generated_at damgası + caveat; snapshot'ta yoksa yokluk-kanıtı değil
        (uydurma yok)
      _probe: >-
        2026-07-05 CANLI (Version ff226c89) — baked corpus 2712 ilaç (2321 beşeri/391 vet,
        1863 authorised), generated_at 05/07/2026; E2E: ema_get_medicine
        Keytruda→Authorised/L01FF02/opinion 2015-05-20, ema_filter(L01,authorised,orphan)→5
        onkoloji, ema_stats total 2712

  - name: mevzuat-bilgisi
    url: https://mevzuat.surucu.dev/mcp
    tier: secondary
    auth_env: null
    role: >-
      İKİNCİL TR-mevzuat çapraz-kontrol: kanun-NUMARASI lookup + bedesten (primer Mevzuat
      keyword-aramasında yok). Tek-sefer cache'e tabi; yalnız primer-Mevzuat-miss VEYA
