    auth_env: null
    role: >-
      Terminoloji çapraz-yürüyüşü: ICD-11, SNOMED, LOINC, RxNorm, MeSH, ATC, CID-10 (37
      araç) — medical-research §6 boşluk-kapatıcı
    extra:
      _trust: >-
        community-unverified (io.github.SidneyBissoli) — least-privilege, sandbox-first,
        klinik çıktıyı bağımsız çapraz-doğrula
      _probe: >-
        2026-08-07 HTTP 200 · serverInfo medical-terminologies-mcp v1.5.7 · 31 araç

