      (validated/session_age_s/pending_challenge). Bağlı değilse cascade Tier 4/5'e düşer.
      Key ${OPENATHENS_MCP_API_KEY} Doppler'da → ek credential yok
    extra:
      _trust: >-
        operator self-host (HP systemd — hardened OAuth 2.1 + Bearer; yok-akademik/annas ile
