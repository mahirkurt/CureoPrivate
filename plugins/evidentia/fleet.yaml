      ⚠️ D7 (ölçüm 2026-08-07): `search_mevzuat` `page_size` varsayılanı 25, bedesten
      upstream'i 20 ile sınırlı → varsayılan çağrı DAİMA hata döndürür ve bunu isError
      OLMADAN düz metin verir (sessiz başarısızlık); DAİMA `page_size: 20` geç
      (guard_tool_call.py bunu zorlar). `search_kanun` zorunlu argümanı `aranacak_ifade`'dir
      (`phrase` değil)
    extra:
      _secondary: true
      _trust: >-
        topluluk (surucu.dev) — primer Mevzuat'a ÇAPRAZ-KONTROL aynası; primacy primer
        Mevzuat'tadır
      _probe: >-
        2026-06-28 HTTP 200 · search_kanun('ilaç')→67 (kanun-NUMARASI lookup +
        bedesten.adalet.gov.tr ikinci kaynak)

  - name: titck
    url: https://titck.cureonics.com/mcp
    tier: O
    auth_env: TITCK_MCP_API_KEY
    role: >-
      Türkiye ilaç indeksinin KANONİK kaynağı (Türkiye Dörtlüsü) — 66 araç, v0.5.8 (ölçüm
      2026-08-07). ⚠️ 2026-07-31'de `titck-cache-mcp` Worker'ı EMEKLİ edildi ve önbellek
      sunucunun içine taşındı: bu URL artık bir "önbellek/yedek basamak" DEĞİL, kapılı
      kanonik uçtur. Eski "native TİTCK stall'da çağır" yönergesi geçersiz — bundle'daki TEK
      TİTCK budur, doğrudan çağrılır. Whitelist: search_drugs · get_drug · get_atc_hierarchy ·
      get_atc_class_summary · find_equivalent_products_by_substance · find_biosimilar_group ·
      find_off_label_uses_for_drug · find_reference_prices_for_drug ·
      compare_drug_to_alternatives · get_price_history · get_withdrawal_trend ·
      find_authorization_cancellations_for_drug
    extra:
      _fix: >-
        2026-08-02 TİTCK kapılanması (Worker cache emekli, önbellek sunucuya taşındı) bu
        plugin'de kaçırıldı: anahtarsız 401. 2026-08-06'da onarıldı.
      _renamed: >-
        2026-08-07: sunucu adı 'titck-cache' → 'titck'. Ad, 2026-08-02'de SİLİNEN bir
        katmana (titck-cache-mcp Cloudflare Worker'ı + KV) atıf yapmaya devam ediyordu;
        uç o tarihten beri doğrudan kapılı Python sunucusudur (önbellek titck_mcp/cache.py
        içine taşındı). Ad ölü katmanı işaret ettiği için hem okuyanı yanıltıyor hem de
        bir sonraki denetimde 'ölü katman' olarak işaretleniyordu. Araç öneki de buna göre
        değişti (plugin-kapsamlı önek sunucu adından türer); eski öneke canlı atıf
        YOKTU — repo genelinde tarandı. Ölü önek burada BİREBİR YAZILMAZ: check_drift
        [6] bir önek geçişini canlı atıf sayar ve haklı olarak sürüklenme raporlar
        (bu not ilk hâlinde tam ona takıldı). Emekliliğin TARİHSEL kaydı
        BUILD.md/CONNECTORS.md/CERTIFICATION.md'de bilerek KORUNDU: silinen katmanın
        hikâyesi silinmez, yalnız canlı ad gerçeğe hizalanır.

  - name: yok-akademik
    url: https://yok-akademik.cureonics.com/mcp
    tier: O
    auth_env: YOK_AKADEMIK_MCP_API_KEY
    role: >-
