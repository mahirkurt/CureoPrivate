      _scope: >-
        us-only
      _trust: >-
        Yale School of Public Health (kamusal, agregat, de-identified; DOI
        10.5281/zenodo.17345935) — otoriter ABD-surveillance; çıktıyı BİREBİR aktar, sayıyı
