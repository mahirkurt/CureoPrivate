[project]
name = "anamnesis-indexer"
version = "0.1.0"
description = "Offline Leiden community detection for anamnesis-mcp GraphRAG global search."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-igraph>=0.11", "leidenalg>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
anamnesis-indexer = "indexer.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["indexer"]

[tool.ruff]
line-length = 100
