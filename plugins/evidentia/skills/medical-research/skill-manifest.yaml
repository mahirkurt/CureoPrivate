    - name: TİTCK                     # 1a49b1bb — Türkiye Dörtlüsü structural
      status: wired
      tools: [search_drugs, get_drug, get_atc_class_summary, find_off_label_uses_for_drug, find_biosimilar_group, find_reference_prices_for_drug, compare_drug_to_alternatives, find_equivalent_products_by_substance, search_regulation_article23, find_authorization_cancellations_for_drug, get_price_history, get_withdrawal_trend, get_atc_hierarchy, search_off_label_uses, find_shared_substance_peers]
    - name: Mevzuat                   # fbf16a1a — SUT/yönetmelik/fiyat kararnamesi
      status: wired
