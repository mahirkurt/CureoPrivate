# --- Verification gates (executable — evals/check_integrity.py) --------------
verification:
  gate_count: 7
  gates:
    - id: G-REF
      description: "Reference integrity — every references/*.md cited by SKILL.md exists on disk"
      command: "python3 evals/check_integrity.py --refs"
      blocking: true
    - id: G-CONN
      description: "Connector resolution — every connector named in connector-registry resolves to a runtime.mcp_servers entry"
      command: "python3 evals/check_integrity.py --connectors"
      blocking: true
    - id: G-ALWAYS
      description: "Adım 0 always-load files all present (connector-registry, extended-api, evidence-grading, output-templates, fulltext-retrieval, report-presentation)"
      command: "python3 evals/check_integrity.py --always-load"
      blocking: true
    - id: G-VERSION
      description: "Version stamp agreement across manifest, SKILL.md frontmatter, SKILL.md H1 changelog"
      command: "python3 evals/check_integrity.py --version"
      blocking: false
    - id: G-REGRESSION
      description: "10 regression queries map to expected layer activation + connector set"
      command: "see evals/benchmark-queries.json (qualitative, run via SKILL.md)"
      blocking: false
    - id: G-COVERAGE
      description: "Semantic coverage — knowledge-map.md references every corpus file; Adım 0.4 coverage_set is emitted; multi-axis fan-out feeds 0.5 loader"
      command: "python3 evals/check_integrity.py --coverage"
      blocking: true
    - id: G-COPYRIGHT
      description: "Full-text sections enforce no-verbatim-bulk + copyright_status gate (fulltext-retrieval.md)"
      command: "manual review per fulltext-retrieval.md"
      blocking: true

# --- References -------------------------------------------------------------
references:
  primary: "./SKILL.md"
  always_load: [connector-registry.md, extended-api.md, evidence-grading.md, output-templates.md, fulltext-retrieval.md, report-presentation.md, knowledge-map.md]
  always_load_roles:
    knowledge-map.md: "semantic coverage index"
  eval_harness: [evals/check_integrity.py, evals/benchmark-queries.json]

# --- Build ------------------------------------------------------------------
build:
  version: "8.4.0"
  release_date: "2026-06-19"
  release_name: "Reference-Integrity & Operability Release"
  compatibility:
    backward_compatible_with: ["8.1", "8.0"]
    breaking_changes: []
    additive_changes:
      - "standalone canonical SMP v1.0 manifest (UP-002)"
      - "executable integrity gate evals/check_integrity.py + 10 regression queries (UP-004)"
      - "recreated 3 always-load files + 8 specialty layers + osint + 4 infra files (UP-001/UP-003)"
      - "α-layer connectors wired: TİTCK Cache, YÖK Akademik, PDF Viewer, Social Listening (UP-005)"
      - "canonical navigational headings (UP-006)"

# --- Constraints (extension) ------------------------------------------------
constraints:
  native_first: true
  drug_intel_gating: "§1.O fires only on axis 0.5.I (drug/MoA/target/pipeline signal)"
  copyright_limits: "enforced — no verbatim bulk; CC-BY via EPMC get_copyright_status"
  clean_copy_doctrine: true
  no_tooling_leakage: true
  viz_directive_isolation: true
  probe_verified_only: true

provenance:
  connector_probe_date: "2026-06-09"
  alpha_layer_added: "2026-06-19"
  registry_discovery_date: "2026-06-19"
  note: "If a connector reference cannot be resolved to a real tool, it is a defect (v8.0 ground-truth principle)."
