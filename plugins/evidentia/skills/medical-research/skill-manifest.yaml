      status: conditional
      tier: secondary
      auth: oauth
      tools: [search_papers, search_trials, list_reports, get_report, create_report]   # probe-verified 2026-06-28 via the OAuth session (search_papers→JULIET NEJM PMID 30501490 live; list_reports live). search_papers/search_trials = corpus search (typeTags RCT/Meta/SR + quartile/year filters); create_report = SR-report generator (quota-bearing — use judiciously). SECONDARY to Consensus; NOT in the mandatory Adım 1 list; cross-validate extracted claims (DEĞİŞMEZ 4).
    # --- Optional / degradable booster (Tier O) ---
    - name: evidentia-kb              # evidentia-kb-mcp.cureonics.workers.dev — KB semantic recall booster (graceful-degrade)
      status: optional
      tier: O
      optional: true
      degradable: true
