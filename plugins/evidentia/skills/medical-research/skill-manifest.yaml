      tools: [search_yok_tez_detailed, get_yok_tez_document_markdown, get_yok_tez_thesis_details, search_yok_tez_by_anabilim_dali]
    # Exa + Tavily REMOVED v1.4.0 — web-retrieval tier eliminated (pure structured-authoritative; no web fallback)
    - name: AdisInsight               # 6a9fd4a4 — REAL schema (drug-intelligence-layer.md); axis 0.5.I
      status: wired
      tools: [search_drugs, get_drug, search_trials, search_drug_companies, search_trial_companies, generate_chart]
    - name: ChEMBL                    # bio-research:chembl (newer; not yet in audit registry — verify)
      status: wired
      tools: [drug_search, compound_search, get_mechanism, get_admet, get_bioactivity, target_search]
    - name: Synapse                   # bio-research:synapse — OAuth-gated (0.5.J)
      status: conditional
      tools: [authenticate]
    - name: OpenTargets               # bio-research:ot — offline at last probe
      status: conditional
      tools: []
    - name: Wiley                     # bio-research:wiley — OAuth-gated; full-text tier 4
      status: conditional
      tools: [authenticate]
