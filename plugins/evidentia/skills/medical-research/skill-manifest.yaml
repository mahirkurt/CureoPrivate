      status: wired
      tools: [search]
    - name: Scholar Gateway           # 0db119cc
      status: wired
      tools: [semanticSearch]
    - name: Paper Search              # 660e91bd — also full-text read/download
      status: wired
      tools: [search, search_pubmed, search_semantic, search_biorxiv, search_google_scholar, read_pubmed_paper, download_pubmed, download_biorxiv, download_semantic]
    - name: Clinical Trials           # 4cc36ce0 (mirror bio-research:c-trials)
      status: wired
      tools: [search_trials, get_trial_details, search_by_sponsor, search_investigators, analyze_endpoints, search_by_eligibility]
    - name: bioRxiv                   # 4e673875 — preprint flag mandatory
      status: wired
      tools: [search_preprints, get_preprint, search_published_preprints, search_by_funder]
    - name: YokTez MCP                # b2d46b46 — Türkçe + İngilizce
