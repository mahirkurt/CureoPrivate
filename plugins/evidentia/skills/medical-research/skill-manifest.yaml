# =============================================================================
# medical-research — Skill Manifest Protocol v1.0 (standalone, machine-readable)
# Added v8.2.0 (UP-002); restructured to the canonical SMP v1.0 schema
# (smp-orchestrator/examples/example-skill-manifest.yaml) so the auditor reads
# structured identity/IO/composition/verification instead of falling back to prose.
# Connector server IDs verified by live MCP probe 9 Jun 2026; α-layer added 19 Jun 2026.
# =============================================================================

manifest_version: "1.0"
protocol_reference: "SMP v1.0 (see SKILL.md 'SMP v1.0 Manifest' section + smp-orchestrator)"

# --- Skill identity ---------------------------------------------------------
skill:
  name: medical-research
  version: "8.4.0"
  title: "Multi-Source Scientific Research & Synthesis Engine"
  description: >
    Turns a clinical / pharma / Türkiye-market question into a critically-appraised,
    Turkish, journal-grade evidence synthesis with knowledge-gap analysis, extending
    when warranted into regulatory, epidemiologic, commercial, IP, full-text and
    disease-specialty dimensions. Orchestrates 20+ verified structured connectors across
    10 specialty axes on a native-MCP-first resolution ladder (no web/OSINT tier — v1.4.0).
  author: "operator (Cureonics fleet)"
  license: "Internal-use grant; AS IS; no warranty"
  entry_point: "./SKILL.md"
  homepage: null

# --- Classification ---------------------------------------------------------
classification:
  primary_category: "medical-clinical-research"
  secondary_categories:
    - "pharma-commercial-intelligence"
    - "document-generation"
  tags:
    - evidence-synthesis
    - oncology
    - hematology
    - regulatory
    - hta
    - epidemiology
    - turkiye
    - kol
    - orchestrator
  primary_domain: MEDICAL_CLINICAL_RESEARCH       # ENRICH_ADVISOR persona hint (P2)

# --- Domains ----------------------------------------------------------------
domains:
  - medical_clinical_research
  - pharma_commercial_intelligence
  - document_production

# --- Inputs -----------------------------------------------------------------
inputs:
  - id: clinical_question
    required: true
    description: >
      The medical / pharma / Türkiye-market question to research.
    mime_types: ["text/plain"]
    semantic_requirements:
      - "A focused clinical, regulatory, epidemiologic, or commercial question"
  - id: structured_identifiers
    required: false
    description: >
      Optional precise anchors: PMID, DOI, NCT-ID, drug name, MoA, molecular target,
      drug class, gene variant, ICD-11 indication code, sponsor name, TİTCK barcode,
      regulatory milestone.
    mime_types: ["text/plain"]

# --- Outputs ----------------------------------------------------------------
outputs:
  - id: evidence-synthesis-markdown
    description: "Format A–I core §1–10 + specialty §11–18 + §19 drug-intel + §21 epidemiology"
    mime_type: "text/markdown"
    features: ["critically-appraised", "GRADE/tiered", "Turkish"]
  - id: clean-copy-report
    description: "v8.1 journal-grade reader-facing article; tooling/telemetry/viz only in non-rendering OPS/VIZ annex"
    mime_type: "text/markdown"
  - id: data-sidecar-json
    description: "evidence/trial/guideline/regulatory/hta tables + specialty/pipeline[AdisInsight]/turkey[TİTCK]/epi[WHO GHO] payloads + sources_summary"
    mime_type: "application/json"
    optional: true
  - id: kol-map
    description: "Ranked author table + network note (US NPI + TR YÖK Akademik)"
    mime_type: "text/markdown"
    optional: true
  - id: patent-landscape
    description: "IP/FTO landscape (Türk Patent); handoff to pharmapatent"
    mime_type: "text/markdown"
    optional: true
  - id: competitive-intel
    description: "Structured pipeline + positioning (AdisInsight/CT.gov); OSINT/web competitive intel handed off to pharmaintel (no web tier here)"
    mime_type: "text/markdown"
    optional: true
  - id: pipeline-snapshot
    description: "AdisInsight pipeline + regulatory history (axis 0.5.I)"
    mime_type: "text/markdown"
    optional: true

# --- Composition (data flow) ------------------------------------------------
composition:
  pipe_from: []                       # accepts a clinical-question directly; no required upstream
  pipe_to:
    - skill: carbon-html-report
      version_constraint: ">=4.0.0"
      rationale: "Consumes .data.json sidecar → publication HTML/PDF; consumes-and-strips VIZ/OPS."
      intermediate_format: "application/json"
    - skill: carbon-pptx
      rationale: "Sidecar → Marp/PowerPoint deck."
      intermediate_format: "application/json"
    - skill: pharmaintel
      rationale: "Commercial deep-dive (medical-research supplies the evidence layer)."
      intermediate_format: "text/markdown"
    - skill: pharmapatent
      rationale: "IP / FTO handoff with Türk Patent output."
      intermediate_format: "text/markdown"
    - skill: thoughtspot-roche
      rationale: "IQVIA MIDAS market-size handoff via the ThoughtSpot connector."
      intermediate_format: "text/markdown"
    - skill: onko-erisim
      rationale: "Individual patient SGK/access handoff (TR)."
      intermediate_format: "text/markdown"
    - skill: saglik-sigorta
      rationale: "Insurance/access handoff (TR)."
      intermediate_format: "text/markdown"
    - skill: lex-sanitas
      rationale: "Health-law / regulatory-reform handoff."
      intermediate_format: "text/markdown"
    - skill: lex-mercator
      rationale: "Commercial-law handoff."
      intermediate_format: "text/markdown"
    - skill: promo-censor
      rationale: "Promotional-material compliance handoff."
      intermediate_format: "text/markdown"
  scope_guard:
    - "individual patient SGK appeal / litigation → onko-erisim / saglik-sigorta (NOT in-skill)"
    - "promotional MLR review → promo-censor (NOT in-skill)"
    - "from-scratch commercial deep-dive → pharmaintel (medical-research provides the evidence layer)"

# --- Runtime (connector dependency surface; D6 + G-CONN read this block) -----
# status: wired = called in Adım 1/specialty packages; conditional = auth/online gated;
#         fallback = native-first secondary; pipe handled in composition.
runtime:
  native_first: true
  mcp_servers:
    - name: PubMed                    # Europe PMC; 8f314cbe (mirror bio-research:pubmed)
      status: wired
      tools: [search_articles, get_full_text_article, get_copyright_status, convert_article_ids, find_related_articles, lookup_article_by_citation, get_article_metadata]
    - name: Consensus                 # b2afd737 — reproduce sign-up/usage message verbatim; ≤3 calls/batch
      status: wired
      tools: [search]
    - name: Scholar Gateway           # 0db119cc
      status: wired
      tools: [semanticSearch]
    - name: Paper Search              # 660e91bd — also full-text read/download
      status: wired
      tools: [search, search_pubmed, search_semantic, search_biorxiv, search_google_scholar, read_pubmed_paper, download_pubmed, download_biorxiv, download_semantic]
    - name: Clinical Trials           # 4cc36ce0 (mirror bio-research:c-trials)
      status: wired
      tools: [search_trials, get_trial_details, search_by_sponsor, search_investigators, analyze_endpoints, search_by_eligibility]
    - name: bioRxiv                   # 4e673875 — preprint flag mandatory
      status: wired
      tools: [search_preprints, get_preprint, search_published_preprints, search_by_funder]
    - name: YokTez MCP                # b2d46b46 — Türkçe + İngilizce
      status: wired
      tools: [search_yok_tez_detailed, get_yok_tez_document_markdown, get_yok_tez_thesis_details, search_yok_tez_by_anabilim_dali]
    # Exa + Tavily REMOVED v1.4.0 — web-retrieval tier eliminated (pure structured-authoritative; no web fallback)
    - name: AdisInsight               # 6a9fd4a4 — REAL schema (drug-intelligence-layer.md); axis 0.5.I
      status: wired
      tools: [search_drugs, get_drug, search_trials, search_drug_companies, search_trial_companies, generate_chart]
    - name: ChEMBL                    # bio-research:chembl (newer; not yet in audit registry — verify)
      status: wired
      tools: [drug_search, compound_search, get_mechanism, get_admet, get_bioactivity, target_search]
    - name: Synapse                   # bio-research:synapse — OAuth-gated (0.5.J)
      status: conditional
      tools: [authenticate]
    - name: OpenTargets               # bio-research:ot — offline at last probe
      status: conditional
      tools: []
    - name: Wiley                     # bio-research:wiley — OAuth-gated; full-text tier 4
      status: conditional
      tools: [authenticate]
    - name: Regulatory MCP            # 922d7cdc — openFDA + ICD-11 + WHO GHO + Health Canada + Federal Register + EUR-Lex (call singly)
      status: wired
      tools: [openfda_search, icd11_search, who_gho_query, health_canada_dpd, federal_register_search, eurlex_expert_search]
    - name: TİTCK                     # 1a49b1bb — Türkiye Dörtlüsü structural
      status: wired
      tools: [search_drugs, get_drug, get_atc_class_summary, find_off_label_uses_for_drug, find_biosimilar_group, find_reference_prices_for_drug, compare_drug_to_alternatives, find_equivalent_products_by_substance, search_regulation_article23, find_authorization_cancellations_for_drug, get_price_history, get_withdrawal_trend, get_atc_hierarchy, search_off_label_uses, find_shared_substance_peers]
    - name: Mevzuat                   # fbf16a1a — SUT/yönetmelik/fiyat kararnamesi
      status: wired
      tools: [search_mevzuat, get_mevzuat_text, get_mevzuat_content, get_anayasa, get_mevzuat_madde_tree, get_mevzuat_madde_diff]
    - name: Türk Patent               # ded65854 — Turkey IP
      status: wired
      tools: [search_patents, search_trademarks, search_designs, get_patent_details]
    - name: NPI Registry              # 64557ced — US PI/KOL verification
      status: wired
      tools: [npi_search, npi_lookup, npi_validate]
    - name: annas-mcp                 # full-text cascade tier 3 (verified); copyright discipline
      status: wired
      tools: [article_search, book_search, article_download, book_download]
    # --- α-layer additions (UP-005): already connected in operator workspace, high-trust ---
    - name: TİTCK Cache               # titck-cache-mcp.cureonics.workers.dev — fast cache/fallback for Türkiye Dörtlüsü
      status: fallback
    - name: YÖK Akademik              # yok-akademik.cureonics.com — Turkish KOL identification (DISTINCT from YokTez)
      status: wired
    - name: PDF Viewer                # in-conversation full-text PDF review
      status: conditional
    # --- Tier-K keyless academic expansion (probe-verified 2026-06-27; bundled in ../../.mcp.json) ---
    - name: OpenAlex                  # openalex.caseyjhand.com — native promotion from rest_fallback; KOL/citation-network/institution disambiguation (§8)
      status: wired
      tier: K
      tools: [openalex_resolve_name, openalex_search_entities, openalex_analyze_trends, openalex_get_citation_graph, openalex_describe_fields]
    - name: PubMed-EPMC              # pubmed.caseyjhand.com — Europe PMC breadth + Unpaywall legal-OA full-text (complements account-level PubMed)
      status: wired
      tier: K
      tools: [pubmed_search_articles, pubmed_fetch_articles, pubmed_fetch_fulltext, pubmed_europepmc_search, pubmed_lookup_mesh, pubmed_format_citations, pubmed_find_related, pubmed_convert_ids, pubmed_lookup_citation, pubmed_spell_check]
    - name: Semantic Scholar         # gateway.pipeworx.io/semanticscholar — secondary citation graph (Consensus+Scholar Gateway already synthesize S2); SEMANTIC_SCHOLAR_API_KEY in Doppler
      status: wired
      tier: K
      tools: [search_papers, get_paper, get_paper_citations, get_author]
    # --- Optional / degradable booster (Tier O) ---
    - name: evidentia-kb              # evidentia-kb-mcp.cureonics.workers.dev — KB semantic recall booster (graceful-degrade)
      status: optional
      tier: O
      optional: true
      degradable: true
      tools: [kb_search]
      role: "KB semantic recall booster (graceful-degrade)"
      note: "Every kb_search call is guarded by reachability; absence degrades to Backbone-A only (still complete). May only raise recall, never gate the flow."
  # Native REST fallbacks (no native MCP) — Python requests via bash_tool (extended-api.md)
  # OpenAlex, Semantic Scholar, Unpaywall PROMOTED to native Tier-K MCP (2026-06-27) — see mcp_servers above
  rest_fallback: [PubChem, DailyMed, DOAJ, J-STAGE, DrugBank]

