# --- Verification gates (executable — evals/check_integrity.py) --------------
verification:
  gate_count: 11
  gates:
    - id: G-REF
      description: "Reference integrity — every references/*.md cited by SKILL.md exists on disk"
      command: "python3 evals/check_integrity.py --refs"
      blocking: true
    - id: G-CONN
      description: "Connector resolution — every connector named in connector-registry resolves to a runtime.mcp_servers entry"
      command: "python3 evals/check_integrity.py --connectors"
      blocking: true
    - id: G-ALWAYS
      description: "Adım 0 always-load files all present (connector-registry, extended-api, evidence-grading, output-templates, fulltext-retrieval, report-presentation)"
      command: "python3 evals/check_integrity.py --always-load"
      blocking: true
    - id: G-VERSION
      description: "Version stamp agreement across manifest, SKILL.md frontmatter, SKILL.md H1 changelog"
      command: "python3 evals/check_integrity.py --version"
      blocking: false
    - id: G-REGRESSION
      description: "10 regression queries map to expected layer activation + connector set"
      command: "see evals/benchmark-queries.json (qualitative, run via SKILL.md)"
      blocking: false
    - id: G-COVERAGE
      description: "Semantic coverage — knowledge-map.md references every corpus file; Adım 0.4 coverage_set is emitted; multi-axis fan-out feeds 0.5 loader"
      command: "python3 evals/check_integrity.py --coverage"
      blocking: true
    - id: G-RAG
      description: "RAG-quality eval (§7.2.1) — output faithfulness: structural floor (citation resolution, source grounding/no-fabrication, no vague attribution, quantitative-claim citation) self-validated on a gold set incl planted negative controls; optional LLM-judge layer (faithfulness/answer-rel/context-rel). MEASURED accuracy, not just structural."
      command: "python3 evals/rag_quality.py   # add --judge with EVIDENTIA_JUDGE_KEY for semantic layer"
      blocking: true
    - id: G-COPYRIGHT
      description: "Full-text sections enforce no-verbatim-bulk + copyright_status gate (fulltext-retrieval.md)"
      command: "manual review per fulltext-retrieval.md"
      blocking: true
    - id: G-PROBE
      description: "Every wired Tier-K/Tier-O connector in connector-registry §2.6 has a WIRE row in the §8 Probe Log (no remembered liveness — probe-verified-only, DEĞİŞMEZ 2)"
      command: "python3 evals/check_integrity.py --probe"
      blocking: true
    - id: G-XVAL
      description: "Each Extended-Tier recipe in SKILL.md Adım 1/B carries an explicit cross-validation gate (patient-impacting output confirmed against an authoritative source, DEĞİŞMEZ 4)"
      command: "python3 evals/check_integrity.py --xval"
      blocking: true
    - id: G-WHITELIST
      description: "No pipeworx-generic tool name (ask_pipeworx/discover_tools/remember/recall/forget/polymarket_*/scan_*/subscribe/validate_claim) appears in the connector-registry §2.6 tool whitelist (tool-level least-privilege, DEĞİŞMEZ 5)"
      command: "python3 evals/check_integrity.py --whitelist"
      blocking: true

# --- References -------------------------------------------------------------
references:
