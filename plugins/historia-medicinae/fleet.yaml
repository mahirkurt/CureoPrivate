# historia-medicinae MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json · fleet.lock.json · ⟨GEN⟩ blokları
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py historia-medicinae`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all` (ağ gerektirmez)
# Canlı sağlık:     `python3 tools/fleetkit/audit_plugins.py`
#
# TASARIM NOTU — neden bu filo:
#   Küresel tıp tarihi tek bir arşivde yaşamaz. Bir salgın sorusu aynı anda (a) hakemli
#   tarihyazımını, (b) dijitalleştirilmiş birincil kaynağı (IIIF yazma/erken basma),
#   (c) dönemin yasama kaydını (karantina nizamnâmesi, sanitary convention, Hansard
#   tartışması), (d) modern terminoloji eşlemesini (retrospektif tanı disiplini) ve
#   (e) monograf tam-metnini ister. Bu yüzden filo beş banda ayrılır; her band kendi
#   degrade kuralına sahiptir ve hiçbiri diğerinin yokluğunda uydurma üretmez.

version: 2
plugin: historia-medicinae
plugin_version: "0.1.0"

servers:
  # ── A. Akademik çekirdek — HER substantif sorguda ateşlenir ────────────────
  - name: openalex
    url: https://openalex-mcp.cureonics.workers.dev/mcp
    tier: academic-core
    auth_env: OPENALEX_MCP_API_KEY
    shard: S1
    modes: [ALL]
    tools_used:
      - openalex_search_entities
      - openalex_resolve_name
      - openalex_get_citation_graph
      - openalex_analyze_trends
      - openalex_describe_fields
    role: >-
      ÇEKİRDEK disiplinler-arası akademik graf — tıp tarihi PubMed'de değil çoğunlukla
      BEŞERİ BİLİMLER dergilerindedir (Bull Hist Med, Med Hist, Soc Hist Med, Isis,
      J Hist Med Allied Sci, Osiris); OpenAlex bu literatürü tarih/bilim-tarihi
      topic'leriyle birlikte kapsayan tek geniş graf. Atıf grafı ekol/etki haritası
      (HISTORIOGRAPHIA), trend analizi periyodizasyon kontrolü sağlar.
    degrade: >-
      Anahtar yoksa akademik keşif semantic-scholar + paper-search üzerinden sürer;
      atıf-grafı temelli ekol haritası ÜRETİLMEZ, manifestoda beyan edilir.

  - name: pubmed-epmc
    url: https://pubmed-mcp.cureonics.workers.dev/mcp
    tier: academic-core
    auth_env: PUBMED_MCP_API_KEY
    shard: S1
    modes: [ALL]
    tools_used:
      - pubmed_search_articles
      - pubmed_fetch_articles
      - pubmed_fetch_fulltext
      - pubmed_lookup_mesh
      - pubmed_europepmc_search
      - pubmed_find_related
      - pubmed_format_citations
    role: >-
      ÇEKİRDEK biyotıp indeksi + tıp tarihi arama stratejisinin ALTYAPISI. Kritik
      yetenek MeSH tarih aparatıdır: `Publication Type: Historical Article`,
      `History of Medicine` ağacı ve yüzyıl tanımlayıcıları (`History, Ancient` …
      `History, 21st Century`) bir konuyu DÖNEME kilitlemeyi sağlar — serbest-metin
      aramanın yapamadığı şey. Europe PMC kolu OA tam-metin getirir.
    degrade: >-
      Anahtar yoksa MeSH-kilitli dönem araması yapılamaz; arama serbest-metne düşer
      ve bu KAPSAM KAYBI olarak manifestoda beyan edilir (sessizce geçilmez).

  - name: semantic-scholar
    url: https://semanticscholar-mcp.cureonics.workers.dev/mcp
    tier: academic-core
    auth_env: SEMANTICSCHOLAR_MCP_API_KEY
    shard: S1
    modes: [ALL]
    tools_used: [search_papers, get_paper, get_paper_citations, get_author]
    role: >-
      ÇEKİRDEK ikinci akademik görüş — OpenAlex'ten bağımsız indeks; bir tarihyazımı
      iddiasının tek bir katalogun tuhaflığına dayanmadığını doğrulayan çapraz kontrol.
    degrade: "Anahtar yoksa openalex + paper-search tek başına taşır; manifestoda beyan."

  - name: paper-search
    url: https://server.smithery.ai/@adamamer20/paper-search-mcp-openai/mcp?api_key=${user_config.smithery_api_key}&profile=${user_config.smithery_profile}
    tier: academic-core
    auth_env: null
    shard: S1
    modes: [ALL]
    tools_used:
      - search_google_scholar
      - search_crossref
      - search_semantic
      - search_pubmed
      - read_crossref_paper
      - read_pubmed_paper
    role: >-
      ÇEKİRDEK Google Scholar + CrossRef kapısı — tıp tarihinin KİTAP ve kitap-bölümü
      ağırlıklı literatürü (monograf, Cambridge/Oxford el kitapları, festschrift) ne
      PubMed'de ne OpenAlex'te tam görünür; Scholar bunları yakalayan tek geniş yüzey.
    degrade: >-
      Smithery anahtarı yoksa graceful degrade — diğer akademik katman devrede kalır,
      ancak monograf/kitap-bölümü kapsamı DARALIR ve bu manifestoda yazılır.

  - name: consensus
    url: https://mcp.consensus.app/mcp
    tier: academic-core
    auth_env: null
    shard: S1
    modes: [MORBUS, CONCEPTUS, HISTORIOGRAPHIA, RELATIO]
    tools_used: [search]
    role: >-
      Hakemli sentez — tartışmalı tarihyazımı iddialarında (ör. "Kara Ölüm gerçekten
      Y. pestis miydi", "germ teorisi ne zaman baskın oldu") çoklu-çalışma özeti.
      OAuth 2.0 tarayıcı akışı.
    degrade: "Bağlı değilse sentez elle triangüle edilir; manifestoda `skipped: bağlı değil`."

  - name: scholar-gateway
    url: https://connector.scholargateway.ai/mcp
    tier: academic-core
    auth_env: null
    shard: S1
    modes: [HISTORIOGRAPHIA, CONCEPTUS, ETHICA, RELATIO]
    tools_used: [semanticSearch]
    role: >-
      Pasaj-düzeyi tam-metin arama — bir tarihyazımı tezinin hangi sayfada
      savunulduğunu/çürütüldüğünü gösterir; alıntı-doğru atıf için gerekli.
    degrade: "Bağlı değilse pasaj-düzeyi atıf yerine sayfa-belirsiz atıf; dürüstçe işaretlenir."

  # ── B. Birincil kaynak — dijitalleştirilmiş yazma, erken basma, arşiv ──────
  - name: ottoman-archives
    url: https://ottoman.cureonics.com/mcp
    tier: primary-source
    auth_env: OTTOMAN_ARCHIVES_MCP_API_KEY
    shard: S2
    modes: [SOURCE_HUNT, MORBUS, INSTITUTIO, CONCEPTUS, EDITIO, PROSOPOGRAPHIA, RELATIO]
    tools_used:
      - ottoman_search_iiif
      - ottoman_fetch_iiif_manifest
      - ottoman_search_within_manifest
      - ottoman_browse_iiif_collection
      - ottoman_convert_date
      - ottoman_parse_ottoman_date
      - ottoman_get_islam_ansiklopedisi
      - ottoman_search_literature
      - ottoman_search_dspace
    role: >-
      BİRİNCİL KAYNAK motoru — adı Osmanlı olsa da IIIF katmanı JENERİKTİR: Gallica
      (BnF tıp koleksiyonu), Library of Congress, Internet Archive, Princeton Figgy,
      Europeana, DPLA üzerinde arama + HERHANGİ bir IIIF v2/v3 manifestini ayrıştırma
      + manifest-içi tam-metin arama. Vesalius, herbal, veba risalesi, anatomi atlası
      gibi küresel tıp tarihi kaynakları bu kapıdan okunur. Ayrıca çok-takvimli tarih
      çevirisi (Hicrî/Rumî/Miladî) ve TDV İA maddeleri.
    degrade: >-
      Anahtar yoksa dijitalleştirilmiş birincil kaynağa programatik erişim KAPANIR →
      araştırmacıya erişim yol haritası verilir (koleksiyon + raf/çağrı numarası),
      belge içeriği ASLA uydurulmaz.

  - name: devlet-arsivleri
    url: https://devarsiv.cureonics.com/mcp
    tier: primary-source
    auth_env: DEVARSIV_MCP_API_KEY
    shard: S2
    modes: [SOURCE_HUNT, INSTITUTIO, PROSOPOGRAPHIA, SANITAS_PUBLICA, RELATIO]
    tools_used:
      - devarsiv_session_status
      - devarsiv_search
      - devarsiv_semantic_search
      - devarsiv_get_belge
      - devarsiv_coverage
    role: >-
      Türkiye kolu için resmî katalog (BOA/BCA/Diplomatik/Askeri) — Tıbhâne-i Âmire,
      Mekteb-i Tıbbiye, karantina/tahaffuzhane, Hıfzıssıhha kurumsal kayıtları.
      TEK-CİHAZ OTURUM KİLİDİ: sorgudan önce `devarsiv_session_status` ile canlılık
      doğrulanır. Derin Osmanlıca paleografi/HTR/satın-alma zanaatı BU PLUGIN'DE
      DEĞİL — `vekayinuvis` delegasyonudur (bkz. delegations).
    degrade: >-
      `session_required` → `degraded` (skip DEĞİL); ottoman-archives + yoktez +
      literatur ile ikame edilir ve kullanıcıya HP noVNC re-login bildirilir.

  # ── C. Tam-metin şelalesi — tıp tarihi MONOGRAF ağırlıklı bir alandır ──────
  - name: openathens
    url: https://openathens.cureonics.com/mcp
    tier: fulltext
    auth_env: OPENATHENS_MCP_API_KEY
    shard: S3
    modes: [ALL]
    tools_used:
      - oa_session_status
      - oa_resolve
      - oa_fetch_fulltext
      - oa_list_databases
      - oa_batch_submit
      - oa_batch_result
    role: >-
      LİSANSLI kurumsal tam-metin kapısı (Tier 3) — Millet Kütüphanesi/OpenAthens
      üzerinden paywall'lı monograf, el kitabı ve ansiklopedi maddesi. Tıp tarihinde
      belirleyici literatürün büyük kısmı OA DEĞİLDİR; yasal-öncelikli banttır.
    degrade: "Bağlanamazsa şelale Tier 4'e iner; atlama değil, sıradaki basamak."

  - name: annas-reader
    url: https://annas.cureonics.com/mcp
    tier: fulltext
    auth_env: ANNAS_MCP_API_KEY
    shard: S3
    modes: [ALL]
    tools_used:
      - book_search
      - article_search
      - get_document_info
      - read_document
      - search_in_document
    role: >-
      SON ÇARE tam-metin (Tier 4) — yalnız lisanslı bant getiremediğinde, açık
      gerekçeyle ve YALNIZ ANALİZ için. Baskısı tükenmiş tıp tarihi monografları
      (Sigerist, Ackerknecht, Temkin külliyatı) çoğu kez başka yolla okunamaz.
      Getirilen metin çıktıya GÖVDE olarak kopyalanmaz; > eşik → anamnesis ingest.
    degrade: "Anahtar yoksa tam-metin şelalesi Tier 3'te biter; eksik metin dürüstçe işaretlenir."

  # ── D. Tarihsel yasama & hukuk — tıbbın kurumsallaşması hukuk kaydında yaşar ─
  - name: uk-legal
    url: https://uk-law.cureonics.com/mcp
    tier: legal-history
    auth_env: UK_LEGAL_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, INSTITUTIO, ETHICA, RELATIO]
    tools_used: [hansard_search, hansard_get_debate, find_case_law_search, format_oscola]
    role: >-
      HANSARD (1803+) — küresel tıp tarihinin en zengin programatik BİRİNCİL yasama
      kaydı. Medical Act 1858 (hekimlik mesleğinin doğuşu), Contagious Diseases Acts,
      Vaccination Acts ve NHS 1946 tartışmaları doğrudan zabıttan okunur; bu, ikincil
      literatürün aktardığı özet DEĞİL kaynağın kendisidir.
      ⚠️ `legislation_*` araçları ölçülmüş biçimde bozuktur (upstream HTTP istemcisi);
      mevzuat METNİ için legislation.gov.uk `/data.akn` programatik yolu kullanılır.
    degrade: "Anahtar yoksa Hansard kapanır; İngiliz yasama tarihi ikincil literatüre iner (beyan edilir)."

  - name: health-policy
    url: https://health-policy-mcp.cureonics.workers.dev/mcp
    tier: legal-history
    auth_env: HEALTH_POLICY_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, ETHICA, RELATIO]
    tools_used:
      - govinfo_search
      - congress_search
      - federal_register_search
      - ecfr_get
      - japan_elaws_search
      - australia_legislation_search
      - semantic_search
    role: >-
      Türkiye-dışı sağlık mevzuatı — GovInfo/Congress tarihsel ABD kaydı (1906 Pure
      Food and Drugs Act, 1938 FD&C, 1962 Kefauver-Harris) + JP/AU/ES/IE/CN/MX/CA.
      SANITAS_PUBLICA modunun karşılaştırmalı omurgası.
    degrade: "Anahtar yoksa karşılaştırmalı yasama katmanı ikincil literatüre iner (beyan edilir)."

  - name: intl-treaty
    url: https://intl-treaty-mcp.cureonics.workers.dev/mcp
    tier: legal-history
    auth_env: INTL_TREATY_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, ETHICA, MORBUS, RELATIO]
    tools_used: [treaty_status, treaty_reservations, coe_treaty_signatories, intl_treaty_info]
    role: >-
      Uluslararası norm katmanı — Uluslararası Sanitary Konvansiyonları geleneğinin
      mirasçısı belgeler, Oviedo (CETS 164) biyoetik sözleşmesi, MEDICRIME (211) ve
      BM insan hakları sözleşmelerinin sağlık maddeleri. ETHICA modunda Nürnberg →
      Helsinki → Oviedo normatif soyağacının doğrulanabilir ucu.
      ⚠️ coe.int canlı yolu inerttir → küratörlü anlık-görüntüler servis edilir
      (`snapshot_age_days` + `mcp_verified:false` taşır).
    degrade: "Anahtar yoksa normatif soyağacı ikincil literatürle kurulur; beyan edilir."

  - name: mevzuat
    url: https://mevzuat.cureonics.com/mcp
    tier: legal-history
    auth_env: MEVZUAT_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, INSTITUTIO, RELATIO]
    tools_used:
      - search_mevzuat
      - search_mulga_mevzuat
      - get_mevzuat_gerekce
      - get_mevzuat_timeline
      - get_onceki_metinler
      - resolve_resmi_gazete
    role: >-
      Türkiye yasama kolu — özellikle `search_mulga_mevzuat` (yürürlükten kalkmış
      sağlık mevzuatı) ve `get_mevzuat_gerekce`: 1219 sayılı Tababet ve Şuabatı
      Sanatlarının Tarzı İcrasına Dair Kanun (1928), 1593 Umumi Hıfzıssıhha Kanunu
      (1930) gibi kuruluş metinlerinin gerekçe ve zaman çizgisi.
    degrade: "Anahtar yoksa TR yasama tarihi resmigazete/tbmm ile kısmen ikame edilir."

  - name: tbmm
    url: https://tbmm.cureonics.com/mcp
    tier: legal-history
    auth_env: TBMM_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, INSTITUTIO, RELATIO]
    tools_used:
      - tbmm_search_kanun
      - tbmm_search_kanun_teklifi
      - tbmm_get_kanun_teklifi
      - tbmm_search_tutanak
      - tbmm_search_acik_erisim
    role: >-
      TBMM yasama soyağacı ve zabıtları — Hansard'ın Türkiye karşılığı: 1219 ve 1593
      müzakerelerinde hekimlik mesleğinin nasıl tanımlandığı doğrudan tutanaktan
      okunur. Açık Erişim DSpace geç-Osmanlı/erken-Cumhuriyet meclis kayıtları.
    degrade: "Anahtar yoksa TR meclis kaydı kapanır; ikincil literatüre iner (beyan edilir)."

  - name: resmigazete
    url: https://resmi-gazete-mcp.cureonics.workers.dev/mcp
    tier: legal-history
    auth_env: RESMI_GAZETE_MCP_API_KEY
    shard: S4
    modes: [SANITAS_PUBLICA, INSTITUTIO]
    tools_used: [rg_resolve_date, rg_get_item, rg_search, rg_ocr_submit, rg_ocr_result]
    role: >-
      T.C. Resmî Gazete erken-Cumhuriyet arşivi (1920+) — bir sağlık düzenlemesinin
      BİRİNCİL yayın kaydı ve tarihi; taranmış sayfalar OCR ile metne çevrilir.
    degrade: "Anahtar yoksa yayın kaydı mevzuat `resolve_resmi_gazete` ile dolaylı kurulur."

  # ── E. Terminoloji & epidemiyoloji — retrospektif tanı disiplininin dayanağı ─
  - name: med-terminologies
    url: https://medical.sidneybissoli.com/mcp
    tier: terminology
    auth_env: null
    shard: S5
    modes: [MORBUS, EDITIO, CONCEPTUS, RELATIO]
    tools_used:
      - mesh_search
      - mesh_descriptor
      - mesh_tree
      - icd11_search
      - map_icd10_to_icd11
      - find_equivalent
      - terminology_versions
    role: >-
      Terminoloji otoritesi — tarihsel hastalık adının (consumption, dropsy, apoplexy,
      ague, sıtma-yı muhrika) modern karşılığını ARAŞTIRMA NESNESİ olarak ele almayı
      sağlar. Bu eşleme bir CEVAP değil bir HİPOTEZDİR: retrospektif tanı disiplini
      (bkz. references/retrospective-diagnosis.md) eşlemeyi asla kesin tanı saymaz.
      MeSH ağacı ayrıca dönem tanımlayıcılarının kaynağıdır.
    degrade: "Erişilemezse tarihsel terim modern koda BAĞLANMAZ — terim özgün hâliyle bırakılır."

  - name: who-gho
    url: https://who-gho-mcp.cureonics.workers.dev/mcp
    tier: epidemiology
    auth_env: null
    shard: S5
    modes: [MORBUS, SANITAS_PUBLICA]
    tools_used: [who_gho_search_indicators, who_gho_query, who_gho_dimensions]
    role: >-
      20. yüzyıl sonrası küresel sağlık göstergeleri — çiçek eradikasyonu, aşılama
      kapsamı, çocuk ölümlülüğü gibi uzun serilerin NİCEL ucu. Yalnız WHO'nun
      yayımladığı dönem için geçerlidir; öncesine PROJEKSİYON YAPILMAZ.
    degrade: "Erişilemezse nicel seri verilmez; nitel anlatı korunur."

  - name: globocan
    url: https://globocan-mcp.cureonics.workers.dev/mcp
    tier: epidemiology
    auth_env: null
    shard: S5
    modes: [MORBUS]
    tools_used: [gco_query, gco_list_cancers, gco_resolve_population]
    role: >-
      Kanser epidemiyolojisi (IARC) — onkolojinin 20.–21. yüzyıl tarihinde bugünkü
      yük tablosunun referans noktası. Tarihsel seri DEĞİL, çağdaş kesittir.
    degrade: "Erişilemezse çağdaş kesit atlanır; tarihsel anlatı etkilenmez."

  # ── F. Türkiye akademik kolu (tam-kapsam kararı gereği) ────────────────────
  - name: yoktez
    url: https://yoktezmcp.fastmcp.app/mcp
    tier: turkiye
    auth_env: null
    shard: S6
    modes: [SOURCE_HUNT, INSTITUTIO, PROSOPOGRAPHIA, MORBUS, RELATIO]
    tools_used:
      - search_yok_tez_detailed
      - get_yok_tez_thesis_details
      - get_yok_tez_document_markdown
      - search_yok_tez_by_anabilim_dali
    role: >-
      YÖK Ulusal Tez Merkezi — Türkiye'de tıp tarihi ve deontoloji anabilim dallarının
      tez üretimi; arşiv belgesi transkripsiyonlarına erişimin birincil dolaylı yolu.
      Authless.
    degrade: "Upstream düşerse TR tez katmanı `degraded` yazılır; literatur ile ikame."

  - name: literatur
    url: https://literatur-mcp.surucu.dev/mcp
    tier: turkiye
    auth_env: null
    shard: S6
    modes: [ALL]
    tools_used: [search_articles, pdf_to_html, get_article_references]
    role: >-
      DergiPark tam-metin — Türkçe tıp tarihi dergileri (Osmanlı Bilimi Araştırmaları,
      Tıp Tarihi Araştırmaları, Lokman Hekim Dergisi) ve referans çıkarımı. Bu
      literatür Batı indekslerinde büyük ölçüde GÖRÜNMEZ; Türkiye kolunun taşıyıcısı.
    degrade: "Upstream düşerse TR makale katmanı `degraded`; yoktez ile kısmen ikame."

  - name: yok-akademik
    url: https://yok-akademik.cureonics.com/mcp
    tier: support
    auth_env: YOK_AKADEMIK_MCP_API_KEY
    shard: S6
    modes: [PROSOPOGRAPHIA, HISTORIOGRAPHIA]
    tools_used: [yok_search, yok_get_full_profile, yok_get_collaborators, yok_get_publications]
    role: >-
      DESTEKLEYİCİ — modern tıp tarihçilerinin profili, ekol ve eş-yazar ağı
      (çağdaş prosopografi). Tarihsel şahsiyet için DEĞİL, alanın bugünkü haritası için.
    degrade: "Bağlam yoksa `skipped: mod için N/A` meşrudur."

  # ── G. Web katmanı — ÜÇÜNCÜL, kaynak eleştirisine tabi ────────────────────
  - name: exa
    url: https://mcp.exa.ai/mcp
    tier: web
    auth_env: null
    shard: S7
    modes: [SOURCE_HUNT, INSTITUTIO, PROSOPOGRAPHIA]
    tools_used: [web_search_exa, web_fetch_exa]
    role: >-
      ÜÇÜNCÜL — müze/kütüphane koleksiyon sayfaları, dijital sergiler, kurum
      tarihçeleri, ansiklopedi maddeleri. Kanıt hiyerarşisinde EN ALT basamak;
      akademik bir iddianın TEK dayanağı olamaz (bkz. shared/quellenkritik-contract.md).
    degrade: "Bağlı değilse üçüncül keşif kapanır; birincil/ikincil bantlar etkilenmez."

  - name: tavily
    url: https://mcp.tavily.com/mcp
    tier: web
    auth_env: TAVILY_API_KEY
    shard: S7
    modes: [SOURCE_HUNT, INSTITUTIO]
    tools_used: [tavily_search, tavily_extract, tavily_crawl]
    role: >-
      ÜÇÜNCÜL geniş web tarama + koleksiyon sitesi crawl — bir arşivin çevrimiçi
      envanterini haritalamak için. exa ile aynı kanıt kısıtına tabidir.
    degrade: "Anahtar yoksa `skipped: anahtar yok`; üçüncül katman exa ile taşınır."

  # ── H. Bağlam-ekonomisi substratı ─────────────────────────────────────────
  - name: anamnesis
    url: https://anamnesis-mcp.cureonics.workers.dev/mcp
    tier: substrate
    auth_env: ANAMNESIS_MCP_API_KEY
    shard: S8
    modes: [ALL]
    tools_used:
      - ingest_document
      - semantic_search
      - hybrid_query
      - upsert_triples
      - graph_neighbors
      - subgraph
      - corpus_stats
    role: >-
      Bir KAYNAK DEĞİL, bağlam-ekonomisi altyapısı. Büyük tam-metin (monograf,
      tez PDF, IIIF manifest-içi blok, Hansard zabıt serisi) ana pencerede akıl
      yürütülmez: kanonik doc_id ile BİR KEZ ingest edilir → sınırlı, provenance
      damgalı dilim çekilir. `upsert_triples` hekim↔kurum↔yayın↔olay grafiği kurar
      (PROSOPOGRAPHIA ve CONCEPTUS'un aktarım-zinciri analizi).
    degrade: >-
      Anahtar yoksa sınırlı-parça getirime düşer (manifest-içi arama + sayfa-bazlı
      okuma); ASLA ham tam-metin dökümü yapılmaz.

