delegations:
  - name: vekayinuvis
    plugin_id_prefix: "vekayinuvis@"
    trigger: >-
      Osmanlıca EL YAZMASI paleografi/HTR, BOA/BCA belge satın-alma ve 300 DPI
      arşiv-öncelikli okuma, ebced/kronogram çözümü, fon/kutu/gömlek düzeyinde
      kapsamlı süpürme (devarsiv_deep_search)
    manifest_row: "vekayinuvis (Osmanlıca arşiv-zanaatı delegasyonu)"
    degrade: >-
      Kurulu değilse Osmanlıca el yazması TRANSKRİPSİYONU YAPILMAZ; katalog künyesi
      düzeyinde kalınır ve kullanıcıya vekayinuvis kurulum önerisi verilir. Metin
      ASLA uydurulmaz.
  - name: evidentia
    plugin_id_prefix: "evidentia@"
    trigger: >-
      Tarihsel bir tedavinin GÜNCEL klinik etkililiği/güvenliği sorulduğunda
      (ör. "artemisinin bugün ne kadar etkili") — yani soru tarihten kanıta kaydığında
    manifest_row: "evidentia (klinik kanıt delegasyonu)"
    degrade: "Kurulu değilse çağdaş klinik iddia UNVERIFIED bırakılır; uydurulmaz."
  - name: sci-audit
    plugin_id_prefix: "sci-audit@"
    trigger: "her RELATIO (akademik rapor) çıktısı — atıf-adli + dil denetimi"
    manifest_row: "sci-audit (çıktı-QA delegasyonu)"
    degrade: >-
      Kurulu değilse atıf doğrulaması ve Türkçe bilimsel dil taraması yapılmaz;
      çıktıda 'bağımsız QA uygulanmadı' olarak beyan edilir.

mcp_comment: >-
  Beş bant: akademik çekirdek (her sorguda) · birincil kaynak/IIIF · tam-metin şelalesi
  (lisanslı → son çare) · tarihsel yasama · terminoloji/epidemiyoloji, artı Türkiye kolu,
  üçüncül web ve anamnesis substratı. Web bandı kanıt hiyerarşisinin EN ALTIDIR ve tek
  başına akademik iddia taşıyamaz.
