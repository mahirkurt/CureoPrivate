# lex-sanitas MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json
#   .codex-plugin/plugin.json  (mcpServers bloğu + version)
#   fleet.lock.json            (hook'ların okuduğu stdlib-türev)
#   commands/lex-connectors.md (⟨GEN⟩ anahtar tablosu)
#   agents/*.md                (⟨GEN⟩ tools: satırı)
#   skills/lex-sanitas/references/00-mod-pipelines.md (⟨GEN⟩ mod×server matrisi)
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all`
# Canlı sağlık:     `python3 hooks/scripts/fleet_probe.py --fresh`
#
# NEDEN VAR: 2026-08-02'de TİTCK kapılandı (Worker cache emekli, önbellek sunucuya
# taşındı). lex-sanitas onu "public" saymaya devam etti; katman her çağrıda 401
# aldı ve arıza DÖRT ayrı yerde birden saklandı (.mcp.json header'sız + _role
# "gate yok" + hook GATED sözlüğünde yok + /lex-connectors tablosu "public").
# Filo tek yerden türetilmedikçe bu sınıf arıza kaçınılmazdır.

version: 2
plugin: lex-sanitas
plugin_version: "3.5.5"

# Düzyazıdaki "N MCP / N companion" iddialarını gerçek sayıyla karşılaştır.
# lex-sanitas bu sayıları G0 kapı ölçütü olarak kullandığı için açık.
prose_count_check: true

# ─────────────────────────────────────────────────────────────────────────────
# WIRE EDİLEN SUNUCULAR (.mcp.json'a girer)
#
# tier   : primary | secondary | comparative | support | doctrine | fulltext | substrate
# shard  : S1 TR-çekirdek · S2 karşılaştırmalı · S3 doktrin · S4 tam-metin · ALL (her shard'a girer)
# modes  : [ALL] veya modların alt kümesi
# gate   : bağlı olduğu kalite kapısı (G5/G6/G7) veya null
# ─────────────────────────────────────────────────────────────────────────────
servers:

  # ── S1 · TR çekirdek ───────────────────────────────────────────────────────
  - name: mevzuat
    url: https://mevzuat.cureonics.com/mcp
    tier: primary
    auth_env: MEVZUAT_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [search_mevzuat, get_mevzuat_madde_tree, get_mevzuat_madde_diff,
                 get_mevzuat_timeline, get_mevzuat_relations, get_mevzuat_gerekce,
                 get_anayasa, get_onceki_metinler, search_mulga_mevzuat,
                 search_mevzuat_fihristi, build_mevzuat_semantic_context,
                 resolve_resmi_gazete, get_mevzuat_text, download_mevzuat_document]
    role: >-
      PRİMER TR mevzuat — in-house HP self-host (v0.14.x, SQLite/FTS5 cache).
      Yapısal yasama-grafı: get_mevzuat_madde_tree/madde_diff (as_of tarihli) +
      get_mevzuat_timeline + ilga_zinciri/get_mevzuat_relations (NLP dayanak/atıf
      kenarları) + get_mevzuat_gerekce (LOCATOR) + semantik-bağlam recall-boost.
      Tüm modların TR-mevzuat omurgası. Arama KEYWORD tabanlı ('katma değer
      vergisi', '3065' DEĞİL).
    degrade: >-
      Anahtar yoksa TR-mevzuat omurgası düşer; mevzuat-bilgisi ikincil korpusuna
      degrade + manifestoda 'skipped: anahtar yok'. Üst-norm zinciri kurulamazsa
      G2 CONDITIONAL.

  - name: mevzuat-bilgisi
    url: https://mevzuat.surucu.dev/mcp
    tier: secondary
    auth_env: null
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [search_kanun, search_mevzuat, get_mevzuat_content,
                 search_within_mevzuat, get_mevzuat_gerekce, get_mevzuat_madde_tree]
    role: >-
      İKİNCİL TR-mevzuat çapraz-kontrol aynası (surucu.dev topluluk) — her sorguda
      çalıştırılır. Primer'de OLMAYAN iki yetenek: (a) kanun-NUMARASI lookup
      (search_kanun/search_mevzuat + mevzuat_no), (b) bedesten.adalet.gov.tr ikinci
      korpus + Solr operatörleri. Sentez otoritesi primer Mevzuat'tadır; çatışmada
      primer kazanır, ancak bu server da ateşlenir ve sonucu manifestoya girer
      (çapraz-doğrulama).
    degrade: >-
      Erişilemezse kanun-numarası lookup ve ikinci korpus çapraz-kontrolü yapılamaz;
      manifestoda 'degraded' — primer tek başına sentezi taşır, çapraz-doğrulama
      notu düşülür.

  - name: resmi-gazete
    url: https://resmi-gazete-mcp.cureonics.workers.dev/mcp
    tier: primary
    auth_env: RESMI_GAZETE_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [rg_search, rg_get_item, rg_resolve_date, rg_get_issue_toc,
                 rg_list_recent, rg_ocr_submit, rg_ocr_result]
    role: >-
      T.C. Resmî Gazete resmi yayın metni + tarih/sayı çözümleme
      (rg_search/rg_get_item/rg_resolve_date + OCR). Yürürlük tarihi, RG
      sayı/mükerrer teyidi (Mevzuat resolve_resmi_gazete tamamlayıcısı).
      DRAFT/AMEND yürürlük hükmü + EX_POST kronoloji.
    degrade: >-
      Erişilemezse yürürlük tarihi/RG sayısı yalnız mevzuat resolve_resmi_gazete'ye
      dayanır; teyit edilemeyen RG referansı 'mcp_verified:false' etiketlenir,
      uydurulmaz.

  - name: titck
    url: https://titck.cureonics.com/mcp
    tier: primary
    auth_env: TITCK_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [search_titck_guidelines, search_drugs, get_drug,
                 get_atc_hierarchy, search_medical_devices]
    role: >-
      TİTCK ilaç/tıbbi cihaz master index (barkod-primer + WHO-ATC + SNOMED).
      TİTCK yönetmelik/SUT/ruhsat reformlarında mevcut-durum + rehber envanteri
      (search_titck_guidelines, search_drugs, get_atc_hierarchy). 2026-08-02'den
      beri KAPILI — Bearer zorunlu (eski açık Worker cache emekli edildi,
      önbellek sunucunun içine taşındı).
    degrade: >-
      Anahtar yoksa ilaç/cihaz regülasyon mevcut-durum katmanı tamamen düşer;
      manifestoda 'skipped: anahtar yok'. 401 alınıyorsa bu DEGRADE DEĞİL
      yapılandırma arızasıdır — preflight ayrıca uyarır.

  - name: tbmm
    url: https://tbmm.cureonics.com/mcp
    tier: primary
    auth_env: TBMM_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [tbmm_search_kanun_teklifi, tbmm_get_kanun_teklifi,
                 tbmm_search_komisyon_raporu, tbmm_get_komisyon_raporu,
                 tbmm_search_acik_erisim, tbmm_get_acik_erisim_document]
    role: >-
      TBMM yasama tarihçesi — Mod 8 TBMM_KANUN_TEKLIFI omurgası. Kanun
      teklifi/komisyon raporu/gerekçe dossier (tbmm_get_kanun_teklifi,
      search_acik_erisim DSpace). Modern SPA araçları manual_required deep-link
      (uydurma yok).
    degrade: >-
      Erişilemezse Mod 8'in yasama-tarihçesi dayanağı düşer; teklif/rapor
      referansları 'manual_required' (TBMM portal deep-link) yazılır. G8 en fazla
      CONDITIONAL.

  - name: saglikbakanligi
    url: https://saglik-mcp.cureonics.com/mcp
    tier: primary
    auth_env: SAGLIK_BAKANLIGI_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [sb_search, sb_get_document, sb_list_kilavuzlar,
                 sb_list_kurul_kararlari, sb_resolve_genelge, sb_list_belgeler]
    role: >-
      T.C. Sağlık Bakanlığı ikincil mevzuat / soft-law (genelge·yönerge·rehber·
      kurul kararı·SKS) — Resmî Gazete/mevzuat.gov.tr'de OLMAYAN idari norm
      katmanı (9 sb_* aracı). Tebliğ/genelge düzeyi reformda mevcut-durum.
      Taslak/YSŞ → manual_required.
    degrade: >-
      Erişilemezse idari norm katmanı (genelge/yönerge/rehber) görünmez olur;
      manifestoda 'skipped: anahtar yok'. Bu katmanın yokluğu ilgili normun
      YOKLUĞU anlamına GELMEZ — çıktıda kapsam boşluğu olarak beyan edilir.

  - name: detsis
    url: https://detsis.cureonics.com/mcp
    tier: support
    auth_env: DETSIS_MCP_API_KEY
    shard: S1
    modes: [ALL]
    gate: null
    tools_used: [detsis_resolve_birim, detsis_get_kunye, detsis_list_alt_birimler,
                 detsis_search_birim, detsis_get_mevzuatlar]
    role: >-
      DETSİS devlet-teşkilatı registry — kurumsal atıf doğruluğu
      (Bakanlık/Genel Müdürlük/Kurum resmî ad + DETSİS no + hiyerarşi). DRAFT
      metninde 'görev/yetki' hükümleri ve gerekçede kurum adlandırması için.
      Yokluk kesin kanıt değil (caveat).
    degrade: >-
      Erişilemezse kurum adları mevzuat metninden alınır ve 'mcp_verified:false'
      etiketlenir; resmî ad/DETSİS no teyidi yapılamaz.

  # ── S2 · Karşılaştırmalı / uluslararası ────────────────────────────────────
  - name: health-policy
    url: https://health-policy-mcp.cureonics.workers.dev/mcp
    tier: comparative
    auth_env: HEALTH_POLICY_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: null
    tools_used: [semantic_search, legal_distill_start, legal_distill_result,
                 federal_register_search, ecfr_get, japan_elaws_fetch,
                 australia_legislation_fetch, canada_justicelaws_fetch,
                 spain_boe_fetch, mexico_dof_nota, china_law_detail,
                 ireland_eisb_fetch]
    role: >-
      YABANCI ÜLKE sağlık mevzuatı resmî-metin portalları: US (eCFR T21/FedReg/
      GovInfo/Congress), CA JusticeLaws, JP e-LAWS, AU FRL, ES BOE, IE eISB,
      CN NPC, MX DOF. Mod 7 COMPARATIVE_LAW birincil kaynağı. DOĞAL-DİL GİRİŞ
      KAPISI: semantic_search (çok-dilli Workers AI planner + bge-m3 rerank;
      aranabilir US/JP/AU/CN fan-out, ID-only ES/MX/CA/IE excluded→fetch;
      mcp_verified:false keşif katmanı, fetch=doğrulama). Sınırlar: DE→german-law;
      UK+EU→Open Law; TR→mevzuat/titck; CH/FR/IT/NL/SE + 58-yargı→Ansvar.
    degrade: >-
      Erişilemezse Mod 7'nin yabancı birincil-metin katmanı düşer; ilgili ülke
      satırları 'manual_required' (resmî portal deep-link) + kapsam boşluğu beyanı.

  - name: german-law
    url: https://german-law.cureonics.com/mcp
    tier: comparative
    auth_env: GERMAN_LAW_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: G6
    tools_used: [search_legislation, get_provision, get_eu_basis,
                 validate_eu_compliance, get_german_implementations,
                 parse_citation, format_citation]
    role: >-
      Almanya/AB hukuku (statute + case-law + preparatory + EU basis +
      version-tracking). Mod 7 için DE emsali + AB müktesebatı köprüsü
      (get_eu_basis/validate_eu_compliance). Free-tier: 8 statute aracı işlevsel,
      diğerleri honest 'not available' (uydurma yok).
    degrade: >-
      Erişilemezse DE emsali ve CELEX degrade-yolu (Open Law yoksa ikinci basamak)
      kaybolur → G6 CONDITIONAL, CELEX doğrulaması WebFetch'e iner.

  - name: ich-guidelines
    url: https://ich.cureonics.com/mcp
    tier: comparative
    auth_env: ICH_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: G6
    tools_used: [ich_list_guidelines, ich_get_guideline, ich_search,
                 ich_guideline_history]
    role: >-
      ICH Q/S/E/M harmonizasyon rehberleri — norm-düzeyi benchmark
      (ich_list_guidelines/ich_get_guideline/ich_search). İlaç ruhsat/kalite/GVP
      reformunda uluslararası harmonizasyon referansı (DRAFT/AMEND/COMPARATIVE).
      Kapsam: yalnız norm-metni (eCTD dosya formatı OUT).
    degrade: >-
      Erişilemezse ICH referansları 'manual_required' (ich.org deep-link);
      G6'nın harmonizasyon ayağı doğrulanamaz → CONDITIONAL.

  - name: intl-treaty
    url: https://intl-treaty-mcp.cureonics.workers.dev/mcp
    tier: comparative
    auth_env: INTL_TREATY_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: G6
    tools_used: [treaty_status, treaty_reservations, coe_treaty_signatories,
                 intl_treaty_info]
    role: >-
      Uluslararası insan-hakları/sağlık antlaşmaları norm-düzeyi — Anayasa Md.90/5
      doğrulaması (usulüne uygun andlaşma = kanun hükmü). ICESCR Md.12 + Oviedo
      CETS 164 + MEDICRIME 211 katılım/çekince (treaty_status/treaty_reservations/
      coe_treaty_signatories). Her çıktı mcp_verified:false + caveat.
    degrade: >-
      Erişilemezse Md.90/5 üst-norm ayağı doğrulanamaz; antlaşma referansları
      'manual_required' (UNTC/CoE deep-link). G2 ve G6 CONDITIONAL.

  - name: eudamed
    url: https://eudamed-mcp.cureonics.workers.dev/mcp
    tier: comparative
    auth_env: EUDAMED_MCP_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: null
    tools_used: [eudamed_search_devices, eudamed_get_device,
                 eudamed_search_actors, eudamed_probe]
    role: >-
      EUDAMED AB tıbbi cihaz DB (MDR/IVDR). Tıbbi cihaz reformunda AB benchmark +
      cihaz/aktör kayıt yapısı. Zorunlu olgunluk _caveat (veri tabanı kademeli
      dolum — yokluk kanıt değildir).
    degrade: >-
      Erişilemezse AB cihaz kayıt yapısı benchmark'ı düşer; ilgili satır
      'manual_required' (EUDAMED portal deep-link).

  - name: oecd
    url: https://oecd.cureonics.com/mcp
    tier: support
    auth_env: OECD_MCP_API_KEY
    shard: S2
    modes: [ALL]
    gate: null
    tools_used: [search_dataflows, search_indicators, query_data,
                 get_data_structure, get_popular_datasets]
    role: >-
      OECD ekonomik/istatistik verisi (SDMX). Mod 6 RIA/DEA nicel girdi (sağlık
      harcaması, ilaç fiyat endeksi, karşılaştırmalı gösterge) + Better Regulation
      benchmark. 9 salt-okunur araç; authless upstream.
    degrade: >-
      Erişilemezse DEA/BEF nicel girdileri kaynaksız kalır; sayısal iddia
      üretilmez — 'veri boşluğu' olarak beyan edilir, tahmin YAZILMAZ.

  # ── S3 · Doktrin ───────────────────────────────────────────────────────────
  - name: yok-akademik
    url: https://yok-akademik.cureonics.com/mcp
    tier: doctrine
    auth_env: YOK_AKADEMIK_MCP_API_KEY
    shard: S3
    modes: [ALL]
    gate: G5
    tools_used: [yok_search, yok_get_profile, yok_get_publications,
                 yok_get_supervised_theses, yok_search_academics]
    role: >-
      YÖK Akademik — hukuk/tıp DOKTRİN sinyali (Mod ANALYZE/gerekçe akademik
      dayanak). Reform gerekçesinde uzman görüşü/literatür bağlamı. Salt-okuma
      scraping. METADATA katmanıdır — tam metin için literatur (DergiPark) ve
      yoktez (YÖK Tez).
    degrade: >-
      Erişilemezse doktrin sinyali literatur + yoktez'e daralır; akademisyen
      profili/yayın listesi teyidi yapılamaz.

  - name: yoktez
    url: https://yoktezmcp.fastmcp.app/mcp
    tier: doctrine
    auth_env: null
    shard: S3
    modes: [ALL]
    gate: G7
    tools_used: [search_yok_tez_detailed, get_yok_tez_thesis_details,
                 get_yok_tez_document_markdown, search_yok_tez_by_anabilim_dali]
    role: >-
      YÖK Ulusal Tez Merkezi tam-metin — tez-düzeyi Türk hukuk/tıp doktrini
      (gerekçe akademik dayanağı, ANALYZE doktrin taraması) + G7 YÖK-Tez ATIF
      DOĞRULAMASI (tez no/başlık/yazar teyidi → uydurma tez atfı deterministik
      yakalanır). yok-akademik profil-metadata'sının tam-metin tamamlayıcısı.
      Authless (FastMCP remote). v3.5.0'da companion'dan first-class'a terfi etti.
    degrade: >-
      Erişilemezse tez-doktrin yok-akademik metadata'sına degrade eder ve G7'deki
      YÖK-Tez atıf doğrulaması yapılamaz → bu tip atıflar
      'illustrative_placeholder_not_verified' etiketlenir, KULLANILMAZ.

  - name: literatur
    url: https://literatur-mcp.surucu.dev/mcp
    tier: doctrine
    auth_env: null
    shard: S3
    modes: [ALL]
    gate: G5
    tools_used: [search_articles, pdf_to_html, get_article_references]
    role: >-
      DergiPark Türk akademik dergi makaleleri — arama (yıl/tür/dizin/sıralama) +
      PDF→HTML TAM METİN + referans çekme. Doktrin katmanının tek OKUNABİLİR TR
      kaynağı: yok-akademik yalnız metadata verir, bu tam metin verir. Gerekçe
      akademik dayanağı + ANALYZE doktrin taraması. Authless (surucu.dev).
    degrade: >-
      Erişilemezse doktrin katmanı metadata-only'ye (yok-akademik) düşer;
      gerekçede doktrin atfı yapılabilir ama içerik alıntılanamaz → manifestoda
      'degraded: tam metin yok'.

  # ── S4 · Tam-metin şelalesi ────────────────────────────────────────────────
  - name: openathens
    url: https://openathens.cureonics.com/mcp
    tier: fulltext
    auth_env: OPENATHENS_MCP_API_KEY
    shard: S4
    modes: [COMPARATIVE_LAW, ANALYZE, RIA, OPINE, EX_POST_EVALUATION]
    gate: G6
    tools_used: [oa_session_status, oa_resolve, oa_fetch_fulltext,
                 oa_list_databases, oa_verify_access]
    role: >-
      LİSANSLI kurumsal tam-metin kapısı (Tier 3) — Millet Kütüphanesi/OpenAthens
      SAML üzerinden 309 lisanslı veritabanı. Yabancı hukuk doktrini (monograf,
      hakemli makale) için paywall'lı kaynaklara YASAL erişim. Mod 7 karşılaştırmalı
      analizin ve G6 uluslararası kaynak teyidinin doktrin desteği — birincil norm
      metni DEĞİL (o health-policy/german-law/Open Law'dadır).
    degrade: >-
      Oturum düşük/anahtar yoksa manifestoda 'degraded: lisanslı band kapalı'.
      ŞELALE DİSİPLİNİ: openathens'in yokluğu annas-reader'ı OTOMATİK AÇMAZ — son
      çare yalnız openathens denendikten sonra ve açık gerekçeyle kullanılır.

  - name: annas-reader
    url: https://annas.cureonics.com/mcp
    tier: fulltext
    auth_env: ANNAS_MCP_API_KEY
    shard: S4
    modes: [COMPARATIVE_LAW, ANALYZE]
    gate: G6
    tools_used: [book_search, article_search, get_document_info, read_document,
                 search_in_document]
    role: >-
      SON-ÇARE tam-metin (Tier 4, efemer-RAG reader) — lisanslı band (openathens
      Tier 3) getiremeyince. Out-of-print hukuk monografı, erişilemeyen yabancı
      doktrin. YALNIZ ANALİZ İÇİN: getirilen tam metin yeniden yayımlanmaz, çıktıya
      gövde olarak kopyalanmaz; yalnız atıf + damıtılmış bulgu üretir.
    degrade: >-
      Erişilemezse ilgili doktrin satırı 'manual_required' (kaynak künyesi + erişim
      yolu) yazılır — asla uydurma içerik.

  # ── Substrat (her shard'a girer) ───────────────────────────────────────────
  - name: anamnesis
    url: https://anamnesis-mcp.cureonics.workers.dev/mcp
    tier: substrate
    auth_env: ANAMNESIS_MCP_API_KEY
    shard: ALL
    modes: [ALL]
    gate: null
    tools_used: [ingest_document, semantic_search, hybrid_query, upsert_triples,
                 graph_neighbors, subgraph, corpus_stats]
    role: >-
      BÜYÜK-VERİ RAG/GraphRAG substratı (evidence_index) — bir KAYNAK DEĞİL,
      bağlam-ekonomisi altyapısı. Büyük hukuk metni (tam kanun/yönetmelik, madde
      ağacı, RG OCR, yabancı statute/CELEX konsolide, tam gerekçe) ana bağlamda
      AKIL YÜRÜTÜLMEZ; ingest_document(doc_id=<kanonik id: mevzuat_no/CELEX/ECLI>)
      ile BİR KEZ indekslenir → semantic_search/hybrid_query(queries[]) ile sınırlı,
      provenance-damgalı, graph-temelli dilim çekilir. Aynı doc_id iki kez ingest
      edilmez (kanonik cache). upsert_triples/graph_neighbors/subgraph =
      madde↔dayanak↔ilga ilişki grafiği. shared/context-economy-contract.md Tier 2.
    degrade: >-
      Anahtar yoksa doğrudan bounded-chunk fetch'e degrade (madde_tree navigasyonu
      + max_chars/chunk_index) — asla ham tam-metin dökümü.

# ─────────────────────────────────────────────────────────────────────────────
# COMPANION — wire EDİLEMEZ dış connector'lar (claude.ai connector ayarlarından
# bağlanır). Kararlı self-host URL'leri yoktur. Bağlıyken tetiklenmiş bağlamda
# atlanmaları G0 ihlalidir; manifesto satırları HER çıktıda zorunludur.
# ─────────────────────────────────────────────────────────────────────────────
companions:
  - name: Yargı
    tool_prefixes: ["mcp__Yarg__", "mcp__claude_ai_Yarg__"]
    gate: G5
    modes: [ALL]
    manifest_row: "Yargı (companion — G5 içtihat)"
    degrade: >-
      G5 en fazla CONDITIONAL — AYM belirlilik/iptal emsali, Danıştay idari-işlem
      ve Yargıtay zinciri doğrulanamaz.

  - name: Open Law
