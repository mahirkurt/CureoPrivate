# =============================================================================
# Lex-Sanitas Source Registry (v1.0 — introduced in skill v2.6.0)
# =============================================================================
# Lex-sanitas'ın atıf yaptığı/araştırdığı kaynakların kanonik envanteri.
# Amaç: (a) evidence_ledger entry'lerindeki source.registry_id'ye kararlı bağ
# sağlamak; (b) G5/G6/G7 kapılarının hangi kaynak katmanından beslendiğini
# makine-okunur kılmak; (c) programmatic_source_healthcheck.yaml ile
# erişilebilirlik izlemeyi mümkün kılmak.
#
# Katmanlar (tier):
#   constitution | primary_legislation | case_law | international_acquis |
#   international_guidance | comparative_jurisdiction | mcp_server |
#   scientific_connector | hta_body
#
# Doğrulama (verification): mevzuat_mcp | mevzuat_bilgisi_mcp | yargi_mcp |
#   yoktez_mcp | titck_mcp | health_policy_mcp | german_law_mcp |
#   fedlex_swiss_companion | open_primary_source | medical_research_connector |
#   manual
#
# EMEKLİ (v1.1, 2026-08-07): `lex_sanitas_mcp`. Sarmalayıcı Worker
# 2026-06-29'da `health-policy-mcp` adına taşındı ve kapsamı daraltıldı;
# eski uç (lex-sanitas-mcp.cureonics.workers.dev) 2026-08-07 probe'unda
# **404** döndü — ÖLÜ. Bu enum değeri hiçbir satırda kullanılmamalıdır;
# tools/fleetkit/check_drift.py artık bunu CI'da yakalar.
# =============================================================================

registry_version: "1.1"
introduced_in_skill_version: "2.6.0"
generated_at: "2026-08-07T00:00:00Z"
maintainer_note: >
  Bu envanter REFORM ekseni içindir. Bireysel hak-arama (AYM bireysel başvuru,
  bireysel SGK red savunması), TİTCK dava dilekçesi ve promosyonel materyal
  denetimi kapsam-dışıdır (Scope Guard). İçtihat kaynakları reform-GEREKÇE
  sinyali olarak kullanılır, dava dilekçesi üretimi için DEĞİL.

