      upgradeRequired; `get_provision_history` + `diff_provision` +
      `get_recent_changes` premium:false). Şema "Requires professional tier"
      der ama AB araçları free korpusta ÇALIŞIR. `get_provision` yalnız
      `{id:'jurabk:n'}` biçimiyle çalışır (`{law, article}` çıplak null).
      `validate_citation` AMG'yi doğrulayamaz — tools_used dışı.
