mcp_server:
  - id: mcp.mevzuat
    name: "Mevzuat MCP"
    role: "Türk mevzuat metni doğrulama (DRAFT/ANALYZE)"
    verification: mevzuat_mcp
  - id: mcp.yargi
    name: "Hukuki Veritabanları / Yargı MCP"
    role: "AYM/Danıştay/Yargıtay içtihat doğrulama (G5)"
    verification: yargi_mcp
  - id: mcp.yoktez
    name: "YokTez MCP"
    role: "Akademik tez/doktrin taraması (G5)"
    verification: yoktez_mcp
  - id: mcp.titck
    name: "TİTCK MCP"
    role: "Ürün/ruhsat/ÜTS verisi (ANALYZE §13.f)"
    verification: titck_mcp
  - id: mcp.mevzuat_bilgisi
    name: "Mevzuat Bilgisi MCP (bedesten.adalet.gov.tr + mevzuat.gov.tr)"
    role: >
      Katman-1 YEDEĞİ (v1.1, 2026-08-07 eklendi). `mcp.mevzuat` birincil sunucusu
      düştüğünde (upstream TLS/erişim arızası, origin timeout) aynı Türk mevzuat
      sorgusunu BAĞIMSIZ bir uygulama ve BAĞIMSIZ bir upstream (bedesten REST)
      üzerinden yanıtlar. 2026-08-06 denetiminde birincil düşükken 5210 sayılı
      Yönetmeliği doğru döndürdüğü fiilen ölçüldü.
    access: { url: "https://mevzuat.surucu.dev/mcp", mcp_server: mevzuat-bilgisi }
    verification: mevzuat_bilgisi_mcp
    note: >
      YEDEK, EŞDEĞER DEĞİL. Farklılıklar zorunlu olarak beyan edilir:
      (a) bedesten `search_mevzuat` kanun NUMARASIYLA arayabilir, mevzuat.gov.tr
      araçları KELİME tabanlıdır ("katma değer vergisi", "3065" değil);
      (b) bedesten AND/OR/NOT DESTEKLEMEZ → `+terim1 +terim2` kullanılır;
      (c) `resolve_resmi_gazete` KARŞILIĞI YOKTUR — RG çapa çözümlemesi yalnız
      birincil `mcp.mevzuat`tadır, yedek bu boşluğu KAPATMAZ.
      Yedekten gelen her atıf `source: mevzuat_bilgisi_mcp (fallback)` etiketi ve
      birincil doğrulama açığı notu taşır; birincil ayağa kalkınca çapraz-doğrulanır.

  - id: mcp.health_policy
    name: "Health Policy MCP (Cloudflare Worker connector)"
    role: >
      Programatik Katman-2 sarmalayıcı — Türkiye-DIŞI ve Ansvar-KAPSAMADIĞI
      sağlık mevzuatı metni: ABD (eCFR / Federal Register / GovInfo / Congress),
      Kanada Justice Laws, Japonya e-LAWS, Avustralya FRL, İspanya BOE,
      İrlanda eISB, Çin NPC, Meksika DOF (CN/MX best-effort) + `semantic_search`
      (çok-dilli) + `legal_distill_start`/`_result` (sunucu-tarafı distilasyon).
    access: { url: "https://health-policy-mcp.cureonics.workers.dev/mcp", mcp_server: health-policy }
    verification: health_policy_mcp
    note: >
      v1.1 (2026-08-07) — BU KAYIT `mcp.lex_sanitas` KAYDININ YERİNİ ALIR.
      Sarmalayıcı 2026-06-29'da `lex-sanitas-mcp` → `health-policy-mcp` olarak
      yeniden adlandırıldı VE kapsamı daraltıldı. Eski uç
      (lex-sanitas-mcp.cureonics.workers.dev) 2026-08-07 probe'unda **HTTP 404**
      döndü — ÖLÜ; yeni uç aynı probe'da 401 (auth kapısı, canlı) döndü.
      SINIRLAR (rescope'ta bu araçlar KALDIRILDI, artık burada aranmaz):
      AB CELLAR/EUR-Lex → wire'lı `eurlex` (G6); UK legislation → `uk-legal` +
      Open Law companion + `ep.legislation_uk`; Almanya → `german-law` (wire'lı);
      İsviçre Fedlex → wire'lı `fedlex`; CH/FR/IT/NL/SE/DK/FI/AT/PL tarama →
      `Ansvar` companion; Türkiye → `mevzuat`/`titck`;
      EuroVoc + data.europa.eu → SARMALANMADI (web-birincil);
      WHO GHO / openFDA / Health Canada DPD → klinik konnektörler.

