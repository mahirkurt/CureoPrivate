    wrapped: "search_legislation / get_provision / get_provision_history / validate_citation (wire'lı, :8307)"
    verification: german_law_mcp
    note: >
      v1.1: Almanya health-policy rescope'unda (2026-06-29) DÜŞÜRÜLDÜ (DE →
      german-law-mcp). Eski `germany_law_search/_get` (NeuRIS beta) araçları
