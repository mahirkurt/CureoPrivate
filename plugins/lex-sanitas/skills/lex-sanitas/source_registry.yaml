    name: "İsviçre — Fedlex (Classified Compilation RS/SR)"
    access: { url: "https://www.fedlex.admin.ch/", mcp_server: fedlex }
    wrapped: "WIRE'LI — mcp__fedlex__* (fedlex_get_law_by_sr params.sr_number, fedlex_search_laws keywords)"
    verification: fedlex_mcp
    note: >
      v3.8.0 (2026-08-08) — Fedlex Swiss companion'dan WIRE'A terfi etti
      (`fedlex.cureonics.com`, OAuth kapısı). CH birincil metin artık
      kullanıcının connector bağlamasına bağlı değildir. Argümanlar `params`
