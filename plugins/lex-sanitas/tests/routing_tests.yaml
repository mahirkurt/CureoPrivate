suite:
  id: routing
  title: "Mod Sınıflandırma ve medical-research Tetikleme Yönlendirme Testleri"
  version: "1.0"
  target_skill: lex-sanitas
  target_version: ">= 2.6.0"
  evaluator: [manual, smp-orchestrator, skill-censor]
  description: >
    Her kullanıcı isteminin doğru lex-sanitas moduna sınıflandırıldığını ve
    R14 §1.2 tetikleme tablosuna göre medical-research'ün doğru zorunluluk
    seviyesinde (mandatory/conditional/none) çağrıldığını doğrular. Kapsam-dışı
    yönlendirme scope_boundary_tests.yaml'da; Mod 9 derinliği
    mod9_medical_research_tests.yaml'da test edilir.

cases:
  - id: ROUTE-001
    title: "DRAFT — klinik konulu yeni yönetmelik taslağı"
    given: "Hücre ve gen tedavisi ürünleri (ATMP) için yeni bir TİTCK ruhsatlandırma yönetmeliği taslağı hazırla."
    expect:
      mode: DRAFT
      routed_to: lex-sanitas
      medical_research: mandatory
      gates: { G1: PASS, G2: PASS, G3: PASS, G4: PASS }
    assertions:
      - "Mod DRAFT olarak sınıflanmalı (yeni mevzuat üretimi — CORE amaç)."
      - "Klinik/ATMP konusu olduğundan medical-research zorunlu çağrılmalı (R14 §1.2 DRAFT satırı)."
      - "5210 Yönetmelik şekli (G1) + maddi-anayasal (G2) uyum protokol içinde uygulanmalı."
    rationale: "SKILL.md Bölüm 6 (DRAFT) + R14 §1.2 — klinik konu sinyali (ATMP) medical-research'ü tetikler."

  - id: ROUTE-002
    title: "AMEND — bilimsel zemin değişen mevcut mevzuat"
    given: "Pembrolizumab etiket genişlemesi sonrası ilgili SUT tebliğ maddesini güncelle."
    expect:
      mode: AMEND
      routed_to: lex-sanitas
      medical_research: conditional
    assertions:
      - "Mod AMEND olmalı (mevcut metin değişikliği)."
      - "Bilimsel zemin değiştiği için (etiket genişlemesi) medical-research ŞARTLI tetiklenmeli."
    rationale: "R14 §1.2 AMEND — 'mevcut mevzuatın bilimsel zemini değişiyorsa' şartlı zorunlu."

  - id: ROUTE-003
    title: "ANALYZE — TİTCK pozisyon/iptal riski analizi (REFORM ekseni)"
    given: "Klinik araştırmalar yönetmeliğinin Anayasa'ya aykırılık ve iptal riskini analiz et."
    expect:
      mode: ANALYZE
      routed_to: lex-sanitas
      medical_research: mandatory
    assertions:
      - "Mod ANALYZE olmalı."
      - "TİTCK/ruhsat-süreç ekseni medical-research'ü §13.f için zorunlu kılar."
      - "Çıktı bir mevzuat-analizi olmalı; bireysel dava savunması ÜRETİLMEMELİ."
    rationale: "R14 §1.2 ANALYZE — TİTCK iptal/değişiklik analizi. Scope Guard: dava dilekçesi değil."

  - id: ROUTE-004
    title: "COMPLY — tanıtım mevzuatı reform metni uyum denetimi"
    given: "Beşeri tıbbi ürünlerin tanıtım faaliyetleri yönetmeliği reform taslağının 5210 ve bilimsel gerekçe uyumunu denetle."
    expect:
      mode: COMPLY
      routed_to: lex-sanitas
      medical_research: conditional
      must_not_produce: ["promosyonel materyal PASS/FAIL denetimi"]
    assertions:
      - "Mod COMPLY olmalı (reform metni uyum denetimi)."
      - "Çıktı MEVZUAT METNİNİN uyumunu denetlemeli; bir promosyonel materyalin PASS/FAIL'ını DEĞİL (→ promo-censor)."
    rationale: "SKILL.md §6 COMPLY (reform metni denetimi) + R14 §1.2; promosyonel materyal denetimi kapsam-dışı."

  - id: ROUTE-005
    title: "OPINE — SUT/HTA geri ödeme POLİTİKASI reformu görüşü"
    given: "SUT geri ödeme kriterlerini reforme eden bir politika için hukuki mütalaa hazırla."
    expect:
      mode: OPINE
      routed_to: lex-sanitas
      medical_research: mandatory
      must_not_produce: ["bireysel SGK ödeme reddi savunması"]
    assertions:
      - "Mod OPINE olmalı."
      - "SUT/HTA/ICER sinyali medical-research'ü §14.f için zorunlu kılar."
      - "Çıktı POLİTİKA reformu görüşü olmalı; bireysel red savunması DEĞİL (→ onko-erisim/saglik-sigorta)."
    rationale: "R14 §1.2 OPINE — SUT/HTA reform görüşü; bireysel hak arama kapsam-dışı (v2.4)."

  - id: ROUTE-006
    title: "RIA — bütçe etki + ICER/QALY analizi"
    given: "Yeni bir biyobenzer geri ödeme modelinin düzenleyici etki analizini (BEF + DEA) çıkar."
    expect:
      mode: RIA
      routed_to: lex-sanitas
      medical_research: mandatory
    assertions:
      - "Mod RIA olmalı."
      - "Bütçe etki / ICER-QALY sinyali medical-research'ü §14.c-d için zorunlu kılar."
    rationale: "R14 §1.2 RIA — BEF/DEA + ICER/QALY."

  - id: ROUTE-007
    title: "COMPARATIVE_LAW — FDA-EMA-TİTCK karşılaştırması"
    given: "ATMP ruhsat mekaniklerini FDA, EMA ve TİTCK arasında karşılaştır."
    expect:
      mode: COMPARATIVE_LAW
      routed_to: lex-sanitas
      medical_research: mandatory
      gates: { G6: PASS }
    assertions:
      - "Mod COMPARATIVE_LAW olmalı."
      - "Regulatory karşılaştırma medical-research'ü §13.a-c için zorunlu kılar."
      - "AB müktesebatı atfı CELEX kodu ile yapılmalı (G6)."
    rationale: "R14 §1.2 COMPARATIVE_LAW + G6 uluslararası kaynak teyidi."

  - id: ROUTE-008
    title: "TBMM_KANUN_TEKLIFI — milletvekili kanun teklifi"
    given: "Hücresel tedavilere erişimi düzenleyen bir kanun teklifi (Anayasa Md. 88) hazırla."
    expect:
      mode: TBMM_KANUN_TEKLIFI
      routed_to: lex-sanitas
      medical_research: mandatory
      gates: { G8: PASS }
    assertions:
      - "Mod TBMM_KANUN_TEKLIFI (Mod 8) olmalı."
      - "Her TBMM teklifi için medical-research ÇİFT zorunlu (genel gerekçenin 4-6. alt başlıkları)."
      - "G8: 5210'un kapsam-dışı olduğu (Md. 1/3) + TBMM İçtüzüğü Md. 74-91 ekseni not edilmeli."
    rationale: "R14 §1.2 TBMM — çift zorunlu; G8 kapsam denetimi (SKILL.md §6.8)."

  - id: ROUTE-009
    title: "EX_POST_EVALUATION — klinik/HTA mevzuatı ex post değerlendirme"
    given: "Klinik araştırmalar yönetmeliğinin 24 aylık uygulama sonrası ex post değerlendirmesini yap."
    expect:
      mode: EX_POST_EVALUATION
      routed_to: lex-sanitas
      medical_research: mandatory
      required_sections: ["§5", "§14.f", "§19"]
      gates: { G9: CONDITIONAL }
    assertions:
      - "Mod EX_POST_EVALUATION (Mod 9) olmalı."
      - "RWE/SGK/MEDULA/SUT etki sinyali medical-research'ü zorunlu kılar (R14 §1.2 EX_POST satırı)."
      - "§6.1 karar ağacı + §9 auto_trigger_modes Mod 9'u içermeli (v2.5.7)."
    rationale: "R14 §1.2/§6.1/§9 + G9 conditional. Derin Mod 9 testleri mod9_medical_research_tests.yaml'da."

  - id: ROUTE-010
    title: "Saf hukuk dili düzeltmesi — medical-research GEREKMEZ"
    given: "Şu yönetmelik maddesinin Türk hukuk dili ve 5210 şekil kurallarına uygunluğunu düzelt (klinik içerik yok): 'İdare, gerekli gördüğü hallerde...'."
    expect:
      mode: AMEND
      routed_to: lex-sanitas
      medical_research: none
      gates: { G3: PASS }
    assertions:
      - "Klinik konu sinyali YOK; medical-research çağrılmamalı (R14 §1.2 — konu klinik değil)."
      - "G3 (hukuk dili) + G1 (şekil) protokol içinde uygulanmalı."
    rationale: "R14 §1.3 karar ağacı — 'Konu klinik mi?' HAYIR → medical-research çağrılmaz."

  # ---- v2.7.0 Layer-B araç yönlendirmesi (COMPARATIVE_LAW) ----
  - id: ROUTE-011
    title: "COMPARATIVE_LAW — Avustralya terapötik ürün mevzuatı"
    given: "Avustralya'daki terapötik ürün düzenlemesini Türk mevzuatıyla karşılaştır."
    expect:
      mode: COMPARATIVE_LAW
      routed_to: lex-sanitas
      gates: { G5: PASS, G7: PASS }
    assertions:
      - "Mod COMPARATIVE_LAW (Mod 7) olmalı."
      - "Avustralya kanunu için australia_legislation_search/_fetch (FRL OData) tercih edilmeli (HTML kazıma değil)."
      - "Türk iç hukuku tarafı Mevzuat MCP'de kalır; connector yalnızca Katman-2."
    rationale: "§5.4.quater A.3 COMPARATIVE_LAW matrisi + programatik erişim önceliği (§5.5/4)."

  - id: ROUTE-012
    title: "COMPARATIVE_LAW — Japonya ilaç kanunu + Kanada Food and Drugs Act"
    given: "Japonya ve Kanada'nın ilaç ruhsatlandırma kanunlarını karşılaştırmalı analiz et."
    expect:
      mode: COMPARATIVE_LAW
      routed_to: lex-sanitas
      gates: { G5: PASS, G7: PASS }
    assertions:
      - "Japonya için japan_elaws_search→japan_elaws_fetch; Kanada için canada_justicelaws_fetch kullanılmalı."
      - "Japonya tam metin 1.5MB → fetch metaveri+URL döndürür; madde metni gerekirse apiUrl çağrılır."
    rationale: "AM-2 (web_primary→rest_api) + bağlam-taşması disiplini (R15 §11)."

  - id: ROUTE-013
    title: "DRAFT/ANALYZE — EuroVoc kavram eşleme"
    given: "İleri tedavi tıbbi ürünü (ATMP) konusunu standart AB EuroVoc kavramına eşle."
    expect:
      mode: ANALYZE
      routed_to: lex-sanitas
      gates: { G7: PASS }
    assertions:
      - "eurovoc_concept_lookup çağrılmalı (lang filtresi zorunlu)."
      - "Kavram URI'si yalnızca connector teyidiyle verified; aksi halde mcp_verified=false."
    rationale: "§5.4.quater A.3 — eurovoc_concept_lookup ∈ DRAFT/ANALYZE/COMPARATIVE_LAW."

  # ---- v2.8.0 retrieval-distiller delegation ----
  - id: ROUTE-014
    title: "Çok-kaynak retrieval distiller'a devredilir (Claude Code), claude.ai'de doğrudan"
    given: "Bir DRAFT/ANALYZE görevinde çok sayıda hukuki + bilimsel kaynaktan kanıt taranması gerekir."
    expect:
      mode: ANALYZE
      routed_to: lex-sanitas
      gates: { G7: PASS }
    assertions:
      - "Distiller alt-ajanları mevcutsa hukuki tarama legal-distiller'a, bilimsel tarama medical-distiller'a devredilmeli (§5.4.quinquies)."
      - "Ana ajan yalnızca retrieval_distillate zarfını tüketir; ham tool çıktısı ana bağlama girmez."
      - "Distiller'lar yoksa (claude.ai) doğrudan retrieval'a düşülür ve etiketlenir (degrade_and_label) — davranış regresyonu yok."
    rationale: "§5.4.quinquies koşullu delegasyon + bağlam izolasyonu."

  # ---- v2.9.0 server-side legal distiller (claude.ai path) ----
  - id: ROUTE-015
    title: "claude.ai — server-side legal_distill_* yolu + degraded etiketleme"
    given: "claude.ai web ortamında bir ANALYZE/COMPARATIVE_LAW görevinde çok-kaynak (AB CELLAR + TR mevzuat) hukuki kanıt taraması gerekir; alt-ajan distiller yok."
    expect:
      mode: ANALYZE
      routed_to: lex-sanitas
      gates: { G7: PASS }
    assertions:
      - "Alt-ajan distiller MEVCUT DEĞİL (claude.ai) → §5.4.quinquies precedence seviye 2: connector'ın server-side legal_distill_start({topic}) çağrılır, {job_id, status:'running'} döner; sonra legal_distill_result({job_id}) status done/error olana dek yoklanır."
      - "Ana ajan yalnızca retrieval_distillate (v1.1) zarfını tüketir; ham DB çıktısı ana bağlama GİRMEZ (tool-sınırında izolasyon)."
      - "legal_distill_result status:'done' + degraded:true döndürürse iş başarılı olsa bile ana ajan yanıtı degrade_and_label uyarınca ETİKETLER (eksik/kısmi kapsama beyan edilir; coverage.empty_or_failed + distiller_note kaynak gösterilir)."
      - "legal_distill_result status:'error' ise seviye 3'e düşülür: doğrudan retrieval + etiketleme."
      - "Distiller kapsamı = lex-sanitas (legal/reg upstream'ler) + mevzuat; ottoman/titck kapsam dışı."
    rationale: "SKILL.md §5.4.quinquies precedence (alt-ajan → server-side legal_distill_* → doğrudan degrade) + degraded:true etiketleme kuralı; tasarım spec §6/§3."
