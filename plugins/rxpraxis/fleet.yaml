# rxpraxis MCP filosunun TEK GERÇEK KAYNAĞI.
#
# Şu dosyalar BURADAN ÜRETİLİR — onları elle düzenlemeyin:
#   .mcp.json · .codex-plugin/plugin.json (mcpServers+version) · fleet.lock.json
#
# Değişiklik yolu:  bu dosyayı düzenle → `python3 tools/fleetkit/gen_fleet.py`
# Denetim:          `python3 tools/fleetkit/check_drift.py --all` (ağ gerektirmez)
# Canlı sağlık:     `python3 tools/fleetkit/audit_plugins.py`

version: 2
plugin: rxpraxis
plugin_version: "1.2.5"

servers:
  - name: titck
    url: https://titck.cureonics.com/mcp
    auth_env: TITCK_MCP_API_KEY

  - name: mevzuat
    url: https://mevzuat.cureonics.com/mcp
    auth_env: MEVZUAT_MCP_API_KEY
    role: >-
      mevzuat.gov.tr + KAYSİS kurum belgeleri. search_all_mevzuat iki kaynağı ayrı
      coverage ile tarar; search_kaysis ve get_kaysis_detail/get_kaysis_text kurum
      belgesini sınırlı PDF sayfalarıyla okur. list_kaysis_types ve
      search_kaysis_institutions kaynak kodlarını keşfeder. kaysis:<belge_id> ile
      {tertip}_{tur}_{no} kimliklerini dönüştürme; degraded/manual_required/error
      veya bilinmeyen toplam yokluk kanıtı değildir. ChatGPT search/fetch iki kimliği korur.
    tools_used:
      - search_all_mevzuat
      - list_kaysis_types
      - search_kaysis_institutions
      - search_kaysis
      - get_kaysis_detail
      - get_kaysis_text
      - search_mevzuat
      - get_mevzuat_detail
      - get_mevzuat_content
      - get_mevzuat_text
      - search
      - fetch

  - name: pubmed
    url: https://pubmed.mcp.claude.com/mcp
    auth_env: null

  - name: clinical-trials
    url: https://hcls.mcp.claude.com/clinical_trials/mcp
    auth_env: null

  - name: biorxiv
    type: stdio
    command: uv
    args:
      - --directory
      - "${workspaceFolder:CureoHub}/mcp-servers/biorxiv-mcp"
      - run
      - biorxiv-mcp
    auth_env: null
    role: >-
      Local Hub stdio — CureoHub/mcp-servers/biorxiv-mcp (`uv run biorxiv-mcp`).
      Drop-in for Anthropic HCLS hcls.mcp.claude.com/biorxiv/mcp, which crashes
      search_preprints on api.biorxiv.org/details HTTP 200 + empty body.
      Optional keyword `query` via Europe PMC SRC:PPR.
