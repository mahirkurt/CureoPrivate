n Biogen/Ionis intrathecal ASO 2016 + Zolgensma onasemnogene abeparvovec Novartis/AveXis AAV9 gene therapy 2019 one-time IV $2.1M list + Evrysdi risdiplam Roche oral small molecule 2020**; (s) DMD ASO + gene therapy (Exondys 51 eteplirsen 2016 + Vyondys 53 golodirsen 2019 + Viltepso viltolarsen 2020 + Amondys 45 casimersen 2021 all Sarepta accelerated via dystrophin; **Elevidys delandistrogene moxeparvovec Sarepta AAV74 micro-dystrophin accelerated 2023-06 ages 4-5 → expanded 2024 ambulatory+non-ambulatory 4+ traditional/accelerated mixed confirmatory data**); (t) Brineura cerliponase alfa BioMarin CLN2 2017 + Palynziq PKU 2018 + Oxlumo PH1 2020 + **Lenmeldy atidarsagene autotemcel Orchard MLD gene therapy 2024 $4.25M pricing** + Skysona CALD 2022; (u) **pediatric obesity pharmacotherapy** Wegovy semaglutide FDA expansion 2022-12 adolescent 12+ + Saxenda liraglutide 2020 + Zepbound tirzepatide expansion 2024 pending + AAP 2023 pediatric obesity guideline pharmacotherapy+surgery earlier; (v) T1D Tzield teplizumab anti-CD3 FDA 2022-11 delays T1D stage 2 age 8+ cross-reference task-ta-metabolic.md; (w) growth hormone Ngenla somatrogon Pfizer 2023 LA weekly + Sogroya somapacitan Novo 2023 weekly + Skytrofa lonapegsomatropin Ascendis 2021 weekly; (x) pediatric psychiatry + neurology (ADHD stimulants generic-dominant + Qelbree viloxazine 2021 + Xelstrym 2022; **pediatric epilepsy Epidiolex cannabidiol Jazz Pharma Dravet+LGS+TSC 2018+** + Fintepla fenfluramine UCB/Zogenix Dravet 2020 + LGS 2022 + vigabatrin infantile spasms; pediatric autism no disease-modifying; pediatric depression fluoxetine 8+ + escitalopram 12+ + boxed pediatric suicidality); (y) pediatric vaccines (ACIP schedule CDC + HepB birth + DTaP/Hib/PCV/IPV/RV 2-6m + MMR/VZV/HepA 12-15m + HPV Gardasil 9 9-15y + **Beyfortus nirsevimab Sanofi+AstraZeneca RSV mAb FDA 2023-07 infants + young children seasonal** + Synagis palivizumab replaced + Abrysvo RSV maternal immunization infant protection); (z) Türkiye pediatrik ekosistemi (TİTCK EMA/FDA reliance pediatrik formülasyon ayrı başvuru + Sağlık Bakanlığı çocukluk aşı takvimi ücretsiz ACIP-uyumlu + SGK SUT EK-4C/D pediatrik uzman çocuk hastalıkları/onkolojisi/nörolojisi imzası + yerli jenerik pediatrik şurup/sublingual/damla yaygın + Spinraza/Zolgensma/Evrysdi ithalat protokollü tertiary merkez konseyi + DMD Sarepta Exondys/Vyondys/Amondys + Elevidys SGK yurt dışı ilaç dairesi + tertiary Hacettepe/Gazi/İstanbul/Cerrahpaşa/Ege/Dokuz Eylül + bebek ölüm ~9 per 1000 + 5 yaş altı ~11 per 1000 + akraba evlilik yüksek → hemoglobinopati + resesif genetik + çocukluk aşı kapsamı %97+ + TÜSEB + TPOG Türk Pediatrik Onkoloji Derneği). Orthogonal Layer-2 — 'Zolgensma SMA' invokes Layer 0 + Layer 1 cellgene + Layer 2 pediatric + Layer 2 rare-disease + Layer 2 CNS multi-TA (most modality-diverse pediatric example); 'Wegovy adolescent obesity' invokes Layer 0 + Layer 1 peptide + Layer 2 pediatric + Layer 2 metabolic; 'Beyfortus RSV prophylaxis' invokes Layer 0 + Layer 1 generic mAb + Layer 2 pediatric + Layer 2 infectious. v4.0.0 release."
