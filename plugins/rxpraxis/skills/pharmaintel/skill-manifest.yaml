(3 sequential FDA approvals + ARIA class effect discipline ApoE4 homozygote ~32% vs non-carrier ~9% + EMA label stratification + MRI monitoring mandatory + intracranial hemorrhage anticoagulation contraindication + IQLIK subcutaneous 2025 weekly SC self-administration + access challenges PET/CSF biomarker + APOE genotyping + infusion capacity + CMS registry → broader coverage + commercial underperformance vs initial projections), (h) emerging frontiers (GLP-1 in AD EVOKE/EVOKE+ Phase 3 pending 2026 + α-synuclein prasinezumab PADOVA + psychedelic MDMA Lykos PTSD CRL August 2024 + psilocybin Compass COMP360 + brexanolone/zuranolone PPD/MDD + KarXT xanomeline-trospium BMS Karuna $14B 2024 acquisition muscarinic agonist schizophrenia FDA 2024-09 + CGRP migraine mature class + ALS post-Relyvrio landscape), (i) Türkiye CNS ekosistemi (TİTCK EMA reliance + SGK SUT EK-4C/4F + MS merkezleri MS Derneği akredite 40+ tertiary + SMA Zolgensma 2021+ SGK + Spinraza protokollü + lecanemab 2025 değerlendirme SGK yok + psikiyatri ilaçları çoğu SUT eşdeğer grup + Türk yerli jenerik SSRI/SNRI/antipsikotik/antiepileptik yaygın). Orthogonal Layer-2 — 'Spinraza SMA' invokes Layer 0 + Layer 1 RNA + Layer 2 CNS + Layer 2 rare-disease multi-TA cross-reference; 'lecanemab AD' invokes Layer 0 + Layer 1 generic task-modality.md + Layer 2 CNS. v3.0.0 release."
