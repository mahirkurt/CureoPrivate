trategic National Stockpile; (n) HIV landscape (Gilead Biktarvy ~$14B+ dominant + INSTI backbone + Apretude cabotegravir first LA-injectable PrEP + Sunlenca lenacapavir Gilead FDA 2022 capsid inhibitor HIV-1 treatment-experienced + PURPOSE-1 Phase 3 2024 100% PrEP efficacy Q6M SC + Cabenuva LA monthly/Q2M); (o) HCV cure era (Sovaldi 2013 + Harvoni 2014 + Epclusa 2016 pan-genotypic + Mavyret AbbVie 2017 8-week + Vosevi retreatment + SVR12 >95% collapsing market $22B → $4-5B); (p) COVID-19 (Paxlovid Pfizer $27B FY2022 peak + Lagevrio Merck + Veklury Gilead + mAbs obsolete via variants); (q) antibacterial landscape (Dalvance + Sivextro + Avycaz + Vabomere + Xerava + Zemdri Achaogen bankrupt 2019 + Nuzyra Paratek + Recarbrio + Fetroja Shionogi CR-pathogens + Zerbaxa + Exblifep 2024 + Orlynvah sulopenem 2024 oral uUTI + commercial reality Achaogen/Melinta/Tetraphase bankruptcies despite QIDP); (r) antifungal (Cresemba + Brexafemme first-in-class glucan synthase + Rezzayo LA echinocandin 2023 + olorofim Phase 3 + Candida auris urgency); (s) TB (Sirturo bedaquiline Janssen 2012 first novel in ~40 years + Pretomanid TB Alliance 2019 BPaL XDR-TB); (t) antiviral specific (Prevymis letermovir CMV + Livtencity maribavir refractory CMV + Arexvy GSK first RSV ≥60 2023 + Abrysvo Pfizer RSV adult+maternal 2023 + mRESVIA Moderna first mRNA RSV 2024 + Beyfortus nirsevimab infant RSV prophylaxis 2023); (u) vaccines (ACIP schedule + Shingrix + Prevnar class + Gardasil 9 + HPV primary prevention); (v) pandemic preparedness (COVID mRNA 11-month sequence-to-EUA + Jynneos mpox + TPOXX tecovirimat 2022 outbreak + 2024 clade I); (w) AMR stewardship commercial tension (Joint Commission ASP 2017 + CMS CoP + subscription/pull incentives UK NHS dalbavancin 2022+ + RDT/NAAT/phenotypic AST/procalcitonin); (x) Türkiye ID ekosistemi (TİTCK EMA/FDA reliance + SGK SUT EK-4/G + HIV SUT EK-4C enfeksiyon uzman imzası + Biktarvy/Triumeq/Genvoya geri ödeme + HCV Mavyret/Epclusa/Harvoni + HBV tenofovir/ente