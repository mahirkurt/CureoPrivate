 OC endikasyon-bazlı geri ödeme + HRT sınırlı SUT + Veozah/Lynkuet/Orilissa/Myfembree/Zurzuvae SUT dışı özel ödeme + yerli jenerik OC/HRT yaygın Abdi İbrahim/Deva/Sanovel/Bilim + IVF SGK 3 deneme yaş şartı + TFR 2024 ~1.5 + preterm ~10-11% + PPD prevalans %15-25 + HPV aşısı Sağlık Bakanlığı programı dışı özel ödeme Gardasil 9 + tertiary merkezler Hacettepe/Gazi/İstanbul). Orthogonal Layer-2 — 'Zurzuvae PPD' invokes Layer 0 + Layer 1 smallmol + Layer 2 women's health + Layer 2 CNS multi-TA (psychiatry overlap); 'Veozah VMS menopause' invokes Layer 0 + Layer 1 smallmol + Layer 2 women's health; 'Zolgensma in postpartum setting' invokes multi-TA. v4.0.0 release."
