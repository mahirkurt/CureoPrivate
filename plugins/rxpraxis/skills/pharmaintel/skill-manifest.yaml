      rationale: "Pediatric TA has unique disciplines ORTHOGONAL to modality: (a) age sub-populations neonate (preterm <37w + term 0-28d) + infant (1m-2y) + child (2-11y) + adolescent (12-17y) each with distinct PK/PD/safety; (b) ethical constraints (limited consent capacity + non-therapeutic research restrictions + placebo-controlled trials discouraged when standard exists); (c) pediatric exclusivity 6-month major commercial incentive separate from orphan/NCE; (d) regulatory mandate framework (PREA) — adult approvals trigger pediatric study requirement; (e) reward framework (BPCA) — voluntary pediatric studies rewarded with exclusivity; (f) extrapolation discipline FDA 2024 final guidance permits adult-to-pediatric efficacy extrapolation under specific conditions; (g) small population for most pediatric indications — trial design challenges; (h) **FDA PREA-BPCA structure core**: PREA 2003 permanently reauthorized FDASIA 2012 + mandates pediatric studies triggered by new active ingredient/indication/dosage/regimen/route + sponsor iPSP within 60 days after End-of-Phase-2 meeting + waivers ('highly unlikely pediatric use') + deferrals allow adult approval pending pediatric + enforcement failure-to-comply consequences + non-compliance list; BPCA 2002 permanently reauthorized FDASIA 2012 voluntary incentive + FDA Written Request → 6-month pediatric exclusivity on ALL patents + exclusivities covering active moiety + study results NOT required positive + exclusivity granted upon study completion + stackable with orphan/NCE/QIDP + Lipitor atorvastatin ~$2.5B commercial illustration precedent; (i) **Rare Pediatric Disease Priority Review Voucher §529 FDCA FDASIA 2012** prevalence <200K + primary pediatric manifestation + tradeable market historically $50-500M peak 2015 $350M Sanofi/Retrophin + current ~$100-150M + multiple reauthorizations/sunset concerns + stackable with orphan + NCE + notable recipients Duchenne ASOs Exondys 51/Vyondys 53/Amondys 45 + Brineura CLN2 Batten