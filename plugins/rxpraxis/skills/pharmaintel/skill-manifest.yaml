    - id: G50
      name: "Ophthalmology / Retinal + Anterior Segment Therapeutic Area T3 Layer-2 template (task-ta-ophthalmology.md) loaded in addition to generic task-modality.md + applicable modality template when query content invokes wet AMD / nAMD / geographic atrophy / DME / DR / RVO / dry eye / glaucoma / retinal gene therapy / anti-VEGF / complement terminology"
