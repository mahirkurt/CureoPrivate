      name: "CNS / Neurology / Neuropsychiatry Therapeutic Area T3 Layer-2 template (task-ta-cns.md) loaded in addition to generic task-modality.md + applicable modality template when query content invokes CNS/neurology terminology OR analytical scope addresses brain/nervous system drug landscape"
