    # ========================================================================
    # v5.0.0 — Forensic Provenance Layer gates G51-G60 (G-PROV-01 through G-PROV-10)
    # ========================================================================
    # All G-PROV gates conditional on forensic-grade mode activation per
    # sub-protocol-provenance.md OR --mode forensic-grade validator flag.
    # Baseline mode: only G58 (PII redaction) always BLOCKER + G57 WARNING.
    # Forensic-grade mode: all 10 gates BLOCKER where severity indicates.
    # G39-G40 remain reserved for future use.
    # ========================================================================
    - id: G51
      name: "G-PROV-01 — Every provenance-required claim has [^prov:ev_*] footnote markup in report"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade flag active OR parent sub-protocol is sub-protocol-provenance.md / sub-protocol-bd-dd.md. Default OFF for baseline reports. Severity BLOCKER in forensic-grade mode. Provenance-required claim types per evidence-object-schema.md §3.1: {beneficial_ownership, sanctions_hit, regulatory_action, deleted_pipeline_claim, historical_label, titck_opponent_claim, litigation_exhibit}. Trigger logic claim-content-based per generic-by-default.md Article 5; user identity is NOT a valid trigger for activating forensic-grade mode."
      rationale: "Forensic-grade reports must mark every claim requiring provenance with explicit [^prov:ev_*] footnote anchor enabling machine-verifiable traceability to Evidence Object. Heuristic detection via HTML-comment semantic markup <!-- claim_type: * --> enables validator to count provenance-required vs footnoted claims and block on mismatch. This gate prevents 'silent' provenance-required claims that would fail downstream chain-of-custody audit. G-PROV-01 establishes the claim-to-evidence anchor at the report source level. v5.0.0 release."
    - id: G52
      name: "G-PROV-02 — Every [^prov:ev_*] footnote reference resolves to SQLite evidence index entry"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade AND --evidence-db provided. Severity BLOCKER in forensic-grade mode. Validator queries SQLite evidence-master.db.sqlite and cross-references footnote evidence_ids against indexed rows. Any orphan reference (footnote → no index row) triggers BLOCKER."
      rationale: "Footnote-to-index referential integrity prevents dangling references that would break Evidence Bundle ZIP assembly. Orphan footnotes indicate either (a) evidence_id typo in footnote, (b) evidence capture failed but report was not updated, or (c) SQLite DB corruption. G-PROV-02 catches all three at validation time before bundle delivery. v5.0.0 release."
    - id: G53
      name: "G-PROV-03 — Every Evidence Object has ≥2 of 3 capture paths succeeded (Wayback + Archive.is + local Playwright)"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade AND --evidence-db provided. Severity BLOCKER in forensic-grade mode. Validator parses capture_paths_succeeded JSON array per evidence row; any EO with <2 paths triggers BLOCKER."
      rationale: "k-redundancy minimum 2/3 per provenance-engine.md §7.1 defense-in-depth rationale. Single-path capture (e.g., Wayback-only or Playwright-only) is insufficient for court-defensibility — Internet Archive has been subject to lawsuits (Hachette v. Internet Archive 2023); Archive.is Cloudflare CAPTCHA challenges possible; local Playwright lacks independent third-party verification. ≥2 of 3 paths succeeded ensures at least one independent external custodian + at least one full-HTTP-layer capture (WARC or Wayback). Empirical testing shows >99.5% of URLs achieve ≥2 paths. G-PROV-03 is the core k-redundancy enforcement gate. v5.0.0 release."
    - id: G54
      name: "G-PROV-04 — content_hash_sha256 field non-empty + matches 64-char lowercase hex format + recomputes correctly from artifact"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade AND --evidence-db provided. Severity BLOCKER in forensic-grade mode. Validator applies SHA256_REGEX to content_hash_sha256 field. Full recompute (streaming SHA-256 of artifact file) is operator-invoked via scripts/provenance-engine/attest.py --verify-tsr flag — not executed inline by validator due to artifact access coupling."
      rationale: "SHA-256 content hash is the integrity anchor for all chain-of-custody operations. Malformed or missing hash breaks RFC 3161 TSA binding (TSA signs the hash, not the content) and breaks signature verification (sigstore signs the manifest digest derived from hashes). G-PROV-04 validates hash format compliance; full recompute delegated to operator for performance reasons. v5.0.0 release."
    - id: G55
      name: "G-PROV-05 — RFC 3161 Time-Stamp Response (TSR) file present + digest recompute matches manifest_digest_sha256"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity differential: WARNING in baseline mode → BLOCKER in forensic-grade mode. Only fires when --mode forensic-grade AND --evidence-db provided. Validator checks tsr_primary_path + tsr_primary_hash fields exist; operator invokes openssl ts -verify independently for full cryptographic verification."
      rationale: "RFC 3161 Time-Stamp Protocol via DigiCert TSA (primary) + FreeTSA (fallback) provides independent third-party proof that content existed at the recorded time — the core temporal attestation for forensic-grade reports. Without TSR, 'captured at time T' is merely operator metadata assertion without external corroboration. TSR file path mandatory forensic-grade; WARNING only in baseline mode because baseline reports may not require full forensic chain-of-custody depth. Dual TSA (DigiCert + FreeTSA) provides TSA-level redundancy if one TSA cert chain is questioned. v5.0.0 release."
    - id: G56
      name: "G-PROV-06 — UBO claim has P0 or P1 source (authority_tier ∈ {T0, OSINT-T1, OSINT-T2}) + non-empty triangulation_partner_ids"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity BLOCKER in BOTH baseline AND forensic-grade mode (baseline applies because UBO claims inherently require high defensibility regardless of overall report mode). Only evaluated for evidence rows with claim_type='beneficial_ownership'. Validator checks source_authority_tier field against P0/P1 tier sets + triangulation_partner_ids JSON array non-empty."
      rationale: "UBO claims have highest defensibility requirements per ubo-source-hierarchy.md §1.1 — P3 sources (LittleSis, Crunchbase, Rusprofile) never citeable alone for UBO. P0 statutory (Companies House UK PSC, Handelsregister Transparenzregister, MERSİS, Ticaret Sicili Gazetesi, etc.) + P1 authorized aggregators (OpenCorporates, OpenOwnership BODS, OCCRP Aleph authorized) constitute the minimum defensibility floor. Triangulation partner requirement ensures multi-source corroboration — single-source UBO claims fail court-defensibility test in TİTCK commission / OFAC compliance / BD DD contexts. G-PROV-06 is the hardest gate in the G-PROV family because UBO claims carry disproportionate regulatory + legal weight. v5.0.0 release."
    - id: G57
      name: "G-PROV-07 — Evidence capture retrieved_at within 7 days of report cite date (freshness warning)"
      mandatory: false
      applicable_to: ["all"]
      conditional: "Severity WARNING in BOTH baseline AND forensic-grade mode — never BLOCKER. Only evaluated when --evidence-db provided. Validator parses retrieved_at ISO 8601 UTC field + computes age vs current UTC time; >7 days triggers WARNING entry per evidence row."
      rationale: "Capture freshness matters for time-sensitive claims — pipeline pages + regulatory status + sanctions lists + BD-relevant corporate state can mutate within days. 7-day threshold aligns with typical BD DD engagement timeline (Days 0-6 capture → Day 7 report delivery). Beyond 7 days, captures may not reflect current state, though historical evidence remains valid for the point-in-time snapshot it represents. G-PROV-07 is WARNING-only because stale captures are still valid evidence for their capture date — operator judgment required whether refresh needed. Exceptions for statutory filings with known lag periods (MERSİS Türkiye, Ticaret Sicili Gazetesi) documented via compliance.lawful_basis_memorandum_ref. v5.0.0 release."
    - id: G58
      name: "G-PROV-08 — KVKK-sensitive evidence (contains_personal_data=true) requires pii_redaction_applied=true before bundle inclusion"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity BLOCKER in BOTH baseline AND forensic-grade mode — ALWAYS BLOCKER regardless of mode. PII redaction is non-negotiable KVKK + GDPR compliance. Validator parses contains_personal_data boolean + pii_redaction_applied boolean per evidence row."
      rationale: "KVKK Madde 5/2(ç) meşru menfaat + GDPR Art. 6(1)(f) legitimate interest permit capture of public content containing personal data for regulatory defense + commercial DD purposes, BUT require PII redaction before bundle distribution to satisfy proportionality + data minimization principles. G58 is the ONLY G-PROV gate that is BLOCKER in baseline mode — because PII handling discipline cannot be mode-dependent (KVKK/GDPR applies regardless of whether report is forensic-grade or not). Redaction methods per provenance-engine.md §6.1: NER-based blackbox overlay for PDF/PNG + DOM scrubbing for HTML. Capture of KOL personal LinkedIn or similar identifiable individual profiles NOT permitted under pharmaintel scope (exceeds KVKK necessity test). G-PROV-08 is the privacy-compliance keystone gate. v5.0.0 release."
    - id: G59
      name: "G-PROV-09 — Evidence Bundle ZIP contains required files (MANIFEST.yaml|json + README.md + VERIFICATION.md)"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade AND --evidence-root provided AND report references a bundle ZIP path. Severity BLOCKER in forensic-grade mode. Validator inspects evidence/bundle/ directory for *_evidence_bundle.zip, opens ZIP, checks for required entries."
      rationale: "Evidence Bundle ZIP is the standalone deliverable artifact for TİTCK commission submissions / FDA Citizen Petition dockets / BD data rooms / litigation discovery. Missing MANIFEST.yaml breaks machine-readable evidence index. Missing README.md breaks recipient orientation. Missing VERIFICATION.md breaks recipient verification workflow (openssl ts -verify + cosign verify commands). All three required for bundle to be self-contained + independently verifiable without pharmaintel skill access. G-PROV-09 is the deliverable-completeness gate. v5.0.0 release."
    - id: G60
      name: "G-PROV-10 — Bundle ZIP SHA-256 hash cited in parent report §Appendix B section"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Only fires when --mode forensic-grade AND report contains [^prov:ev_*] footnotes. Severity BLOCKER in forensic-grade mode. Validator regex-matches pattern 'Bundle SHA-256:' followed by 64-char lowercase hex in report text."
      rationale: "Citing bundle ZIP SHA-256 in parent report closes the chain-of-custody loop — recipient can independently verify bundle integrity with sha256sum. Without this citation, bundle tampering is undetectable from report alone. This is the final link binding parent report → Evidence Bundle ZIP → per-evidence artifacts → RFC 3161 TSA → sigstore signatures into a single tamper-evident chain. G-PROV-10 completes the forensic chain; absence invalidates all prior attestation layers from recipient's perspective. v5.0.0 release."
    # ========================================================================
    # v6.0.0 — Article 5.3 query language trigger audit gate G61
    # ========================================================================
    - id: G61
      name: "G22.9 / Article 5.3 — No auto-trigger rationale cites query language (writing system) as trigger source"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Always active (baseline + forensic-grade + T6-Defense). Severity BLOCKER. Validator pattern-matches §Auto-Trigger Disclosure / §Provenance Disclosure / §Sub-Protocol Activation blocks for language-fact-as-trigger rationales. Triggered regex classes (case-insensitive): (i) `(turkish|türkçe).{0,80}(language|dil|written|yazılmış).{0,80}(trigger|tetik)`; (ii) `(japanese|japonca|日本語).{0,80}(language|dil|written|yazılmış).{0,80}(trigger|tetik)`; (iii) `(mandarin|chinese|çince|中文).{0,80}(language|dil|written|yazılmış).{0,80}(trigger|tetik)`; (iv) inverse phrasing `(written|yazılmış).{0,40}(turkish|japanese|mandarin|chinese).{0,120}(sub-protocol|katman|layer|load)`; (v) `(query|sorgu).{0,30}(language|dil).{0,30}:.{0,20}(turkish|japanese|mandarin|chinese).{0,120}(sub-protocol|katman|layer)`."
      rationale: "The natural language / writing system of a query is NEVER a valid trigger source for a regional sub-protocol (turkey / pmda / nmpa) per generic-by-default.md Article 5.3 (v6.0.0). Query language carries no information about query scope — a Turkish-speaking user can ask about French healthcare policy in Turkish; an English-speaking user can ask about TİTCK regulatory decisions in English. Only explicit semantic content (TİTCK, SGK, SUT, MEDULA, Türk yerli sponsor adı for turkey; PMDA, MHLW, Chuikyo, Sakigake for pmda; NMPA, CDE, NHSA, NRDL, VBP for nmpa) is a valid trigger source. **v5.0.0 production test** (T-DXd asset profile query 'trastuzumab deruxtecan raporu hazırla') revealed that runtime fired sub-protocol-turkey despite query content containing ZERO Türkiye-specific terminology; root cause was ambiguous interpretation of 'Turkish query language' as a species of 'Geographic mention in query'. v6.0.0 codifies this distinction with (a) new forbidden-trigger table row in Article 5.1, (b) new Article 5.3 Language vs scope distinction section with symmetric coverage across turkey/pmda/nmpa + worked counterexamples, (c) additive forbidden-trigger block in each regional sub-protocol's trigger logic section, (d) validator extension `check_9_query_language_as_trigger()` with 5 regex pattern classes operating on §Auto-Trigger Disclosure / §Provenance Disclosure / §Sub-Protocol Activation section scopes. No breaking changes — fails reports that were already violating Article 5 principle in spirit but were not being detected due to the specific language-as-geography conflation. v6.0.0 release."
    # ========================================================================
    # v7.0.0 — Factual Verification Discipline + Proactive Forensic Suggestion
    # ========================================================================
    - id: G62
      name: "G22.10 / triangulation.md §11 — Nth-of-class chronological claims verified or safely rephrased"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Always active (baseline + forensic-grade). Severity: FAIL for known-wrong claims (hardcoded blocklist from production test failures); WARNING for unverified Nth claims detected by regex. Validator check_10_historical_claim_verification() scans report text for ordinal + class-category patterns in both English and Turkish."
      rationale: "Ordinal chronological claims ('first/second/third X in FDA history') are a documented persistent factual blind spot in pharmacointelligence reporting. v2.0.0 production test reported 'second tumor-agnostic' → v5.0.0 reported 'third' → both wrong (actual: at least seventh). triangulation.md §11 codifies mandatory primary-database enumeration for these claims. Known-wrong patterns (second/third tumor-agnostic in any language) are hardcoded FAIL blockers. General Nth patterns trigger WARNING with advisory to verify. Safe rephrasing patterns documented (e.g., 'first ADC-based tumor-agnostic' avoids enumeration-dependent ordinal). Built-in FDA tumor-agnostic chronology reference table provided in triangulation.md §11 as baseline. v7.0.0 release."
    - id: G63
      name: "Step 1i — Proactive forensic-grade activation suggestion emitted when affinity signal detected"
      mandatory: false
      applicable_to: ["all"]
      conditional: "Severity WARNING (advisory, not BLOCKER). Only evaluated when report contains forensic-affinity content signals (TİTCK savunması, BD DD, litigation, sanctions, deleted pages, UBO) AND sub-protocol-provenance.md is NOT loaded. Validator checks for presence of suggestion block in report preamble or §Provenance Disclosure."
      rationale: "v5.0.0 production test demonstrated that the Forensic Provenance Layer's flagship feature went unused despite ideal use-case content (Yargıtay emsal karar, TİTCK erişim, SGK mahkeme süreci). Root cause: user did not explicitly request forensic-grade mode, and the opt-in design (correct for backward compatibility) has low discoverability. Step 1i adds a one-time proactive suggestion when content signals indicate high forensic-grade affinity — user confirms or declines. G63 is WARNING-only (not BLOCKER) because the suggestion is advisory and user may legitimately decline. The goal is awareness, not enforcement. v7.0.0 release."

    # G64-G65 remain reserved/unassigned. The v8.0.0 build release_name referenced
    # "G64/G65" for the 4-Channel Data Stack work, but those gate bodies were never
    # formalized as process_gates entries. The numbers are held reserved (alongside
    # G39-G40) to avoid retroactive semantic collision; v8.1.0 presentation gates
    # therefore continue at G66. Cumulative actual gate count: 64 (G1-G68 minus the
    # four reserved numbers G39, G40, G64, G65).

    # --- v8.1.0 — Reader-Facing Clean-Copy Standard (Nihai Rapor Sunum Disiplini) ---
    - id: G66
      name: "Two-layer output separation — reader-facing clean copy (Layer A) carries no internal machinery"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity BLOCKER. Evaluated on every Phase 5 report deliverable. The reader-facing body (Layer A) MUST be a journal-quality clean copy: it MUST NOT contain per-claim provenance stamps, the Confidence Distribution Table, Triangulation Notes, the G22 customization-audit line, Auto-Trigger/Sponsor-Sweep disclosures, or any internal-machine terminology (gate IDs, sub-protocol names, capture-path tokens, validator vocabulary). All such machinery MUST be relocated to Layer B (İç Denetim ve Sağlama Kaydı), which is wrapped in the render-exclusion sentinel pair `<!-- RENDER:EXCLUDE-FROM-HERE -->` … `<!-- RENDER:EXCLUDE-TO-HERE -->` or shipped as a companion file. CRITICAL COMPATIBILITY CONSTRAINT: the Layer B disclosure-block headings (Provenance Disclosure, Confidence Disclosure, Triangulation Notes, Auto-Trigger Disclosure) MUST be preserved as genuine level-2 `##` Markdown headings so that validate-report-discipline.py Check 8/9 (which locate disclosure blocks by `##?\\s*<Heading>` regex over the combined Layer A + Layer B document) continue to PASS unchanged. The validator scans the whole document; the two-layer split is a presentation/render concern, not a validation-surface change."
      rationale: "Production reports historically interleaved evidentiary machinery (block-quote provenance stamps, confidence tables, triangulation prose, G22 audit lines) directly into the narrative body, which is correct for auditability but degrades the presented artifact below journal standard and leaks internal vocabulary to the reader. G66 enforces a clean separation: Layer A reads like a peer-reviewed article; Layer B preserves the full audit trail for internal verification and is excluded from the rendered output by the design pipeline. The separation does not weaken evidence discipline — every stamp, table, and disclosure still exists, merely relocated. The heading-preservation clause guarantees zero regression in the validator, which remains byte-for-byte unchanged. v8.1.0 release."
    - id: G67
      name: "Visualization-directive containment — all viz instructions are HTML comments, never visible prose"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity BLOCKER. Every visualization directive (instruction to render a dataset as a chart, diagram, matrix, timeline, or map for the downstream design pipeline) MUST be expressed exclusively as an HTML comment using the `<!-- VIZ: ... -->` single-line form or the `<!-- VIZ-BLOCK ... /VIZ-BLOCK -->` multi-line form, placed immediately adjacent to the data it describes. Visualization directives MUST NOT appear as visible Markdown prose, MUST NOT be echoed or paraphrased in the rendered narrative, and MUST be strippable by the design pipeline without altering reader-facing content. This guarantees that design-process guidance never contaminates the final report text the reader sees, while still travelling with the data for the visualization stage. Validator generic-by-default leak scan (Checks 1-8) covers HTML-comment content, so directives MUST themselves be leak-free."
      rationale: "Principle 5 of the v8.1.0 revision requires that the Markdown report carry visualization guidance for the subsequent render/design stage (e.g. 'render this five-year revenue series as a grouped column chart') WITHOUT that guidance entering the final reader-facing prose. HTML comments satisfy both constraints simultaneously: they are invisible in any Markdown renderer (defense layer 1) and are explicitly stripped by the carbon-html-report / carbon-pptx design pipeline (defense layer 2 — defense-in-depth). Co-locating each directive with its source data preserves the design intent unambiguously. G67 makes the containment mandatory and auditable. v8.1.0 release."
    - id: G68
      name: "Info-box and abbreviations-glossary coverage for reader comprehension"
      mandatory: true
      applicable_to: ["all"]
      conditional: "Severity WARNING (advisory quality gate, not BLOCKER). The reader-facing report (Layer A) SHOULD open with a 'Kısaltmalar ve Tanımlar' (Abbreviations and Definitions) glossary; every domain abbreviation and specialist term SHOULD be expanded on first use; and key concepts, regulatory mechanisms, or methodological caveats SHOULD be surfaced in info boxes (`Bilgi Kutusu·` / `Yöntem Notu·` / `Dikkat·` bold-lead block-quotes) so that no comprehension gap is left for a non-specialist reader. Yöntem Notu boxes describe methodology in general, reader-accessible language and MUST NOT reintroduce internal-machine terminology (which would violate G66). G68 is WARNING-only because glossary/info-box density is a quality judgement that scales with report complexity; trivially short reports may not need a full glossary."
      rationale: "Principles 3 and 4 of the v8.1.0 revision require an optimized, comfortably-followable narrative in which the reader encounters no unexplained term. A front-loaded abbreviations glossary plus inline info boxes (definitions, method notes, cautions) operationalize this. The gate is advisory rather than blocking because comprehension-aid density is inherently proportional to subject complexity and report length; enforcing a hard minimum on a one-page note would be counterproductive. The cross-reference to G66 prevents Yöntem Notu boxes from becoming a back-door for the very machinery G66 relocates. v8.1.0 release."

