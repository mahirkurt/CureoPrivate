      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is peptide therapeutic. Default OFF for non-peptide T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a peptide developer (Novo Nordisk, Eli Lilly, AbbVie, Ipsen, Recordati Rare Diseases, Amgen, Radius Health/Paratek) and user memory-derived endocrinology/oncology specialty interest are NOT valid triggers."
      rationale: "Peptide modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) FDA chemically synthesized ≤40 amino acids drug pathway (NDA + ANDA) vs >40 aa or recombinant biologic pathway (BLA + 351(k)) bright-line distinction with profound implications for generic/follow-on landscape + reference product exclusivity + substitution dynamics, (b) half-life extension strategies including fatty acid acylation + albumin binding for GLP-1 class (semaglutide K26 octadecanedioic acid via γ-glutamic acid spacer; tirzepatide C20 fatty diacid; liraglutide palmitic acid), PEGylation, Fc fusion exemplified by dulaglutide (cross-reference task-modality-fusion.md), D-amino acid substitution, cyclization/conformational constraint, (c) GLP-1 class generation taxonomy from 1st gen exenatide BID through 2nd gen weekly injectable through 3rd gen oral Rybelsus through 4th gen GLP-1/GIP dual agonist tirzepatide through 5th gen multi-receptor agonists (retatrutide GLP-1/GIP/glucagon Phase 3 TRIUMPH; CagriSema GLP-1/amylin Novo Nordisk Phase 3; survodutide GLP-1/glucagon Boehringer Ingelheim; mazdutide Innovent+Lilly China-led Phase 3; pemvidutide Altimmune Phase 2), (d) GnRH agonist/antagonist class with prostate cancer ADT discipline including testosterone flare mitigation via anti-androgen pre-treatment + IVF protocol cetrorelix/ganirelix, (e) somatostatin analog class (Sandostatin LAR/Somatuline Depot/Signifor/Mycapssa oral), (f) PTH analog class (Forteo teriparatide + Tymlos abaloparatide + osteosarcoma rat carcinogenicity boxed warning history removed 2020), (g) SPPS Fmoc chemistry manufacturing with major specialty CMOs (Bachem, PolyPeptide Group, Lonza, CordenPharma, Ajinomoto Bio-Pharma, Hybio China), (h) ANDA generic peptide pathway including Copaxone glatiramer landmark 2015 Mylan precedent + product-spesifik FDA bioequivalence guidances + EMA Article 10(4) recombinant peptide biosimilar pathway, (i) GLP-1 supply crisis 2022-2024 demonstrating manufacturing capacity as commercial bottleneck + Novo Nordisk + Eli Lilly capacity expansion >$10B + compounded GLP-1 controversy with FDA enforcement actions late 2024, (j) commercial trajectory (GLP-1 fastest-growing pharma category in history with semaglutide franchise ~$30B+ + tirzepatide ~$15B+ + exceptional pricing power $1,300-2,000/month US WAC), (k) disease area expansion beyond T2D + obesity (CV outcomes SELECT/REWIND/LEADER, HFpEF STEP-HFpEF, sleep apnea SURMOUNT-OSA tirzepatide approved Dec 2024, CKD FLOW semaglutide, AD EVOKE/EVOKE+ pending, MASH ESSENCE, SUD investigational), (l) Türk yerli peptit ekosistemi sınırlı yerli üretim. Without this template, peptide T3 reports would treat peptides as automatically biologics or as small molecules, miss FDA chemically-synthesized vs recombinant bright-line, generalize GLP-1 commercial trajectory inappropriately. v2.6.0 release."
    - id: G32
      name: "Microbiome Therapeutics / LBP T3 niche modality template (task-modality-microbiome.md) loaded in addition to generic task-modality.md when query content invokes LBP/FMT/microbiome therapeutic terminology OR analytical scope addresses recurrent C. difficile prevention landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is microbiome therapeutic / live biotherapeutic product. Default OFF for non-microbiome T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a microbiome developer (Ferring/Rebiotix, Seres Therapeutics, Vedanta Biosciences, Pendulum Therapeutics, Crestovo/Finch — discontinued) and user memory-derived gastroenterology/infectious diseases specialty interest are NOT valid triggers."
      rationale: "Microbiome modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) FDA Live Biotherapeutic Product (LBP) regulatory category under CBER OTP + BLA pathway under PHSA §351(a) + distinguished from food/supplement probiotics, (b) 3 architectural classes of microbiome therapeutics (donor-derived traditional FMT vs donor-derived standardized LBP vs designed/rationally defined LBP) with profound implications for manufacturing reproducibility + IP defensibility + donor independence, (c) ecosystem restoration vs single-pathogen mechanism hypotheses (FDA labels for both Rebyota and Vowst explicitly state 'mechanism of action has not been established' — important honesty discipline), (d) FDA-approved LBP landscape — Rebyota fecal microbiota live-jslm formerly RBX2660 Ferring Pharmaceuticals/Rebiotix subsidiary FDA 2022-11-30 first-in-class via PUNCH CD3 trial Khanna et al. Drugs 2022;82:1527-1538 with Bayesian primary analysis treatment success 70.6% vs 57.5% placebo (99.1% posterior probability superiority) administered as single-dose rectal enema 150 cc 1×10⁸ to 5×10¹⁰ CFU/cc frozen-thawed; Vowst fecal microbiota spores live-brpk formerly SER-109 Seres Therapeutics + Nestlé Health Science FDA 2023-04-26 first oral LBP via ECOSPOR III with 88% recurrence-free at 8 weeks vs 60% placebo (oral capsules 4 QD × 3 days preceded by magnesium citrate bowel washout no refrigeration required), (e) discontinued + ongoing programs (RBX7455 Rebiotix paused; CP-101 Crestovo/Finch ceased operations 2023; VE303 Vedanta 8-strain consortium Phase 3 ongoing; NTCD-M3 Destiny Pharma Phase 3; ADS024 Adiso Phase 2; MET-2 NuBiyota Phase 2; SER-262 Seres), (f) donor screening framework with FDA evolving guidance per 2019 ESBL E. coli transmission incident causing FMT-associated bacteremia death + COVID SARS-CoV-2 screening additions + MDRO mandatory screening, (g) FDA enforcement discretion for locally-prepared FMT in CDI indications without IND vs IND requirement for any non-CDI indication, (h) EMA non-equivalent regulatory framework with member state heterogeneity (some treat as medicinal product, others as tissue/cell substance; ATMP Regulation 1394/2007 generally does NOT apply) + Rebyota EU regulatory withdrawal 2024 per market access challenges, (i) commercial trajectory challenges (~$9K Rebyota single dose; ~$17.5K Vowst 12-capsule course; Seres 2024 restructuring with VOWST commercialization rights returned to Nestlé Health Science; locally prepared FMT continued utilization despite FDA-approved alternatives due to cost ~$500-2,000 institution-prepared + established institutional protocols), (j) pipeline + future indications (UC induction + oncology immune checkpoint inhibitor response modulation PRIMA/MITRE/FMT-LUMINATE + hepatic encephalopathy + MDRO decolonization + investigational gut-brain axis + metabolic disease + allogeneic HSCT GVHD prevention + engineered live biotherapeutics frontier with Synlogic SYNB1934 PKU Phase 2 fail + Eligo Bioscience CRISPR-Cas-armed phages). Without this template, microbiome T3 reports would treat LBPs as equivalent to OTC probiotics, conflate donor-derived with designed LBPs, overstate mechanism specificity. v2.6.0 release."
    - id: G33
      name: "Photodynamic Therapy T3 niche modality template (task-modality-pdt.md) loaded in addition to generic task-modality.md when query content invokes PDT/PDD/FGS terminology OR analytical scope addresses dermatology AK/BCC field treatment OR glioma fluorescence-guided surgery"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is photodynamic therapy. Default OFF for non-PDT T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a PDT developer (Pinnacle Biologics — porfimer sodium; Sun Pharma/DUSA — Levulan; Biofrontera — Ameluz; Bausch+Lomb — Visudyne; Galderma — Metvix; NX Development Corp — Gleolan; Rakuten Medical — Akalux) and user memory-derived dermatology/neurosurgery/ophthalmology specialty interest are NOT valid triggers."
      rationale: "PDT modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) 3-component mechanism (photosensitizer + light + oxygen) with dual selectivity creating spatial precision via singlet oxygen ¹O₂ very short diffusion distance ~10-100 nm (Type II photochemistry dominant clinical mechanism), (b) PDT vs PDD/FGS distinction (5-ALA used in BOTH modalities — therapeutic PDT for AK/BCC vs visualization FGS for glioma — depending on light wavelength applied), (c) photosensitizer class taxonomy — 1st gen porfimer sodium Photofrin Pinnacle 1995 esophageal cancer + endobronchial NSCLC + Barrett's HGD + ampullary cholangiocarcinoma with prolonged 4-6 week skin photosensitivity precaution; 2nd gen ALA-prodrug class (intracellular conversion to PpIX active photosensitizer) including topical Levulan Kerastick Sun Pharma/DUSA + Ameluz Biofrontera + MAL Metvix Galderma for AK/BCC field cancerization + oral Gleolan NX Development FDA 2017 for FGS of high-grade gliomas; 3rd gen verteporfin Visudyne Bausch+Lomb wet AMD largely displaced by anti-VEGF ranibizumab/aflibercept/faricimab + temoporfin Foscan Biolitec H&N SCC palliation + padeliporfin Tookad STEBA Biotech localized prostate cancer EMA 2017 not US-approved, (d) wavelength engineering (red ~630 nm deepest penetration ~5-10 mm for porfimer sodium/ALA-PpIX/MAL; blue 417 nm shallow ~1-2 mm BLU-U for superficial dermatology; near-infrared 700-800 nm emerging 3rd gen for deeper penetration), (e) procedural disciplines (drug-light interval per PS varying 5-15 min Visudyne vascular-targeted to 14-18 hr 5-ALA topical to 40-50 hr Photofrin systemic; light delivery via diode laser/LED arrays/optical fiber/endoscopic balloon diffuser; skin photosensitivity precautions especially Photofrin systemic 4-6 weeks strict bright light avoidance), (f) FDA combination drug-device CDER+CDRH coordination per indication with separate approvals per indication (Photofrin esophageal/NSCLC/Barrett's/ampullary each requiring dedicated NDA), (g) commercial trajectory (~$2-3B niche global market with dermatology fastest growing segment + indication-specific market sizes + pricing benchmarks $5-10K Photofrin + $300-400 Levulan + $500-700 Ameluz + $5-10K Gleolan), (h) antibody-photosensitizer conjugates (photoimmunotherapy) frontier — Akalux cetuximab saratolocan Rakuten Medical PMDA Japan 2020 H&N approval but US development discontinued 2024 Phase 3 LUZERA-301 + nanoparticle encapsulated PSs + PDT + IO combinations + antimicrobial aPDT for resistant infections. Without this template, PDT T3 reports would conflate therapeutic PDT with photodynamic diagnosis/FGS, treat PDT as equivalent to phototherapy UVB/UVA1/PUVA, miss DLI discipline, fail to address skin photosensitivity precautions burden. v2.6.0 release."
    - id: G34
      name: "Oncolytic Virus T3 niche modality template (task-modality-oncolytic.md) loaded in addition to generic task-modality.md when query content invokes OV/oncolytic immunotherapy terminology OR analytical scope addresses melanoma intralesional or NMIBC BCG-unresponsive landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is oncolytic virus. Default OFF for non-OV T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being an oncolytic virus developer (Amgen — T-VEC; Ferring — Adstiladrin; Daiichi Sankyo — Delytact in Japan; Replimune — RP-1/RP-2/RP-3; Oncolytics Biotech — Reolysin; SillaJen — Pexa-Vec; CG Oncology — cretostimogene; Akamis Bio formerly PsiOxus; Turnstone Biologics; Vyriad; Voyager Therapeutics) and user memory-derived oncology/dermatology specialty interest are NOT valid triggers."
      rationale: "Oncolytic virus modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) dual mechanism — direct oncolysis (preferential viral replication in tumor cells → cell lysis → tumor debulking) + immune activation (release of tumor-associated antigens + DAMPs/PAMPs + viral antigens → cold tumor → hot tumor conversion → systemic anti-tumor immune response) positioning OV as bridge between targeted therapy + immunotherapy, (b) tumor selectivity strategies (natural tumor tropism reovirus exploiting cancer IFN response defects + genetic deletion of virulence factors T-VEC ICP34.5/ICP47 + tissue-specific promoter CG0070 E2F-1 retinoblastoma-defective + receptor retargeting + suicide gene insertion), (c) immune-stimulating transgene 'armed' oncolytic viruses (GM-CSF in T-VEC/RP-1/Pexa-Vec; IL-12; anti-CTLA-4 in RP-2; multi-cytokine RP-3 combinatorial), (d) FDA-approved landscape — Imlygic talimogene laherparepvec T-VEC HSV-1 deleted ICP34.5/ICP47 with GM-CSF inserted Amgen FDA 2015-10-27 + EMA 2015-12 unresectable melanoma intralesional via OPTiM Phase 3 trial Andtbacka et al. JCO 2015;33:2780-8 DRR 16.3% vs GM-CSF 2.1% p<0.001 ORR 26.4% vs 5.7% trend toward OS HR 0.79 not significant; Adstiladrin nadofaragene firadenovec-vncg non-replicating recombinant adenovirus 5 with IFN alfa-2b transgene Ferring FDA 2022-12-16 BCG-unresponsive high-risk NMIBC with CIS via Phase 3 N=157 CR 51% with median duration 9.7 months Q3-monthly intravesical, (e) regional approvals — Oncorine H101 recombinant adenovirus 5 E1B-55kD-deleted Shanghai Sunway Biotech NMPA 2005 first oncolytic virus globally + Delytact teserpaturev G47Δ HSV-1 triple-mutant Daiichi Sankyo PMDA Japan 2021 conditional Sakigake-designated malignant glioma + Rigvir ECHO-7 Latvia 2004 withdrawn 2019 controversial (lacks Western pivotal evidence), (f) combination therapy paradigm with strong scientific rationale but mixed clinical evidence — T-VEC + pembrolizumab MASTERKEY-265 Phase 3 NEGATIVE for both PFS and OS primary endpoints in advanced melanoma (significant dampener); RP-1 + nivolumab IGNYTE-3 Phase 3 ongoing with positive Phase 2 60%+ ORR checkpoint-naive; Pexa-Vec JX-594 + sorafenib PHOCUS HCC Phase 3 failed primary endpoint program discontinued 2019, (g) manufacturing complexity (specialized viral vector production with producer cell lines Vero/HeLa/HEK293/BHK + bioreactor cultivation + viral propagation + purification + cryopreservation cold chain typically -90°C to -70°C frozen shipment requirement), (h) regulatory framework (FDA CBER OTP + commonly Breakthrough Therapy + RMAT + Priority Review + Orphan Drug designations; EMA ATMP via Regulation EC 1394/2007 GTMP classification with CAT scientific opinion → CHMP recommendation; PMDA Sakigake), (i) biosafety considerations beyond standard biologics (viral shedding from treated patients via urine/saliva/lesion exudate; healthcare worker administration safety; household contact safety especially immunocompromised; environmental release biosafety classification typically BSL-2; mandatory patient + HCP education protocols), (j) commercial reality — Imlygic ~$60-80M FY2024 underperforming initial blockbuster expectations + Adstiladrin early uneven launch + procedural complexity intralesional/intravesical + competing ICI modalities + MASTERKEY-265 dampener + cold chain + administration training infrastructure, (k) pipeline depth across HSV-1 platform (Replimune RP-1 IGNYTE-3 melanoma + ARTACUS skin SCC + RP-2 + RP-3) + adenovirus platform (CG Oncology cretostimogene grenadenorepvec NMIBC Phase 3 BOND-003 + CORE-008 + Akamis Bio + SillaJen Pexa-Vec) + vaccinia + reovirus pelareorep + NDV + VSV + coxsackievirus Cavatak Merck via Viralytics + maraba virus Turnstone + measles vector. Without this template, OV T3 reports would treat oncolytic viruses as equivalent to gene therapy (different mechanism — replicating vs non-replicating, oncolytic intent vs gene replacement), generalize MASTERKEY-265 negative outcome inappropriately to ALL OV+ICI combinations, miss biosafety/shedding considerations. Cross-reference task-modality-cellgene.md for ATMP framework. v2.6.0 release."
    - id: G35
      name: "Fusion Protein / Fc-Fusion T3 niche modality template (task-modality-fusion.md) loaded in addition to generic task-modality.md when query content invokes fusion protein/decoy receptor/VEGF trap/TNF receptor decoy/'-cept' suffix terminology OR analytical scope addresses anti-TNF or anti-VEGF or CTLA-4-Ig landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is fusion protein. Default OFF for non-fusion-protein T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a fusion protein developer (Amgen — Enbrel/Nplate; BMS — Orencia/Nulojix; Regeneron + Bayer — Eylea + Eylea HD; Eli Lilly — Trulicity; Sanofi/Sobi formerly Bioverativ from Biogen — Eloctate/Alprolix; Pfizer — Enbrel co-marketing; CSL Behring — Idelvion) and user memory-derived rheumatology/ophthalmology/hematology specialty interest are NOT valid triggers."
      rationale: "Fusion protein modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) genetic fusion at DNA level (single recombinant polypeptide combining two functional domains via genetic fusion) vs ADC chemical conjugation (covalent linker-payload post-translational) — fundamentally different architecture with different IP + manufacturing + biosimilar implications, (b) Fc-fusion as dominant architecture (functional domain — typically receptor extracellular domain ECD or ligand or peptide or scFv — fused to IgG Fc typically IgG1 or IgG4) imparting FcRn-mediated half-life extension via neonatal Fc receptor recycling enabling days-to-weeks plasma half-life + bivalent presentation from Fc dimer + manufacturing tractability via Protein A affinity chromatography purification, (c) '-cept' INN suffix convention for receptor Fc-fusion proteins (etanercept, abatacept, belatacept, aflibercept, rilonacept) — naming discipline, (d) approved landscape by class — TNF receptor-Fc Etanercept Enbrel Amgen+Pfizer FDA 1998 RA foundational fusion protein with US biosimilar entry blocked through 2029 by patent thicket vs EU launch Benepali/SB4 + Erelzi 2017; CTLA-4-Ig costimulation modulators Abatacept Orencia BMS FDA 2005 RA + GVHD prophylaxis post-HSCT 2021 + Belatacept Nulojix BMS FDA 2011 renal transplant calcineurin-free immunosuppression with EBV-PTLD boxed warning for EBV-seronegative recipients particularly CNS PTLD; VEGF trap Aflibercept Eylea engineered VEGFR-1 domain 2 + VEGFR-2 domain 3 fused to IgG1 Fc Regeneron US + Bayer ex-US FDA 2011 wet AMD + DME + RVO + mCRC Zaltrap intravenous + Eylea HD 8 mg high-dose 2023 enabling Q12-16 week dosing + Yesafili Biocon+Mylan and Opuviz Samsung Bioepis biosimilars 2024; IL-1 trap Rilonacept Arcalyst Regeneron FDA 2008 CAPS + 2021 recurrent pericarditis expansion; GLP-1-Fc Dulaglutide Trulicity Eli Lilly FDA 2014 T2D + 2020 CV outcome label cross-reference task-modality-peptide.md; long-acting factor concentrates Eloctate efmoroctocog alfa rFVIII-Fc + Alprolix eftrenonacog alfa rFIX-Fc Sanofi acquired Bioverativ from Biogen 2018 FDA 2014 hemophilia A/B with 1.5x and 3-5x half-life extension + PEGylated Adynovate; peptibody Nplate Romiplostim TPO-mimetic peptide-Fc Amgen ITP, (e) class-spesifik disciplines — decoy receptor mechanism as ligand neutralization (etanercept TNF, aflibercept VEGF, rilonacept IL-1) distinct from anti-receptor mAb blockade with engineered avidity from bivalent presentation + Fc dimer (aflibercept binds VEGF ~140x higher affinity than ranibizumab) + Fc-fusion class effects with specific belatacept EBV-PTLD boxed warning, (f) manufacturing (CHO mammalian cell culture predominant + 10,000-25,000 L bioreactor scale for blockbusters + Protein A affinity purification + glycosylation as critical quality attribute affecting FcRn binding/effector function/immunogenicity + aggregation control more critical than naked mAbs), (g) regulatory pathway (FDA BLA under PHSA §351(a) with CDER OII for autoimmune Fc-fusions + CDER OOD for VEGF + biosimilar 351(k) BPCIA pathway with cross-reference task-modality-biosimilar.md including aflibercept Yesafili+Opuviz 2024 + etanercept biosimilars Erelzi+Eticovo with US patent thicket delay; EMA standard centralized; PMDA established; NMPA major Chinese biosimilar developer ecosystem; TİTCK reliance pathway), (h) commercial trajectory (Eylea + Eylea HD ~$8B+ FY2024 combined globally + Trulicity ~$6B FY2024 declining as patients shift to tirzepatide Mounjaro/Zepbound + Enbrel ~$3B FY2024 declining post-EU biosimilar competition with US patent protection through 2029 + Orencia ~$3.5B stable mature + Eloctate/Alprolix ~$1B+ combined), (i) Enbrel patent thicket lifecycle defense as illustrative precedent (method-of-use + formulation + manufacturing patents extend effective exclusivity well beyond original composition patent expiry — US biosimilar entry blocked through 2029 vs 2017 EU launch), (j) next-gen Fc engineering active development (YTE M252Y/S254T/T256E mutations extend half-life + LALA/LALA-PG silenced Fc for autoimmune indications + DLE S239D/I332E enhanced effector for oncology + FcRn vs FcγR selectivity engineering + bispecific Fc-fusions with knobs-into-holes Fc heterodimerization). Without this template, fusion protein T3 reports would treat fusion proteins as equivalent to mAbs of similar target (etanercept ≠ adalimumab despite shared TNF), conflate decoy Fc-fusion trap mechanism with anti-receptor mAb blockade, miss biosimilar pathway specifics. Cross-references task-modality-biosimilar.md (Fc-fusion biosimilar pathway) AND task-modality-peptide.md (GLP-1 Fc-fusion dulaglutide). v2.6.0 release."
    - id: G36
      name: "Computational Analytics Layer activation (analytics-framework.md + analytics-npv.py + analytics-sensitivity.py + analytics-scenario.py) when quantitative NPV / sensitivity / scenario modeling is in scope for T1/T2/T3/T4/T5 analyses"
      mandatory: false
      applicable_to: ["T1", "T2", "T3", "T4", "T5"]
      conditional: "Fires when query content invokes quantitative valuation / financial modeling / NPV / rNPV / risk-adjusted / sensitivity / tornado / scenario forecasting / Monte Carlo / peak sales / cannibalization. Default OFF for descriptive qualitative analyses. Trigger logic query-content-based; user being a financial analyst or investment professional is NOT automatic trigger."
      rationale: "Computational Analytics Layer introduces first substantive non-documentation capability in pharmaintel — programmatic execution of financial valuation models beyond pure discipline documentation. Framework documented in analytics-framework.md (365 lines) establishes: (a) scope discipline (what framework provides + does NOT substitute for sponsor-supplied valuation models or market-grade equity research or task-hta.md health economic modeling), (b) inputs-determine-confidence principle, (c) rNPV modeling methodology (risk-adjusted probability of success × post-tax cash flows / (1+WACC)^t with phase-spesifik PTRS benchmarks per BIO/Biomedtracker historical), (d) sensitivity analysis framework (one-way tornado with ±20-30% input ranges; two-way heat maps for key interaction variables), (e) scenario forecasting (base/bull/bear with probability weights + Monte Carlo primitive for distribution assumptions), (f) cross-reference with task-hta.md for QALY/ICER/budget impact (distinct from NPV), (g) forbidden patterns including claiming precision beyond input confidence + single-point estimates for probabilistic outcomes + substituting for sponsor guidance. Three runnable Python scripts in /scripts/: analytics-npv.py (180 lines JSON input schema + phase-spesifik PTRS defaults + per-phase NPV computation + summary output); analytics-sensitivity.py (190 lines tornado diagram generation + one-way + two-way sensitivity with variable-range inputs); analytics-scenario.py (248 lines base/bull/bear scenario weighting + Monte Carlo primitive with configurable iterations). Without this layer, pharmaintel analytical outputs limited to qualitative descriptions — quantitative NPV/sensitivity/scenario claims had to defer to sponsor or third-party valuation models. v3.0.0 release — first substantive non-documentation capability."
    - id: G37
      name: "Real-time API Integrations Layer activation (api-integrations.md doctrine) when query requires primary source data acquisition — establishes MCP-first + API-first + web-fetch-fallback + web_search-as-discovery priority hierarchy"
      mandatory: true
      applicable_to: ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7"]
      conditional: "Always applicable as source acquisition doctrine — governs how pharmaintel gathers data regardless of task type. Priority hierarchy: Priority 1 MCP tool if available (Clinical Trials MCP, PubMed MCP, bioRxiv MCP, Consensus MCP); Priority 2 public REST API if available (openFDA base URL https://api.fda.gov, ClinicalTrials.gov v2 https://clinicaltrials.gov/api/v2, SEC EDGAR https://data.sec.gov, PMC E-Utilities); Priority 3 web_fetch on primary source URL (FDA documents, EMA EPAR PDFs, sponsor IR pages, Orange/Purple Book); Priority 4 web_search (ONLY for URL discovery, never for verifiable facts). All claims requiring Tier-0 confidence must resolve to primary source via Priority 1-3."
      rationale: "Real-time API Integrations Layer represents fundamental shift in pharmaintel source acquisition epistemology. Historical pharmaintel practice: web_search-dominant with occasional web_fetch on explicit URLs. v3.0.0 doctrine: (a) MCP-first — where connected MCPs (Clinical Trials, PubMed, bioRxiv, Consensus) can answer, they MUST be tried before web_search; (b) API-first — where public REST APIs exist (openFDA /drug/ndc + /drug/event + /drug/label endpoints; ClinicalTrials.gov v2 /studies + /studies/{nct} endpoints with JSON schema; SEC EDGAR /submissions + /company/facts endpoints; PMC E-Utilities esummary + efetch), Claude MUST prefer programmatic fetch over web_search; (c) web_fetch-fallback — when MCP/API unavailable, web_fetch on known primary source URL (e.g. https://www.accessdata.fda.gov/scripts/cder/daf/ for Drugs@FDA; https://www.ema.europa.eu/en/medicines/human/EPAR/ for EPAR); (d) web_search-as-discovery — reserved for discovering URLs when primary source location unknown, NOT for citing claims. api-integrations.md (357 lines) provides: reference payloads for openFDA + ClinicalTrials.gov v2 + SEC EDGAR queries with example URL patterns + JSON response schema descriptions + query pattern templates. Discipline principle: 'web_search as discovery mechanism finding URLs, not knowledge mechanism citing claims.' Without this layer, pharmaintel outputs systematically over-cited web_search + under-cited primary sources — Tier-0 confidence often degraded by secondary source substitution. v3.0.0 release — architectural upgrade to source acquisition discipline."
    - id: G38
      name: "Multi-agent Orchestration Layer activation (orchestration.md) when task requires parallel sub-protocol execution — multi-layer T3 / multi-sponsor sweep / multi-jurisdiction / multi-catalyst watch / complex comparative analyses"
      mandatory: false
      applicable_to: ["T3", "T4", "T5"]
      conditional: "Fires when orchestration provides material efficiency gain over sequential execution. Decision threshold per orchestration.md §1.3: trigger when task requires ≥3 parallel sub-protocol activations OR ≥5 sponsor comparative analyses OR ≥3 jurisdiction analyses OR ≥10 catalyst tracking. Default OFF for single-template queries. Single-layer T2 asset queries + simple T3 modality queries do NOT require orchestration."
      rationale: "Multi-agent Orchestration Layer enables pharmaintel scaling to complex parallel-execution tasks. Sequential sub-protocol execution becomes inefficient when multiple independent sub-protocols need to run (e.g., comparing 10 ADC developers — 10x sponsor-sweep sub-protocol invocations + consolidation). orchestration.md (395 lines) provides: (a) when-to-activate decision threshold (single-layer tasks no orchestration vs multi-layer/multi-sponsor/multi-jurisdiction/multi-catalyst orchestration beneficial), (b) parallel execution patterns (sub-protocol independence assumptions + synchronization points + consolidation strategies), (c) intelligent caching (primary source URL caching for repeat queries + MCP result caching within conversation + web_fetch deduplication), (d) task dependency management (DAG-based dependency graphs for multi-layer T3 where Layer 2 TA analysis depends on Layer 1 modality analysis), (e) error recovery (sub-protocol failure handling + partial-result aggregation + graceful degradation from orchestrated to sequential execution). Primary use cases: multi-modality comparison (ADC vs CAR-T vs bispecific for DLBCL); cross-sponsor sweep (top 10 ADC developers pipelines); multi-jurisdiction analysis (FDA vs EMA vs PMDA vs NMPA positions); layered T3 (HER2+ mBC treatment landscape Layer 0 + Layer 1 ADC + Layer 2 oncology TA); multi-catalyst watch (10+ readout events tracked simultaneously). Without this layer, complex comparative pharmaintel tasks degrade to sequential execution with materially longer response times + higher token costs. v3.0.0 release — runtime coordination framework."
    - id: G41
      name: "Oncology Therapeutic Area T3 Layer-2 template (task-ta-oncology.md) loaded in addition to generic task-modality.md + applicable modality template when query content invokes oncology terminology OR analytical scope addresses cancer drug landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when therapeutic area under T3 analysis is oncology. Default OFF for non-oncology T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being oncology-focused sponsor (Roche Genentech, Merck KGaA, Merck & Co, BMS, AstraZeneca, Pfizer Oncology, Novartis Oncology, AbbVie Oncology, Amgen, Johnson & Johnson, Bayer, Gilead, Daiichi Sankyo) and user memory-derived oncology specialty interest and user geography being oncology trial hub are NOT valid triggers."
      rationale: "Oncology TA has unique disciplines ORTHOGONAL to modality that generic task-modality.md or modality templates cannot cover at sufficient depth: (a) MDT (multidisciplinary team) epistemic framework + NCCN/ESMO/ASCO guideline ecosystem with Category 1/2A/2B/3 evidence + ESMO-MCBS magnitude of benefit scale + Project Orbis international concurrent review (FDA 2019) with parallel submission to Health Canada/TGA/Swissmedic/MHRA/ANVISA/HSA/Israel MoH, (b) FDA Oncology Center of Excellence (OCE) established 2017 per 21st Century Cures Act + key initiatives (Project Optimus 2021 launch with Draft Guidance January 2023 → Final Guidance August 2024 recommending MTD + lower dose Phase II randomization + mandatory PK sampling in all oncology protocols + 93% sponsor strategy impact per surveys; Project FrontRunner 2023 earlier-line migration; Project Renewal older drug label updates; Project Patient Voice PRO integration 2020; Project Equity diversity 2020; Project Facilitate expanded access 2019; Project Community 2023; Project Inclusion eligibility criteria 2023; Project Pragmatica 2023), (c) accelerated approval discipline with oncology dominant user (~50%+ of all accelerated approvals) + 2021-2024 withdrawal wave (Keytruda SCLC 2021 + Opdivo SCLC 2021 + Tecentriq 2L bladder 2021 + Blenrep MM 2022 + Farydak MM 2022 + Istodax PTCL 2021 + Ukoniq marginal zone lymphoma 2022), (d) ODAC (Oncologic Drugs Advisory Committee) advisory votes non-binding but historically highly predictive, (e) oncology-spesifik endpoint hierarchy (OS gold standard + PFS/ORR/DoR/DFS/RFS surrogates with indication-spesifik validity + emerging MRD/pCR/MPR/ctDNA clearance + RECIST 1.1/iRECIST/Lugano/IMWG/IWG/IWRCA criteria + BICR vs investigator assessment + crossover confounding + OS-PFS debate + PRO integration FACT/EORTC QLQ-C30/PRO-CTCAE), (f) modality-spesifik oncology cross-reference layer for all 11 modalities (ADC HER2/TROP2 dominance; cell/gene CAR-T hematologic + emerging solid tumor + TIL melanoma; RNA mRNA cancer vaccines Moderna mRNA-4157; radiopharm Pluvicto/Lutathera; oncolytic melanoma/NMIBC; bispecific T-cell engagers), (g) ICI (immune checkpoint inhibitor) class as dominant oncology paradigm (anti-PD-1 Keytruda/Opdivo/Libtayo/Jemperli/Tevimbra/Loqtorzi + anti-PD-L1 Tecentriq/Imfinzi/Bavencio + anti-CTLA-4 Yervoy/Imjudo + LAG-3 Opdualag + TIGIT Phase 3 mixed SKYSCRAPER-01 failed) with biomarker-stratification (PD-L1 IHC 22C3/SP142/SP263/28-8 clones with indication-spesifik cutoffs + MSI-H/dMMR pan-tumor KEYNOTE-158 enabled tumor-agnostic + TMB-H ≥10 mut/Mb pembrolizumab 2020 tumor-agnostic controversial) + combination paradigm post-2020 dominance (ICI+chemo most common + ICI+targeted + ICI+ICI nivolumab+ipilimumab + ICI+ADC EV-302 pembrolizumab+enfortumab vedotin landmark mUC + ICI+VEGF + ICI+PARP), (h) HTA + access patterns (NICE Cancer Drugs Fund with £30-50K/QALY + end-of-life modifier; HAS ASMR I-V rating; G-BA AMNOG Zusatznutzen; ICER US reference; outcomes-based contracting emerging; Türkiye SGK SUT EK-4/A raporlu ilaç + uzman hekim + ICD-10 uygunluğu + eşdeğer grup biyobenzer/jenerik; NMPA NRDL negotiated pricing), (i) commercial trajectory (~$250B+ global oncology + 10-12% CAGR + anti-PD-(L)1 ~$55B+ Keytruda ~$27B+ FY2024 + ADC ~$10B+ Enhertu trajectory + CAR-T ~$4B + radiopharm ~$2-3B + US WAC $150-300K+ annual typical novel oncology + accelerated approval fragility pricing pressure), (j) pipeline dynamics (KRAS G12C/G12D/pan-KRAS sotorasib Lumakras + adagrasib Krazati + RMC-6236 Revolution Medicines; AKT capivasertib Truqap; CDK4/6 Ibrance/Kisqali/Verzenio + CDK2 emerging; PARP mature; HER3-DXd patritumab deruxtecan; bispecific TCEs expanding beyond hematologic; MAGE-A4/KK-LC-1/NY-ESO-1 TCRs; tumor-agnostic approvals pembrolizumab MSI-H 2017 + larotrectinib NTRK 2018 + entrectinib NTRK 2019 + dostarlimab dMMR 2021 + selpercatinib RET 2024 tumor-agnostic label expansion + repotrectinib NTRK/ROS1 2023). Orthogonal Layer-2 design enables multi-layer T3 analyses e.g. 'T-DXd in HER2+ mBC' invokes Layer 0 generic task-modality.md + Layer 1 task-modality-adc.md + Layer 2 task-ta-oncology.md simultaneously — each layer contributes orthogonal discipline without redundancy. v3.0.0 release — first Layer-2 TA template establishing second orthogonal axis."
    - id: G42
      name: "Autoimmune / Immunology / Inflammation Therapeutic Area T3 Layer-2 template (task-ta-autoimmune.md) loaded in addition to generic task-modality.md + applicable modality template when query content invokes autoimmune/I&I terminology OR analytical scope addresses immunology drug landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when therapeutic area under T3 analysis is autoimmune/I&I. Default OFF for non-I&I T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer with immunology portfolio (AbbVie, JNJ, UCB, Amgen, Novartis, Eli Lilly, Pfizer, Sanofi, Roche) and user memory-derived rheumatology/dermatology/gastroenterology/neurology specialty interest are NOT valid triggers."
      rationale: "Autoimmune TA has unique disciplines ORTHOGONAL to modality that generic task-modality.md or modality templates cannot cover: (a) disease pathophysiology family taxonomy (Th1-driven RA partly + MS partly; Th2-driven atopic dermatitis + asthma + EoE + allergic rhinitis; Th17-driven psoriasis + PsA + AS + HS; mixed/TNF-driven RA + IBD UC+CD + HS; B-cell-driven SLE + MS + RA subset; Type 1 IFN-driven SLE + cutaneous lupus + dermatomyositis) enabling mechanism-to-disease matching, (b) step therapy framework (csDMARDs MTX/SSZ/HCQ/leflunomide for RA + 5-ASA/thiopurines for IBD → tsDMARDs JAK inhibitors/PDE4 → bDMARDs TNF-α/IL-6/IL-17/IL-23/anti-CD20 → advanced biologics emerging BTK/TYK2) with payer-imposed step edit commonly requiring csDMARD failure before biologic access, some jurisdictions requiring TNF-i failure before non-TNF-i biologic, (c) disease-spesifik endpoint frameworks (RA ACR20/50/70 + DAS28 remission + SDAI/CDAI + mTSS radiographic; PsO PASI 75/90/100 + IGA clear + BSA; PsA ACR + PASI + MDA; AS ASAS20/40 + BASDAI; UC Mayo score + mucosal healing endoscopy + fecal calprotectin; CD CDAI + endoscopic healing + SES-CD + TNF trough levels; AD EASI 75/90 + IGA clear + pruritus NRS; MS ARR + EDSS + MRI + NEDA; SLE SRI-4 + BICLA + flare), (d) TNF-α inhibitor class foundational (Humira adalimumab US LOE 2023 biosimilar wave with Amjevita/Cyltezo/Hyrimoz/Hadlima/Abrilada/Idacio/Yusimry/Simlandi + slower-than-expected uptake due to PBM rebate dynamics + citrate-vs-citrate-free formulation; Enbrel etanercept US patent thicket through 2029 vs EU launch 2015/2018; Remicade biosimilars since 2016; Simponi + Cimzia LOE 2024 cross-reference task-modality-fusion.md for Enbrel + task-modality-biosimilar.md for Humira), (e) IL-17/IL-23 class (PsO/PsA/AS) — IL-17A Cosentyx/Taltz; IL-17A+IL-17F dual Bimzelx bimekizumab EMA 2021 FDA 2023 CRL-delayed; IL-17 receptor A Siliq; IL-23 p19 Tremfya/Skyrizi/Ilumya; IL-12/23 p40 Stelara transitioning to p19 preferred + Stelara biosimilars 2025 Wezlana/Selarsdi/Pyzchiva/Otulfi, (f) JAK inhibitor class (Xeljanz/Rinvoq/Olumiant/Cibinqo/Jyseleca) with FDA 2021 BLACK BOX WARNING per ORAL Surveillance post-marketing trial demonstrating CV + malignancy signal — class-effect conclusion applied to entire JAK class cross-reference task-modality-smallmol.md, (g) Th2 axis expanding Dupixent franchise (AD + asthma + EoE + CRSwNP + PN) + IL-5 eosinophilic asthma Nucala/Fasenra/Cinqair + anti-IgE Xolair + anti-TSLP Tezspire, (h) B-cell-targeted therapies (anti-CD20 Rituxan + Ocrevus MS + Kesimpta MS + Briumvi MS + Uplizna NMOSD anti-CD19; BAFF Benlysta SLE + CAR-T in autoimmune investigational Bristol/2seventy/Kyverna/Cabaletta Phase 1/2), (i) S1P modulators Gilenya/Mayzent/Zeposia/Ponvory, (j) emerging mechanisms (TYK2 Sotyktu deucravacitinib + BTK MS investigational evobrutinib failed/remibrutinib/tolebrutinib + FcRn antagonists Vyvgart MG/CIDP + Rystiggo), (k) regional market dynamics (US PBM rebate warfare ~40-60% Humira net price discount + specialty pharmacy dominant + Express Scripts NPF; EU aggressive biosimilar uptake >90% mature anti-TNF + tender-based UK NHS/Nordic/Italy regional; Türkiye SGK SUT EK-4C step therapy 6 ay csDMARD + biyoeşdeğer otomatik geçiş SUT mekaniği + multidisipliner uzman onay + yerli biyobenzer Em Pharma/Abdi İbrahim AbdiBio + yerli jenerik MTX/HCQ/SSZ/leflunomide). Orthogonal Layer-2 design — 'Humira biosimilar landscape in RA' invokes Layer 0 + Layer 1 biosimilar + Layer 2 autoimmune. v3.0.0 release."
    - id: G43
      name: "Rare Disease / Orphan Therapeutic Area T3 Layer-2 template (task-ta-rare-disease.md) loaded in addition to generic task-modality.md + applicable modality template when query content invokes rare disease / orphan drug terminology OR analytical scope addresses rare disease drug landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when therapeutic area under T3 analysis is rare disease / orphan indication. Default OFF for common disease T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being rare disease sponsor (BioMarin, Alexion/AstraZeneca Rare Disease, Sanofi Genzyme, Ultragenyx, Vertex, Sarepta, Ionis, Alnylam, Rocket Pharmaceuticals, Regenxbio, Orchard Therapeutics, Amicus) and user memory-derived rare disease specialty interest are NOT valid triggers."
      rationale: "Rare Disease TA has unique disciplines ORTHOGONAL to modality that generic template cannot cover: (a) regional orphan disease thresholds (US <200,000 prevalence per Orphan Drug Act 1983 ODA; EU <5 per 10,000 per Regulation (EC) No 141/2000; Japan <50,000 per Orphan Drug Act 1993; Türkiye EMA reliance pathway; ultra-rare informal category <1 per 50,000 or 20,000 per NORD) with prevalence hierarchy examples (CF ~30K US + Trikafta/Kaftrio CFTR modulator; SCD ~100K US + Oxbryta/Casgevy/Lyfgenia; hemophilia A ~20K + factor concentrates + Hemlibra bispecific; hemophilia B ~5K + Beqvez/Hemgenix gene therapies; SMA ~10-25K + Spinraza/Zolgensma/Evrysdi; DMD ~15K + Exondys/Vyondys/Amondys/Viltepso/Elevidys; hATTR ~10K + Onpattro/Amvuttra/Tegsedi/Wainua/tafamidis/Attruby; MPS subtypes hundreds + ERT Aldurazyme/Elaprase/Naglazyme/Vimizim/Mepsevii), (b) regulatory pathways (7-year US orphan exclusivity per ODA + 50% tax credit for qualified clinical trial expenses + fee waivers PDUFA + Orphan Designation fast review; 10-year EU market exclusivity per Regulation 141/2000 + protocol assistance + fee reductions + Pediatric Use Marketing Authorization PUMA extends by 2 years; Japan 10-year reexamination period), (c) Rare Pediatric Disease Priority Review Voucher (RPD-PRV) market (created FDCA §529 2012 + sunset March 2024 reinstated; $50-500M tradeable secondary market; notable transactions Gilead $125M for Tumeyzo PRV 2015 + Bluebird $100M for Zynteglo 2022 + Sarepta $111M 2022), (d) accelerated approval with surrogate endpoints — serum TTR reduction for hATTR enabling Onpattro/Amvuttra/Tegsedi/Wainua approvals; dystrophin protein expression for DMD enabling Sarepta exon-skipping ASO approvals (cross-reference task-modality-rna.md); fetal hemoglobin HbF induction for SCD/β-thalassemia enabling Casgevy approval, (e) small-N trial design disciplines (single-arm studies without placebo control; natural history studies as external controls; master protocols for multiple rare disease subtypes; external synthetic controls from registries; Bayesian adaptive trial designs for information-borrowing across populations; FDA Office of Rare Diseases engagement + patient-focused drug development PFDD), (f) modality distribution concentration in rare disease — gene therapy dominates (Luxturna RPE65 biallelic retinal dystrophy 2017 + Zolgensma SMA 2019 + Hemgenix hemophilia B 2022 + Roctavian hemophilia A 2023 + Elevidys DMD 2023 + Casgevy SCD/β-thal 2023 first CRISPR + Lyfgenia SCD 2023 + Skysona CALD 2022 + Beqvez hemophilia B 2024 withdrawn 2025 cross-reference task-modality-cellgene.md); RNA therapeutics heavily rare (Spinraza SMA 2016 intrathecal ASO + Tofersen SOD1-ALS 2023 + Exondys 51 DMD + Onpattro/Amvuttra hATTR siRNA + Givlaari AHP + Oxlumo PH1 cross-reference task-modality-rna.md); ERT for lysosomal storage diseases (Gaucher Cerezyme + Fabry Fabrazyme/Galafold + Pompe Myozyme/Lumizyme/Nexviazyme + MPS I Aldurazyme + MPS II Elaprase + MPS IVA Vimizim + MPS VI Naglazyme + MPS VII Mepsevii + hypophosphatasia Strensiq + LAL-D Kanuma); chaperone + CFTR modulator Trikafta/Kaftrio cross-reference task-modality-smallmol.md; small molecule targeted; factor concentrates + Hemlibra bispecific hemophilia A cross-reference task-modality-fusion.md, (g) commercial dynamics (ultra-high pricing $850K-$3.5M gene therapy single-dose + $200-500K annual ERT long-term + outcomes-based contracting emerging + annuity payment structures Zolgensma precedent + Germany rare disease fund + FDA Orphan Drug status preservation), (h) Türkiye market (TİTCK onay EMA reliance dominant + SGK yurt dışı ilaç dairesi yabancı kaynaklı nadir ilaç karşılama + Hacettepe/Gazi/İstanbul Üniversitesi/Marmara/Ankara Üniversitesi tertiary merkez konsey yetkisi + hemoglobinopati yüksek insidans Türk popülasyonunda SCD/β-talasemi + akraba evlilik faktörü otozomal resesif rare disease insidansı arttırıcı). Orthogonal Layer-2 design — 'Casgevy SCD landscape' invokes Layer 0 + Layer 1 cellgene + Layer 2 rare-disease; 'Onpattro hATTR' invokes Layer 0 + Layer 1 RNA + Layer 2 rare-disease + Layer 2 metabolic (ATTR cardiomyopathy cross-reference). v3.0.0 release."
