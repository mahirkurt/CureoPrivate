# ============================================================================
# Skill Manifest Protocol v1.0 — pharmaintel
# ============================================================================
# Declares pharmaintel's composability contract for SMP-compliant discovery.
# Enables smp-orchestrator to auto-suggest composition pipelines with
# medsearch (upstream) and carbon-html-report / carbon-pptx (downstream).
# ============================================================================

manifest_version: "1.0"
protocol_reference: "./SMP-v1.0"  # See smp-orchestrator/examples/SKILL_MANIFEST_PROTOCOL.md

# --- Skill Identity ----------------------------------------------------------
skill:
  name: pharmaintel
  version: "8.1.0"
  title: "Pharmaceutical Commercial & Regulatory Intelligence Orchestrator"
  description: >
    Free-tier pharmaceutical intelligence orchestrator for global commercial,
    regulatory, pipeline, and catalyst analysis. Coordinates FDA, EMA,
    ClinicalTrials.gov, SEC EDGAR, Orange/Purple Book, DailyMed, FAERS,
    Google Patents, NICE, ICER, IQVIA Institute free reports, and free-tier
    industry media (FiercePharma, BioPharma Dive, Endpoints free, Evaluate
    Vantage free, BioPharma Catalyst) with MCP connectors (Exa, Tavily, Fetch,
    PubMed, Paper Search, Clinical Trials, bioRxiv, Consensus, Scholar Gateway).
    Produces provenance-stamped Markdown reports with two-source triangulation
    and explicit confidence ratings. Eight canonical task types: company
    deep-dive, asset profile, modality landscape, deal dissection, catalyst
    watch, head-to-head comparison, regulatory snapshot, pipeline inventory.
    Complementary to medsearch (scientific evidence synthesis).
  author: "Mahir (internal skill)"
  license: "Internal skill asset, not for external redistribution"
  entry_point: "./SKILL.md"
  homepage: null

# --- Classification ----------------------------------------------------------
classification:
  primary_category: "competitive-intelligence"
  secondary_categories:
    - "regulatory-intelligence"
    - "commercial-intelligence"
    - "pipeline-analysis"
    - "catalyst-tracking"
    - "medical-affairs-support"
    - "business-development-support"
  tags:
    - pharma-ci
    - biotech-intelligence
    - fda
    - ema
    - clinicaltrials-gov
    - sec-edgar
    - pipeline-mapping
    - modality-landscape
    - deal-analysis
    - catalyst-watch
    - head-to-head
    - free-tier-only
    - mcp-orchestrator
    - provenance-stamped

# --- Supported Content Domains -----------------------------------------------
# Aligns with carbon-html-report's SEMANTIC_ICON_MAP domains for downstream
# composition.
domains:
  - medical_pharmaceutical
  - financial_commercial
  - legal_regulatory
  - scientific_research

# --- Input Contract ----------------------------------------------------------
inputs:
  - id: query_specification
    required: true
    description: >
      Natural-language query specifying the subject (company, asset, modality,
      deal, catalyst watchlist, comparison pair) and task type. Pharmaintel's
      routing layer classifies into T1-T8.
    mime_types:
      - "text/plain"
    language_hints:
      - en
      - tr
    semantic_requirements:
      - "Must name at least one concrete subject (company, INN/brand, modality
         keyword, ticker, deal party names)"
      - "Task type is auto-inferred from trigger patterns; may be explicit
         (e.g., 'deep-dive on Pfizer') or implicit (e.g., 'what's happening
         with BCMA CAR-T')"

  - id: medsearch_output
    required: false
    description: >
      Optional upstream output from medsearch (scientific evidence synthesis).
      When provided, pharmaintel uses it as the scientific foundation layer
      and focuses its own output on commercial/regulatory/pipeline/catalyst.
    mime_types:
      - "text/markdown"
    schema:
      evidence_summary: "string (markdown)"
      citations: "list of DOIs/NCTs"
      confidence_grading: "GRADE-level or similar"

  - id: watchlist_specification
    required: false
    description: >
      Optional watchlist definition for T5 Catalyst Watch mode. List of
      tickers, companies, assets, or therapeutic areas to monitor.
    mime_types:
      - "application/json"
      - "text/plain"
    schema:
      tickers: "list of ticker symbols"
      companies: "list of company names"
      assets: "list of INN/brand/code"
      therapeutic_areas: "list of TA names"
      refresh_cadence: "enum [weekly, monthly, on-demand]"

# --- Output Contract ---------------------------------------------------------
outputs:
  - id: intelligence_report_markdown
    description: >
      Provenance-stamped Markdown report with four-part source citation
      (type + ID/URL + accessed date + confidence) per material claim, plus
      explicit triangulation notes and §Limitations block.
    mime_type: "text/markdown"
    features:
      - "Meta-block (report_type, subject, data_cutoff, version, sources_tier)"
      - "Executive summary + task-specific body"
      - "Per-claim provenance stamp (4-part)"
      - "Two-source triangulation rule enforcement"
      - "Confidence rating (High/Medium/Low/Unknown) per material claim"
      - "Explicit §Limitations block naming free-tier gaps"
      - "Consolidated §References in canonical format"
      - "Downstream-composable (feeds carbon-html-report / carbon-pptx)"

  - id: catalyst_watchlist_json
    description: >
      Structured JSON output for T5 Catalyst Watch recurring-monitoring mode,
      enabling downstream agent/automation consumption.
    mime_type: "application/json"
    optional: true
    features:
      - "Time-bucketed (next 30d, 30-90d, 90d-12mo)"
      - "Per-catalyst type taxonomy (PDUFA/CHMP/AdComm/readout/earnings/...)"
      - "Significance rating (Critical/High/Medium/Low)"
      - "Per-row source stamp"

# --- Composition — Upstream Compatibility ------------------------------------
composition:
  pipe_from:
    - skill: medsearch
      version_constraint: ">=1.0"
      rationale: >
        medsearch produces structured scientific evidence synthesis from
        peer-reviewed literature, trials registries, and guideline bodies.
        pharmaintel accepts medsearch's Markdown output as its scientific
        foundation layer and wraps commercial/regulatory/pipeline/catalyst
        frame around it. Typical pattern: medsearch answers "what does the
        evidence say about asset X?" and pharmaintel then answers "who owns
        X, where does it stand regulatorily, what is its commercial
        trajectory, and what are near-term catalysts?"
      intermediate_format: "text/markdown"

  # --- Downstream compatibility ---
  pipe_to:
    - skill: carbon-html-report
      version_constraint: ">=6.0"
      rationale: >
        pharmaintel produces Markdown with domain='medical_pharmaceutical'
        (plus 'financial_commercial' and 'legal_regulatory'). carbon-html-report
        formats this into print-ready Carbon Design System HTML / PDF for
        publication-grade distribution.
      intermediate_format: "text/markdown"

    - skill: carbon-pptx
      version_constraint: ">=1.0"
      rationale: >
        pharmaintel produces structured Markdown suitable for carbon-pptx's
        Marp-based deck generation. Medical affairs briefings, KOL
        pre-meeting packages, and investor committee presentations are
        typical downstream use cases.
      intermediate_format: "text/markdown"

# --- Runtime Requirements ----------------------------------------------------
runtime:
  mcp_connectors:
    required:
      - name: "Fetch"
        purpose: "Direct retrieval of canonical regulatory and IR pages"
      - name: "Exa"
        purpose: "Semantic web search + full-text extraction"
      - name: "Tavily"
        purpose: "Real-time news and finance-topic search"
      - name: "PubMed"
        purpose: "Peer-reviewed biomedical literature"
      - name: "Clinical Trials"
        purpose: "Registered trial discovery + structured queries"
    optional:
      - name: "Paper Search"
        purpose: "Multi-source academic aggregation (broader discovery)"
      - name: "bioRxiv"
        purpose: "Preprint signal detection"
      - name: "Consensus"
        purpose: "Evidence-synthesis yes/no verdicts"
      - name: "Scholar Gateway"
        purpose: "Semantic reformulation of academic queries"
  python:
    version: ">=3.8"
    packages: []  # No Python packages required for core operation

# --- Verification Contract ---------------------------------------------------
# pharmaintel's quality gates are process-level, not output-artifact-level
# (unlike carbon-html-report's HTML validation). These are enforced by the
# skill's workflow in SKILL.md §"Mandatory Execution Protocol".
verification:
  process_gates:
    - id: G1
      name: "Query classified into canonical task type (T1-T8)"
      mandatory: true
    - id: G2
      name: "Terminology glossary built (INN + brand + dev code + target)"
      mandatory: true
      applicable_to: ["T2", "T6"]
    - id: G3
      name: "Two-source triangulation applied per material claim"
      mandatory: true
    - id: G4
      name: "Per-claim provenance stamp (4-part) present"
      mandatory: true
    - id: G5
      name: "Confidence rubric applied (H/M/L/U)"
      mandatory: true
    - id: G6
      name: "§Limitations block present and substantive"
      mandatory: true
    - id: G7
      name: "Data cutoff date present"
      mandatory: true
    - id: G8
      name: "No paid-only sources cited as primary"
      mandatory: true
    - id: G9
      name: "MNPI / leaked / embargo-violating sources excluded"
      mandatory: true
    - id: G10
      name: "Peer-review check completed for pivotal-trial readouts (PubMed / Paper Search query run)"
      mandatory: true
      applicable_to: ["T2", "T3", "T5", "T6"]
      rationale: "Sponsor PR numbers often diverge from peer-reviewed publication numbers. When a peer-reviewed primary exists, it overrides the PR per triangulation.md §6.1."
    - id: G11
      name: "Statutory filing layer attempted for PDUFA dates, deal terms, and sales figures (SEC 8-K/10-K/10-Q or equivalent)"
      mandatory: true
      applicable_to: ["T1", "T4", "T5"]
      rationale: "Industry media aggregations can lag or diverge from sponsor statutory disclosure. Step 1d enforces this check."
    - id: G12
      name: "Scope window + resolution status verified per entry (no out-of-window parking; no unknown-outcome rows in 'Recently resolved')"
      mandatory: true
      applicable_to: ["T5"]
      rationale: "Observed in v1.0.1 post-mortem: out-of-window items and unknown-outcome PDUFAs leaked into wrong tables. Table discipline is codified in task-catalyst.md."
    - id: G13
      name: "Confidence Disclosure Table present (H/M/L/U distribution explicit)"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T4", "T5", "T6", "T8"]
      rationale: "Reports without explicit confidence distribution can visually 'look High throughout' when 40%+ of claims are actually Medium or Low. Forces the author to confront actual distribution before shipping. Waived only for reports with <10 material claims (typically T7 Regulatory Snapshot)."
    - id: G14
      name: "Sponsor Sweep executed and §Sponsor Sweep Disclosure block present when trigger rules fire"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T4", "T5", "T6", "T8"]
      rationale: "MCP primary sources (Clinical Trials, PubMed, SEC EDGAR) do not replace corporate-site depth. Sponsor pipeline pages, press releases, and IR materials carry indication scope, forward guidance, and deal-timing signals unreachable elsewhere. Waived for T7 Regulatory Snapshot and for pure-methodology queries routed to medsearch."
    - id: G15
      name: "Label & Post-Marketing Safety sub-protocol executed for approved assets in scope"
      mandatory: true
      applicable_to: ["T2", "T3", "T5", "T6", "T7"]
      rationale: "Medical affairs and KOL briefing use cases require operational label detail (dosing, boxed warnings, REMS, monitoring) beyond approval date + indication summary. FAERS disproportionality check completes post-marketing safety picture. Waived when no approved asset is in scope (pipeline-only landscape)."
    - id: G16
      name: "Commercial & Payer Context section populated per task-modality.md §8 (or task-asset.md §6-7 for single asset)"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T6", "T8"]
      rationale: "Pipeline and regulatory detail alone do not support Medical Affairs + BU decision-making. Revenue, launch trajectory, pricing architecture, payer reality, and market share dynamics are essential strategic context. Waived for T4 (deal-specific), T5 (catalyst-specific), T7 (label-specific) where a different analytical emphasis is native."
    - id: G17
      name: "Semantic auto-trigger evaluation (Step 1g) executed and §Auto-Trigger Disclosure block present"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T4", "T5", "T6", "T8"]
      rationale: "Users should not be required to know which keywords trigger which layers. Skill must read content semantically — rare disease, gene therapy, Japanese sponsor, first-in-class FDA approval — and infer correct depth. v1.4.0 SMA report missed HTA layer entirely because user did not say 'NICE / CADTH'; rare disease + high-cost gene therapy profile should have auto-triggered HTA. Conservative principle: ambiguous match → load. Disclosure makes inference auditable."
    - id: G18
      name: "Geography Verification Guard (triangulation.md §10) applied to every regional claim"
      mandatory: true
      applicable_to: ["T2", "T3", "T5", "T6"]
      rationale: "Promoted from T5-only (v1.1.0) to global cross-task in v1.5.0. Generic regional inference without registry verification is a recurrent failure mode. Every claim about regional access, pivotal trial site participation, EU country tier, LMIC access requires primary registry/regulatory verification. Phrasing templates per outcome documented."
    - id: G19
      name: "Multi-audience executive summary rendering (when triggered) preserves shared evidence base across MA / Commercial / Payer variants"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T6", "T8"]
      conditional: "Only fires when multi-audience rendering is invoked; not all reports require it."
      rationale: "Three-variant executive summary (Medical Affairs / Commercial-BU / Payer-HEOR) MUST share the same evidence base, claims, confidence ratings, citations, and limitations. The variants differ in framing emphasis only, NOT in factual content. Without this discipline, multi-audience summaries become three contradictory narratives."
    - id: G20
      name: "NMPA sub-protocol executed when Chinese sponsor or NMPA / NRDL / VBP content in scope"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T4", "T5", "T6", "T8"]
      conditional: "Only fires when Chinese sponsor, NMPA approval, NRDL listing, VBP exposure, or multinational sponsor's China operation is materially in scope."
      rationale: "Chinese regulatory + reimbursement system (NMPA + NHSA / NRDL + VBP) is Mandarin-primary; English summary lagged 2-8 weeks and incomplete. Provincial reimbursement variance + VBP cycle unpredictability + conditional approval framework all require dedicated sub-protocol depth. Mandarin terminology preservation (审评报告, 国谈, 集采, 优先审评, 附条件批准) is a translation-fidelity requirement."
    - id: G21
      name: "Türkiye sub-protocol executed when Turkey-specific regulatory / reimbursement / sponsor / market access content in scope"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T5", "T6", "T8"]
      conditional: "Only fires when Türkiye-specific layer is invoked (explicit keyword OR Turkey query-content match — NOT user identity per v1.7.0). Default OFF — global scope is preserved unless Türkiye is materially in scope."
      rationale: "TİTCK + SGK / SUT framework is sui generis (not a simple parallel of FDA / EMA / NICE). Türkçe regulatuar terminology requires faithful preservation. Sub-protocol provides discipline. v1.7.0 amendment: trigger logic fixed to be query-content-based only (user identity is NOT a valid trigger source per generic-by-default.md Article 5)."
    - id: G22
      name: "Generic-By-Default audit (8 checks per generic-by-default.md Article 6) executed forward at Step 1h and backward at Step 5b before delivery; backward audit automated via mandatory script invocation in v1.7.1+"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8"]
      rationale: "v1.6.0 production test (T-DXd asset profile) revealed 9 distinct customization leak categories: direct user address, user-employer strategic action recommendations, user-employer-fitted intended use declarations, user-employer-internal terminology in audience framing, user-employer competitive scope alignment, user-context auto-trigger rationale, coverage anchor asymmetry, audience framing leak, sub-protocol auto-trigger user-identity-tabanlı. G22 is the systematic countermeasure: 8 programmatic checks executed at Step 1h (forward, before Phase 2 Discovery) and Step 5b (backward, before report delivery). v1.7.1 amendment: backward audit (Step 5b) is now automated via mandatory invocation of scripts/validate-report-discipline.py with --json output parsing; manual self-audit serves as fallback when script unavailable. False-positive handling via documented '# G22-OVERRIDE: G22.X — rationale' annotations + --accept-overrides flag preserves audit transparency while allowing legitimate sponsor identification in competitive landscapes. v1.7.0 + v1.7.1 production tests: T-DXd asset profile (full report) 8/8 PASS; multi-audience exec summary (Test Scenario A) 8/8 PASS; Türkiye sub-protocol legitimately triggered (Test Scenario B) 8/8 PASS; override mechanism functional test verified."
    - id: G23
      name: "Catalyst Watch sub-protocol executed when query-content terminology invokes catalyst events (PDUFA, CHMP, AdComm, readout, earnings, guidance, milestone) OR when asset under analysis has scheduled near-term catalyst within 12 months"
      mandatory: true
      applicable_to: ["T1", "T2", "T3", "T5", "T6"]
      conditional: "Only fires when catalyst-watch terminology in query OR asset has scheduled near-term catalyst per public sponsor disclosure. Default OFF — non-catalyst queries do not invoke. Trigger logic query-content-based per generic-by-default.md Article 5; user investment portfolio inferences and user-employer competitive interest are NOT valid triggers."
      rationale: "Pharmaceutical catalysts are discrete events with material informational content. Each catalyst type (PDUFA / CHMP / readout / AdComm / earnings) has its own source hierarchy, temporal precision discipline, hit-vs-miss interpretation, and signal-vs-noise classification. Without sub-protocol-catalyst-watch.md, common errors include: (a) precision degradation (converting 'PDUFA goal date August 15' → 'Q3 2026' or vice versa), (b) conflating CHMP positive opinion with EC market authorization (different dates by ~67 days), (c) treating 'PFS positive, OS immature' as 'OS hit', (d) interpreting AdComm vote as binding (when FDA decision can diverge), (e) confusing manufacturing supply revenue with end-customer commercial sales (Hutchmed ELUNATE case). Sub-protocol provides discipline. v1.8.0 release."
    - id: G24
      name: "T6-Defense well-formedness audit (6 checks per task-comparison-defense.md §7) executed when T6-Defense sub-mode is activated; ensures selective override pattern, mandatory symmetric framing, and triple disclosure are all well-formed"
      mandatory: true
      applicable_to: ["T6"]
      conditional: "Only fires when T6 task is invoked AND T6-Defense sub-mode is activated by explicit query-content trigger (per task-comparison-defense.md §1). Default OFF for standard sponsor-agnostic T6. Activation source must be explicit; semantic auto-trigger and user-identity inference are NOT valid activation paths."
      rationale: "T6-Defense is the single permitted exception to generic-by-default discipline (per generic-by-default.md Article 3.4 v1.8.0+). The exception is narrow and conditional: selective 2-of-8 G22 override (G22.4 + G22.7) within designated §10.B / §10.C Strategic Implications sections only, with mandatory symmetric framing (parallel competitor perspective section) and mandatory triple disclosure (activation source + sponsor + competitive target + override scope). Without G24 enforcement, T6-Defense activation could be malformed (one-sided sponsor advocacy, missing parallel section, missing disclosure) — which would erode the v1.7.0 generic-by-default discipline established to prevent customization leaks. G24 audit's 6 checks: (1) activation source cited in Provenance, (2) at least one §1.1 explicit trigger present in activation source, (3) §10.B [Sponsor X] section present and annotated, (4) §10.C [Sponsor Z] section present (symmetric requirement), (5) §10.A standard sponsor-agnostic implications also present (preserved discipline), (6) all other sections sponsor-agnostic per generic-by-default. Failure of any G24 check requires either fix or fallback to standard T6. v1.8.0 release."
    - id: G25
      name: "Biosimilar T3 modality template (task-modality-biosimilar.md) loaded in addition to generic task-modality.md when query content invokes biosimilar/follow-on biologics terminology OR analytical scope addresses post-LOE biological reference product landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is biosimilar/follow-on biologics. Default OFF for non-biosimilar T3 queries (small molecule modality, ADC modality, CAR-T modality, etc.). Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a biosimilar manufacturer (e.g. Em Pharma, Sandoz, Celltrion, Samsung Bioepis, Coherus, Amgen biosimilars division, Hetero, Biocon) and user geography being a biosimilar manufacturing hub (Türkiye, India, South Korea) are NOT valid triggers."
      rationale: "Biosimilar modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) BPCIA exclusivity arithmetic (12-year reference product exclusivity, 4-year application acceptance bar, first interchangeable exclusivity tiered triggers per BPCIA §351(k)(6)), (b) abbreviated 351(k) regulatory pathway including totality-of-evidence framework and patent dance (BPCIA §351(l)) procedural mechanics, (c) FDA interchangeability designation framework with switching study disciplines and June 2024 draft guidance update reducing burden, (d) Purple Book vs Orange Book distinction, (e) EMA pathway with 8+2+1 exclusivity model and 2025 tailored clinical approach reflection paper (EMA/CHMP/BMWP/60916/2025), (f) MHRA 2021 streamlined CES-optional pathway, (g) manufacturing Critical Quality Attributes characterization framework (ICH Q5E/Q8/Q9/Q10/Q11) and comparability range concept and 'manufacturing process IS the product' principle, (h) immunogenicity discipline including ADA NAb endpoints and switching study design, (i) FDA 4-letter suffix naming convention and EMA INN approach and Türkiye INN nomenclature, (j) WAC discount bands by jurisdiction (US 15-25% first / 50-80% mature; EU 20-30% / 50-70%; Japan 30% statutory; Türkiye %28 statutory + biyoeşdeğer grup SUT mechanic), (k) tender-vs-rebate market dynamics and class-by-class uptake variance, (l) Türk yerli sponsor ekosistemi (Em Pharma, Abdi İbrahim, Atabay, Nobel İlaç, Pharmactive). Without this template, biosimilar T3 reports would lack BPCIA exclusivity arithmetic, miss interchangeability discipline, conflate WAC vs net price, and fail to address Türk yerli üretim ekosistemi properly. v2.0.0 release. Establishes architectural pattern that future modality-spesifik T3 templates may follow (small molecule, ADC, CAR-T, mRNA, gene therapy)."
    - id: G26
      name: "ADC T3 modality template (task-modality-adc.md) loaded in addition to generic task-modality.md when query content invokes antibody-drug conjugate terminology OR analytical scope addresses HER2/TROP2/Nectin-4/B7-H4/CEACAM5/FRα ADC-rich target landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is ADC. Default OFF for non-ADC T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being an ADC developer (Daiichi Sankyo, AstraZeneca, Roche, Pfizer/Seagen, Gilead, ImmunoGen/AbbVie, ADC Therapeutics, Mersana) is NOT a valid trigger."
      rationale: "ADC modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) 3-component architecture mAb + linker + payload as composite molecular entity (NOT biosimilar of antibody backbone), (b) Drug-Antibody Ratio (DAR) categories with low/moderate/high distribution and PK-toxicity tradeoffs, (c) payload class taxonomy (microtubule inhibitors DM1/DM4/MMAE/MMAF; DNA-damaging calicheamicin/PBD; TOP1 inhibitors DXd/SN-38/exatecan derivatives; emerging immune agonist payloads), (d) cleavable vs non-cleavable linker chemistry with bystander effect implications, (e) DXd-spesifik ILD ~10-15% class effect with mandatory monitoring discipline (chest CT + PFT + immediate discontinuation grade 2+), (f) FDA BLA pathway + companion diagnostic complexity (HER2 IHC for T-DM1/T-DXd; PSMA-PET for radiopharm), (g) 3-step manufacturing complexity with conjugation chemistry (lysine random / cysteine partial-reduction / site-spesifik) and CMC analytical disciplines (DAR distribution + free payload + aggregation), (h) blockbuster ADC commercial trajectories (Enhertu $3.5B+, Adcetris $2B, Kadcyla $2B declining post-T-DXd, Padcev $1.5B+, Trodelvy $1.2B, Polivy $1B), (i) target landscape concentration on HER2/TROP2/Nectin-4 with bispecific ADCs as emerging architectural direction. Without this template, ADC T3 reports would conflate same-antibody ADCs (T-DM1 vs T-DXd treated as equivalent), miss DXd ILD discipline, fail to distinguish DAR generations. v2.5.0 release."
    - id: G27
      name: "Cell & Gene Therapy T3 modality template (task-modality-cellgene.md) loaded in addition to generic task-modality.md when query content invokes CAR-T/TCR-T/NK/AAV/lentiviral/CRISPR/in vivo CRISPR terminology OR ATMP regulatory framework analysis"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is cell or gene therapy. Default OFF for non-cell/gene T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a cell/gene therapy developer (Gilead/Kite, BMS, Novartis, Vertex, BluebirdBio, Sarepta, BioMarin, Janssen + Legend) is NOT a valid trigger."
      rationale: "Cell/gene modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) cell vs gene therapy taxonomy (autologous CAR-T / allogeneic / in vivo AAV / ex vivo lentiviral / ex vivo CRISPR / in vivo CRISPR mRNA-LNP), (b) EMA ATMP framework per Regulation (EC) No 1394/2007 + Committee for Advanced Therapies (CAT), (c) patient = product complication for autologous (no scale economies, vein-to-vein 3-5 weeks as commercial KPI, manufacturing failure rate 5-15%), (d) CAR-T construct architecture (4 generations + CD28 vs 4-1BB costimulation tradeoffs), (e) 7 approved CAR-T landscape (Kymriah 2017-08, Yescarta 2017-10, Tecartus 2020-07, Breyanzi 2021-02, Abecma 2021-03, Carvykti 2022-02, Aucatzyl 2024-11), (f) CRS + ICANS class effects with ASTCT consensus grading + tocilizumab vs corticosteroid management discipline (ICANS does NOT respond to anti-IL-6R), (g) FDA REMS programs requiring certified treatment centers, (h) AAV serotype tropism (AAV2/5/8/9) + class limitations (pre-existing immunity 30-70%, hepatotoxicity, TMA black box for Zolgensma, episomal non-integration), (i) 6 approved AAV gene therapy landscape (Luxturna 2017-12, Zolgensma 2019-05, Hemgenix 2022-11, Roctavian 2023-06, Elevidys 2023-06), (j) gene editing CRISPR class with Casgevy first-in-class FDA 2023-12-08 milestone (BLA 125782; Vertex+CRISPR 60/40 economic split; CLIMB-121 + CLIMB-131 trials; AdComm October 31 2023 favorable on off-target analysis), (k) emerging gene editing platforms (base editing Beam/Verve, prime editing Prime Medicine, in vivo CRISPR Intellia NTLA-2001 ATTR-CM + NTLA-2002 HAE), (l) regulatory pathway (FDA CBER OTP + RMAT designation per 21st Century Cures Act 2016; EMA CAT; PMDA Sakigake; NMPA), (m) pricing $850K-$3.5M per dose with outcomes-based contracting. Without this template, cell/gene T3 reports would conflate gene therapy with gene editing, miss CRS/ICANS management distinction, fail to address ATMP framework. v2.5.0 release."
    - id: G28
      name: "RNA Therapeutics T3 modality template (task-modality-rna.md) loaded in addition to generic task-modality.md when query content invokes mRNA/siRNA/ASO/miRNA/saRNA/circRNA/in vivo CRISPR mRNA terminology OR LNP/GalNAc delivery system analysis"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is RNA therapeutic. Default OFF for non-RNA T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being an RNA platform developer (Moderna, BioNTech, Alnylam, Ionis, Sarepta) is NOT a valid trigger."
      rationale: "RNA modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) 7-class taxonomy (mRNA / siRNA / ASO Gapmer RNase H / ASO splice modulator / miRNA / saRNA / circRNA / in vivo CRISPR mRNA), (b) delivery system disciplines including LNP composition (ionizable lipid + cholesterol + PEG-lipid + DSPC) with Acuitas + Genevant + Moderna IP, GalNAc-ASGPR hepatic targeting tri-antennary ligand, ASO PS-MOE chemistry, intrathecal (Spinraza) + intravitreal (former Fomivirsen) routes, (c) approved landscape (9 ASOs from Fomivirsen 1998 through Tofersen 2023 including Sarepta DMD ASO controversy + 6 siRNAs from Patisiran 2018 through Nedosiran 2023 with Alnylam franchise dominance + 3 mRNA vaccines Comirnaty BLA 125742 Aug 2021 + Spikevax BLA 125752 Jan 2022 + mRESVIA 2024), (d) class-spesifik effects (ASO PS-related thrombocytopenia particularly Tegsedi/Waylivra; siRNA hepatic safety with modern GalNAc generation; mRNA vaccine reactogenicity + myocarditis signal in young males), (e) regulatory pathway (CBER for mRNA vaccines + therapeutic mRNA; CDER for chemically synthesized siRNA + ASO; cross-CBER/CDER coordination for sponsor portfolios; accelerated approval discipline; post-COVID platform technology framework), (f) manufacturing (oligonucleotide solid-phase phosphoramidite synthesis with Agilent/Avecia/Bachem CMOs; IVT mRNA + LNP encapsulation post-COVID capacity expansion; LNP IP litigation Alnylam vs Moderna + Acuitas vs Pfizer/BioNTech), (g) commercial trajectory (mRNA vaccine pandemic-era $55B peak across Comirnaty + Spikevax then declining; siRNA Alnylam franchise approaching $2B+ with Leqvio cardiovascular potential blockbuster; ASO Spinraza historical ~$1.5B peak), (h) pipeline horizon (RNA editing ADAR via Wave/Korro/ProQR; mRNA cancer vaccines Moderna mRNA-4157 + KEYNOTE-942; in vivo CRISPR Intellia NTLA-2001/NTLA-2002 + Verve VERVE-101 PCSK9 base editing). Without this template, RNA T3 reports would conflate ASO Gapmer (RNase H) with steric block ASO (splice modulation), generalize mRNA vaccine class safety to therapeutic mRNA, miss CBER/CDER classification crosswalk. v2.5.0 release."
    - id: G29
      name: "Radiopharmaceutical / Radioligand Therapy T3 modality template (task-modality-radiopharm.md) loaded in addition to generic task-modality.md when query content invokes radiopharm/RLT/theranostic/Lu-177/Ac-225/PSMA-PET terminology OR isotope supply chain analysis"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is radiopharmaceutical / radioligand therapy. Default OFF for non-radiopharm T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a radiopharm developer (Novartis/AAA, Bayer, BMS/RayzeBio, AstraZeneca/Fusion, Lilly/POINT, Curium, ITM Isotopen, Lantheus, Telix Pharmaceuticals) is NOT a valid trigger."
      rationale: "Radiopharm modality has unique disciplines that generic task-modality.md cannot cover at sufficient depth: (a) 3-component architecture (targeting vector peptide/mAb/small molecule + bifunctional chelator DOTA/NOTA/DTPA + radioactive isotope), (b) theranostic pair concept with diagnostic isotope (Ga-68 PET / F-18 PET) for patient selection + therapeutic isotope (Lu-177 β−, Ac-225 α, Y-90 β−) for treatment in same vector, (c) isotope class taxonomy with β− emitters (Lu-177 6.6 days, I-131 8.0 days, Y-90 64.1 hours, Sm-153, Sr-89) + α emitters (Ra-223 11.4 days, Ac-225 9.9 days with decay chain, Pb-212, Th-227, At-211) + β+ diagnostics (Ga-68 67.7 min generator, F-18 110 min cyclotron, Cu-64, Zr-89) + emerging Auger electron emitters, (d) approved RLT landscape (I-131 since 1940s, Quadramet 1997, Metastron 1993, Zevalin 2002, Bexxar 2003 withdrawn, Xofigo 2013, Lutathera 2018 NETTER-1, Pluvicto 2022-03-23 + 2025-03-28 PSMAfore label expansion), (e) Pluvicto commercial precedent per VISION trial (Sartor O et al. NEJM 2021;385:1091-103; mPFS HR 0.40 95% CI 0.29-0.57; mOS HR 0.62 95% CI 0.52-0.74), (f) isotope supply chain disciplines (Lu-177 n.c.a. via Yb-176 reactor irradiation with ITM Isotopen-Endocyte/Novartis March 2020 supply agreement; Ac-225 global scarcity ~1.7 Ci/year from Th-229 decay stockpile + emerging cyclotron Th-232 + linear accelerator Ra-226 production; Ga-68 generator Ge-68/Ga-68 vs cyclotron production), (g) dosimetry as PK replacement (absorbed dose Gy concept; dose-limiting organs salivary glands xerostomia + kidneys nephrotoxicity for PSMA + bone marrow; lysine-arginine renal protection ~50% kidney dose reduction; theranostic dosimetry workflow with sequential SPECT/CT + time-activity curve), (h) regulatory framework (FDA DIRM/OND + NRC licensing per 10 CFR 35 + Authorized User physician training + ALARA + NDA pathway for small molecule radiopharms + companion diagnostic requirement for Pluvicto; EMA + Council Directive 2013/59/Euratom basic safety standards), (i) manufacturing footprint (Novartis Ivrea + Millburn NJ + Indianapolis IN + Zaragoza Spain), (j) 2022 Pluvicto supply crisis case study (May 2022 voluntary production halt due to quality issues; FDA shortage classification only resolved late 2023), (k) 2023-2024 Big Pharma radiopharm M&A wave (BMS/RayzeBio December 2023 ~$4.1B; Lilly/POINT Biopharma October 2023 ~$1.4B; AstraZeneca/Fusion Pharmaceuticals March 2024 ~$2B; Novartis prior tuck-ins Endocyte 2018 $2.1B + AAA 2018 $3.9B), (l) commercial trajectory (~$42-48K/cycle therapeutic; ~$3.5-5K diagnostic PET; total Pluvicto course ~$200K+). Without this template, radiopharm T3 reports would conflate diagnostic Ga-68 PSMA with therapeutic Lu-177 PSMA, miss isotope supply chain fragility, fail to address NRC/Authorized User institutional barriers. v2.5.0 release."
    - id: G30
      name: "Small Molecule Generic Ecosystem T3 modality template (task-modality-smallmol.md) loaded in addition to generic task-modality.md when query content invokes Hatch-Waxman/ANDA/Orange Book/Para IV terminology OR analytical scope addresses post-LOE small molecule landscape"
      mandatory: true
      applicable_to: ["T3"]
      conditional: "Only fires when modality under T3 analysis is small molecule (NCE) generic ecosystem, particularly when post-LOE generic landscape is analytically central. Default OFF for non-generic T3 queries. Trigger logic query-content-based per generic-by-default.md Article 5; user employer being a generics manufacturer (Teva, Sandoz, Mylan/Viatris, Sun Pharma, Aurobindo, Dr Reddy's, Cipla, Lupin, Hetero) and user geography being a generics manufacturing hub (India, Türkiye, Israel) are NOT valid triggers."
      rationale: "Small molecule generic ecosystem has unique disciplines distinct from biosimilars that generic task-modality.md cannot cover at sufficient depth: (a) Hatch-Waxman 1984 framework as foundational legislative compromise (patent term restoration up to 5 years for brands + ANDA pathway + Bolar exemption + 180-day FTF for generics), (b) FDCA exclusivity arithmetic (NCE 5-year per §505(j)(5)(F)(ii); clinical study 3-year per §505(j)(5)(F)(iii)-(iv); orphan 7-year per Orphan Drug Act 1983; pediatric +6 months per §505A BPCA 2002; GAIN Act +5 years for QIDP; RPD PRV market $50-500M tradeable), (c) ANDA application requirements (RLD identification + bioequivalence 80-125% 90% CI standard for AUC and Cmax + same active/dose form/route/strength + carve-out labeling + CMC + dissolution + ~$100K-$1M BE study cost), (d) Para IV certification framework (4 certification types — Para I/II/III/IV) + 30-month stay upon infringement suit within 45 days of notice letter + 180-day FTF exclusivity per §505(j)(5)(B)(iv) + forfeiture events (failure to launch within 75 days, settlement allowing later launch), (e) Orange Book + therapeutic equivalence ratings (AB-rated = automatic substitution at pharmacy; B-rated = requires prescriber authorization; Orange vs Purple Book contrast — Orange has patent listings, Purple does not), (f) Para IV settlement landscape with FTC v. Actavis 2013 reverse-payment antitrust scrutiny under rule of reason analysis + date-certain entry + AG license + side deal arrangements, (g) Authorized Generic strategy (pre-empt FTF, settlement consideration, defensive market preservation; Teva Copaxone + Pfizer Lipitor precedents), (h) 505(b)(2) hybrid pathway for reformulations + new indications + new dosage forms with 3-year clinical study exclusivity, (i) other jurisdictions (EMA Article 10 generic with 8+2+1 model; MHRA post-Brexit reliance; PMDA G1 generic policy; NMPA Volume-Based Procurement system since 2018 with 80-95% price reductions on selected molecules; India CDSCO + largest global generic ANDA filer; TİTCK Türk jenerik framework with %40 statutory discount more aggressive than biyobenzer %28 + eşdeğer grup SUT mechanic), (j) Türk yerli jenerik sponsor ekosistemi (Abdi İbrahim, Sanovel, Bilim İlaç, Deva, Eczacıbaşı, Pharmactive, Mustafa Nevzat/Pfizer, Pharmavision, Atabay, Nobel İlaç, Sandoz Türkiye), (k) generic manufacturing cost structure (API 15-40% + formulation 10-20% + regulatory <5% + distribution 30-50% + SG&A 15-25%), (l) LOE erosion curves (Day 1 ~80-90% brand share; 6 months ~30-50%; 12 months ~15-25%; 24 months ~5-10%; 36+ months <5%; net brand revenue erosion 90-95% within 24 months for blockbuster orals), (m) brand lifecycle defense strategies (reformulation patents, fixed-dose combinations, AG launch, branded follow-on Nexium/Prilosec precedent, OTC switch, prescriber+payer contracting, patient assistance). Without this template, small molecule T3 reports would conflate small molecule generic with biosimilar (radically different discount %, time-to-launch, substitution dynamics, sponsor economics), confuse Orange Book vs Purple Book frameworks, miss FTC v. Actavis antitrust scrutiny on settlements. Companion to G25 (biosimilar template) — together cover dominant follow-on modalities. v2.5.0 release."
    - id: G31
      name: "Peptide Therapeutics T3 niche modality template (task-modality-peptide.md) loaded in addition to generic task-modality.md when query content invokes peptide modality terminology (GLP-1, GnRH, somatostatin, PTH analog, etc.) OR analytical scope addresses obesity/T2D incretin landscape"
