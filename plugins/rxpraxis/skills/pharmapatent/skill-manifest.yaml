# ============================================================================
# Skill Manifest Protocol v1.0 — pharmapatent
# ============================================================================
# Declares pharmapatent's composability contract for SMP-compliant discovery.
# Enables smp-orchestrator to auto-suggest composition pipelines with
# medsearch + pharmaintel (upstream) and carbon-html-report / carbon-pptx /
# docx / lex-mercator / onko-erisim (downstream).
# ============================================================================

manifest_version: "1.0"
protocol_reference: "./SMP-v1.0"

# --- Skill Identity ----------------------------------------------------------
skill:
  name: pharmapatent
  version: "2.0.2"
  title: "Pharmaceutical Patent + Regulatory + Litigation Expertise Protocol"
  description: >
    Orchestrates **thirteen** operational modes (FTO, Invalidity, Landscape,
    Lifecycle, Regulatory, Litigation, Due Diligence, Opposition, Biosimilar
    Pathway, Licensing, Landscape Forecast, Expert Witness, **TR Regulatory
    Flow**) for pharmaceutical and medical device patent work in the Turkish
    + global context. **v2.0.1 patch** — Mevzuat MCP inventory confirmed;
    Türkiye triangle now fully active: **TİTCK MCP** (56 tools), **Türk
    Patent MCP** (6 tools), **Mevzuat MCP** (12 tools, revision
    `mevzuat-mcp-00017-668`, MCP SDK 1.27.0, protocolVersion 2024-11-05).
    Root cause of v2.0.0 PENDING state was content-negotiation incompatibility
    (FastMCP defaulted to text/event-stream Accept; JSON-only Claude.ai
    clients received 406); resolved by enabling JSON response mode in the
    server. Integrates SMK 6769, TRIPS, Doha Declaration, Customs Union 1/95,
    the Human Medicinal Products Regulation with its 6-year data exclusivity
    regime, the Medical Devices Regulation + ÜTS + CE + ISO 13485 device
    stack, TÜRKPATENT's 2024 Nice classification update (classes 09/39/44),
    Yargıtay 11. HD + FSHHM case law, and EPO G-decisions as interpretive
    authority. Search layer combines IPC/CPC taxonomy (A61K, A61M, A61B,
    B01D, C07D/C07K, C12N, G16H), Markush topology, multi-database
    triangulation (Orange Book, Purple Book, Espacenet, USPTO Public Search,
    TÜRKPATENT EPAAT via MCP, WIPO PATENTSCOPE, STN SciFinder, SureChEMBL),
    and BERT-based early-warning classifiers. Outputs thirteen
    provenance-stamped report types with strong/moderate/weak confidence
    grading and explicit residual-risk statements.
  author: "Mahir (internal skill)"
  license: "Internal skill asset, not for external redistribution"
  entry_point: "./SKILL.md"
  homepage: null

