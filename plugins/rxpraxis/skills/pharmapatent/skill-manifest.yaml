# --- Modes -------------------------------------------------------------------
operational_modes:
  - id: "mode-1-fto"
    name: "FTO (Faaliyet Serbestisi / Freedom to Operate)"
    description: "Assess whether a planned product can be marketed without infringing third-party active patents"
    steps: 9
    reference: "references/fto-invalidity-protokol.md §1"

  - id: "mode-2-invalidity"
    name: "Invalidity (Hükümsüzlük)"
    description: "Systematic prior art search to invalidate a competitor's patent"
    steps: 11
    reference: "references/fto-invalidity-protokol.md §2"

  - id: "mode-3-landscape"
    name: "Landscape (Patent Peyzajı)"
    description: "Full patent geography of a molecular target, modality, indication, or technology"
    reference: "references/rapor-sablonlari.md §3"

  - id: "mode-4-lifecycle"
    name: "Lifecycle (Portföy Yönetimi)"
    description: "Maximize or dismantle product lifecycle protection within legal bounds"
    reference: "references/rapor-sablonlari.md §4"

  - id: "mode-5-regulatory"
    name: "Regulatory (Ruhsat-Patent Entegrasyonu)"
    description: "Calculate market entry date integrating patent, data exclusivity, Bolar, device approvals"
    reference: "references/rapor-sablonlari.md §5"

  - id: "mode-6-litigation"
    name: "Litigation (Dava Savunusu)"
    description: "Build party arguments for FSHHM infringement, invalidity, interim injunctions"
    reference: "references/rapor-sablonlari.md §6"

  - id: "mode-7-due-diligence"
    name: "Due Diligence (M&A + Licensing DD)"
    description: "Target firm/asset patent portfolio DD — inventory, validity, coverage, FTO, valuation, red flags"
    reference: "references/rapor-sablonlari.md §7"
    since_version: "1.2.0"

  - id: "mode-8-opposition"
    name: "Opposition (EPO 9-month Opposition + TÜRKPATENT 3rd-Party Observation)"
    description: "Pre-grant or post-grant formal administrative/quasi-judicial challenge to patent validity"
    reference: "references/rapor-sablonlari.md §8"
    since_version: "1.2.0"

  - id: "mode-9-biosimilar-pathway"
    name: "Biosimilar Pathway (Biyobenzer Yol Haritası)"
    description: "Biosimilar development strategy — comparability, patent wall, regulatory, extrapolation, device, market"
    reference: "references/rapor-sablonlari.md §9"
    since_version: "1.2.0"

  - id: "mode-10-licensing"
    name: "Licensing (Lisans Müzakere)"
    description: "In/out-licensing financial modelling + legal framework — NPV+IRR+RFR, comparable transactions, BATNA/ZOPA, lex-mercator downstream integration"
    reference: "references/rapor-sablonlari.md (License Negotiation Memo)"
    since_version: "1.4.0"

  - id: "mode-11-landscape-forecast"
    name: "Landscape Forecast (BERT/NLP Patent Trend Öngörüsü)"
    description: "Advanced landscape analysis — emerging signals, competitor portfolio forecasting, white space analysis, semantic clustering via BERT/transformer NLP"
    reference: "references/rapor-sablonlari.md (Landscape Forecast Report)"
    since_version: "1.4.0"

  - id: "mode-12-expert-witness"
    name: "Expert Witness (FSHHM Bilirkişi Rapor Taslağı)"
    description: "Draft expert witness report for FSHHM — HMK m.266 compliant, independence declaration, claim construction, infringement/invalidity analysis, damage calculation (SMK m.151)"
    reference: "references/rapor-sablonlari.md §10"
    since_version: "1.4.0"

  - id: "mode-13-tr-regulatory-flow"
    name: "TR Regulatory Flow (Türk Regülatör + IP Akış Otomasyonu)"
    description: "MCP-first orchestration of the TR regulator + IP triangle — TİTCK MCP (56 tools) + Türk Patent MCP (6 tools) + Mevzuat MCP (PENDING). 13-step protocol producing the canonical TR Regulator + IP Dossier (master record + holder portfolio + equivalence/biosimilar cluster + ATC landscape + price chain + pipeline & exceptions + patent/trademark/design layer + legislation citations + cross-validation). Acts as the TR-input pre-processing layer for Modes 1, 4, 5, 6, 7, 9, 10, 12; also runs standalone."
    steps: 13
    reference: "references/turk-mcp-entegrasyonu.md"
    since_version: "2.0.0"
    primary_mcp_dependencies: ["titck-mcp", "turkpatent-mcp"]
    pending_mcp_dependencies: ["mevzuat-mcp"]

# --- Quality Gates -----------------------------------------------------------
quality_gates:
  - id: "G1"
    name: "Source provenance"
    description: "Every factual claim cited to primary source (patent office, TİTCK, EMA, FDA, Yargıtay) with access date"

  - id: "G2"
    name: "Priority date discipline"
    description: "Prior art searches anchored to target patent priority date; application date / publication date clearly distinguished"

  - id: "G3"
    name: "Geographic specificity"
    description: "Patent status stated per jurisdiction; 'patent is active' claims scoped to Turkey / EU / US / RoW separately"

  - id: "G4"
    name: "Annual fee verification"
    description: "For every TR patent cited as active, TÜRKPATENT EPAAT annual fee status confirmed"

  - id: "G5"
    name: "Markush scope analysis"
    description: "For small molecule FTO/Invalidity, Markush coverage analysis performed or its absence explicitly declared as an epistemic limit"

  - id: "G6"
    name: "Residual risk statement"
    description: "Report concludes with explicit residual risk / epistemic limits section"

  - id: "G7"
    name: "Confidence grading"
    description: "Strong / Moderate / Weak / Speculative grading applied to every argument family"

  - id: "G8"
    name: "Legal responsibility note"
    description: "Every output closes with a disclaimer requiring licensed counsel for final decisions"

