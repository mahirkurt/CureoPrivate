# --- Inputs ------------------------------------------------------------------
inputs:
  natural_language_query:
    description: "User query in Turkish or English, typically specifying a drug, a device, a patent, a modality, or a strategic question (pazara giriş, FTO, hükümsüzlük, landscape vb.)."
    type: "string"
    required: true
    examples:
      - "Atorvastatin için FTO raporu hazırla"
      - "EP3123456 patentinin Türkiye'de hükümsüzlüğü mümkün mü?"
      - "Anti-HER2 ADC modalitesinde patent peyzajı çıkar"
      - "Jenerik semaglutide ne zaman Türkiye'de piyasaya girebilir?"
      - "Roche'un Türkiye patent portföyünü analiz et"

  product_profile:
    description: "Optional structured input for FTO/Invalidity/Lifecycle modes — INN, SMILES, formulation, device, endikasyon."
    type: "object"
    required: false

  target_patent:
    description: "Optional target patent number (TR/EP/US/WO) for Invalidity or Landscape starting point."
    type: "string"
    required: false

# --- Outputs -----------------------------------------------------------------
outputs:
  format: "markdown | carbon-html | docx | pptx"
  structure: "Six standardized report templates per references/rapor-sablonlari.md"
  types:
    - "FTO Raporu (§1)"
    - "Invalidity Briefing (§2)"
    - "Landscape Raporu (§3)"
    - "Lifecycle Yol Haritası (§4)"
    - "Pazara Giriş Takvimi (§5)"
    - "Litigation Briefing (§6)"
    - "Due Diligence Report (§7)"
    - "Opposition Briefing (§8)"
    - "Biosimilar Pathway Briefing (§9)"
    - "Expert Witness Report Draft (§10)"
    - "TR Regulator + IP Dossier (§11) [v2.0.0]"
  provenance: "Per-claim citation with source + access date + confidence grade (strong / moderate / weak / speculative)"
  residual_risk: "Mandatory section declaring epistemic limits and undetected risks"

# --- Dependencies ------------------------------------------------------------
dependencies:
  required_skills: []
  recommended_upstream_skills:
    - name: "medsearch"
      purpose: "Non-patent literature prior art, clinical evidence synthesis for Invalidity and Landscape modes"
      composition_pattern: "medsearch → pharmapatent"
    - name: "pharmaintel"
      purpose: "Orange/Purple Book rapid lookup, competitor pipeline, SEC 10-K / EDGAR, catalyst tracking"
      composition_pattern: "pharmaintel → pharmapatent"
  recommended_downstream_skills:
    - name: "carbon-html-report"
      purpose: "FTO / Landscape / Lifecycle report rendering in IBM Carbon Design System HTML"
      composition_pattern: "pharmapatent → carbon-html-report"
    - name: "carbon-pptx"
      purpose: "Executive briefing deck for board / management"
      composition_pattern: "pharmapatent → carbon-pptx"
    - name: "docx"
      purpose: "Formal court documents (hükümsüzlük dilekçesi, tedbir talebi, delil listesi) — Word formatting"
      composition_pattern: "pharmapatent → docx"
    - name: "lex-mercator"
      purpose: "License agreement drafting / review for portfolio monetization or tech-transfer"
      composition_pattern: "pharmapatent → lex-mercator"
    - name: "onko-erisim"
      purpose: "SGK geri ödeme workflow post-LOE pricing intersection"
      composition_pattern: "pharmapatent → onko-erisim"

# --- MCP Connectors (v2.0.0) -------------------------------------------------
# Türk regülatör + IP üçgeni. Mod 13 (TR_REGULATORY_FLOW) için kanonik;
# Mod 1 / 4 / 5 / 7 / 9 / 10 / 12 için opsiyonel. Detay:
# references/turk-mcp-entegrasyonu.md
mcp_connectors:
  - id: "titck-mcp"
    name: "TİTCK MCP"
    server_url: "https://titck.cureonics.com/mcp"
    status: "active"
    tool_count: 66
    scope: >
      TR human medicinal products master dataset (master::barcode), holders
      canonical store with alias normalization, SNOMED CT substance map,
      ATC hierarchy + summary, price chain (FSF / depot / pharmacy / retail),
      reference prices, institutional fees, biosimilar group (oldest-first),
      shared-substance peers, equivalent products, first-in-class detection,
      regulation Article 23 applications, off-label oncology list (organ
      sheet filter), supply-tracked ingredients, additional monitoring (black
      triangle), authorization cancellations + withdrawal trend, batch
      release certificates, foreign / import ingredients, scheduling list,
      indexed PDF/DOCX documents (doctor information letters, label changes).
    canonical_for:
      - "TR product card (master record + SNOMED + ATC)"
      - "Holder portfolio (with alias normalization)"
      - "Equivalence + biosimilar cluster detection"
      - "Price chain + reference prices"
      - "Madde 23 application history"
      - "Off-label SUT-extension records"
      - "Withdrawal / authorization cancellation tracking"
      - "Batch release certificates (biologics)"
    required_in_modes: ["mode-5-regulatory", "mode-9-biosimilar", "mode-13-tr-regulatory-flow"]
    optional_in_modes: ["mode-1-fto", "mode-4-lifecycle", "mode-7-due-diligence", "mode-10-licensing", "mode-12-expert-witness"]

  - id: "turkpatent-mcp"
    name: "Türk Patent MCP"
    server_url: "https://markapatent-mcp.fastmcp.app/mcp"
    status: "active"
    tool_count: 6
    scope: >
      TÜRKPATENT search + detail across three asset classes — patents
      (national TR + EP validations, IPC/CPC + applicant + abstract +
      attorney filters), industrial designs (Locarno classification),
      trademarks (Nice classes including 5/10/35/44 critical for pharma).
    canonical_for:
      - "TR patent search by applicant / IPC / CPC / abstract"
      - "Patent bibliographic detail (filing/grant/status)"
      - "Trademark conflict analysis (generic similar marks)"
      - "Industrial design search (medical devices Locarno 28-03)"
    limitations:
      - "Claim text NOT included in get_patent_details (bibliographic only) — EPAAT web fallback for claim-by-claim analysis"
      - "FER (First Examination Report) content not exposed"
      - "Annual fee history limited"
      - "Citation network (forward/backward) not exposed — Espacenet INPADOC required"
    required_in_modes: ["mode-1-fto", "mode-4-lifecycle", "mode-13-tr-regulatory-flow"]
    optional_in_modes: ["mode-2-invalidity", "mode-3-landscape", "mode-6-litigation", "mode-7-due-diligence", "mode-12-expert-witness"]

  - id: "mevzuat-mcp"
    name: "Mevzuat MCP"
    server_url: "https://mevzuat.cureonics.com/mcp"
    cloud_run_revision: "mevzuat-mcp-00017-668"
    mcp_sdk_version: "1.27.0"
    protocol_version: "2024-11-05"
    status: "active"
    tool_count: 12
    activated_in_version: "2.0.1"
    scope: >
      mevzuat.gov.tr — kanun / yönetmelik / tebliğ / genelge full text search
      and retrieval. SMK 6769, BTÜ Ruhsatlandırma Yönetmeliği, TİTCK
      guidelines, Cumhurbaşkanlığı kararları, Resmî Gazete entries.
      Repealed-version comparison (551 KHK ↔ SMK 6769 transitions).
    canonical_for:
      - "Statute full text retrieval (SMK 6769, TBK, TTK)"
      - "Article-level text (e.g. SMK m.85 Bolar, m.138 invalidity)"
      - "Regulation full text (BTÜ Yönetmeliği, Tıbbi Cihaz Yönetmeliği)"
      - "Communiqué + circular search (SUT tebliğleri, TİTCK kılavuzları)"
      - "Repealed-version comparison"
      - "Resmî Gazete entry retrieval"
    out_of_scope:
      - "Yargıtay/Danıştay/AYM case law (use UYAP web fallback per references/ictihat-emsal.md §1)"
    required_in_modes: ["mode-5-regulatory", "mode-6-litigation", "mode-13-tr-regulatory-flow"]
    optional_in_modes: ["mode-1-fto", "mode-2-invalidity", "mode-7-due-diligence", "mode-12-expert-witness"]
    tools_inventory:
      version: "2.0.2"
      total_tools: 12
      categories:
        - id: "A"
          name: "Arama"
          tool_count: 3
          tools:
            - description: "mevzuat.gov.tr'de ara"
              expected_function: "search_mevzuat"
              role: "General full-text search across mevzuat.gov.tr; primary entry point"
            - description: "Mevzuat fihristinde ara"
              expected_function: "search_legislation_index | search_fihrist"
              role: "Hierarchical/structural search via the legislation table-of-contents"
            - description: "Mülga mevzuatta ara"
              expected_function: "search_repealed_legislation"
              role: "Search repealed legislation (e.g., 551 KHK, old TTK/TBK) for historical comparison"
        - id: "B"
          name: "Detay erişim"
          tool_count: 4
          tools:
            - description: "Ham mevzuat dosyası indir"
              expected_function: "download_raw_legislation_file"
              role: "Original PDF/DOCX download for archival + audit-trail"
            - description: "Mevzuat HTML içeriği"
              expected_function: "get_legislation_html"
              role: "Structured HTML preserving heading/article structure; preferred for report quotation"
            - description: "Mevzuat meta bilgisi"
              expected_function: "get_legislation_metadata"
              role: "Date, official gazette ref, issuing authority, repeal status, last amendment date — provenance-stamp essential"
            - description: "Mevzuat metni (PDF → text)"
              expected_function: "get_legislation_text"
              role: "Extracted plain text — best for search/quotation/cross-reference"
        - id: "C"
          name: "Tarih"
          tool_count: 1
          tools:
            - description: "Önceki mevzuat metinleri"
              expected_function: "get_previous_legislation_versions | get_amendment_history"
              role: "Version chain for amendment history (e.g., SMK 6769 article-by-article evolution; BTÜ Yönetmeliği pre/post 2022)"
        - id: "D"
          name: "Listeleme/Referans"
          tool_count: 2
          tools:
            - description: "Mevzuatı türe göre listele"
              expected_function: "list_legislation_by_type"
              role: "List all legislation under a given type code"
            - description: "Mevzuat tür kodları"
              expected_function: "get_legislation_type_codes"
              role: "All legislation type codes (kanun/KHK/yönetmelik/tebliğ/genelge); typically called once per session and cached"
        - id: "E"
          name: "Kompozit/Özel"
          tool_count: 2
          tools:
            - description: "Kapsamlı mevzuat semantik kanıt paketi"
              expected_function: "get_semantic_evidence_package"
              role: "High-level aggregator: collects all related legislation pieces semantically (e.g., 'Bolar' → SMK m.85 + BTÜ articles + TİTCK guideline)"
            - description: "1982 Anayasası"
              expected_function: "query_constitution_1982"
              role: "Constitution-specific specialized query support (Md. 17/56/90/35 critical for AYM individual application drug-access cases)"
      function_name_confirmation_status: >
        Expected snake_case function names above are inferred from standard
        FastMCP naming conventions and the Turkish tool descriptions provided
        by the skill owner. Canonical names will be confirmed via tool_search
        after Claude.ai connector index re-sync; if any differ, a v2.0.3
        cosmetic patch will replace placeholders with confirmed atoms.
        Behavior is unchanged — usage patterns in
        references/turk-mcp-entegrasyonu.md §4.4 are written category-first
        and remain stable.
    activation_post_mortem: >
      v2.0.0 reported PENDING because of content-negotiation incompatibility,
      not tool registry. FastMCP server defaulted to text/event-stream
      Accept; Claude.ai sends Accept: application/json (JSON-only) and
      received 406 Not Acceptable, surfaced silently as empty tools/list.
      Resolution: enabled JSON response mode in server.py:107 (FastMCP
      json_response flag). Regression tests added (test_http_app.py:48
      fresh-app helper + test_http_app.py:173 JSON-only initialize/tools/list
      test); 22 tests passed; deployed Cloud Run revision 00017-668. Public
      smoke confirmed: OAuth discovery 200, unauthorized mcp 401 challenge
      (expected), JSON-only initialize 200 application/json, tools/list 200
      application/json with tools_count=12, tools_empty=false. claude mcp
      list shows connector connected. No FastMCP decorator or Pydantic
      schema fix was needed; MCP SDK version verified at 1.27.0; transport
      was already streamable-http (not stdio) per http_app.py:545,547.
      Side-quest: gcloud context initially pointed to wrong project; correct
      deploy project per gcp-deploy.mjs:16 is cureonics-ai-hub.
    lessons_learned:
      - "FastMCP servers MUST enable json_response mode for Claude.ai compatibility"
      - "Empty tools/list with valid registry = check Accept header negotiation"
      - "Smoke test for new MCP connectors must verify tools_count > 0"
      - "Multi-project GCP organizations: verify gcloud context matches deploy target"

